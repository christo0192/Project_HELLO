# freshclam configuration for the Project HELLO API container.
#
# Replaces the Debian default, which is written for a root-owned, systemd-run
# updater. This container runs as an unprivileged user with no init system and
# no clamd, so the stock file's DatabaseOwner / UpdateLogFile / PidFile /
# NotifyClamd directives are either unusable or point at paths the runtime user
# cannot write.
#
# Installed root-owned and read-only: the unprivileged runtime user may READ
# this file and WRITE the database directory, and nothing else. It cannot
# rewrite its own updater configuration to point at a different mirror.

# The only path the runtime user owns.
DatabaseDirectory /var/lib/clamav

# Official ClamAV distribution endpoints.
DatabaseMirror database.clamav.net
DNSDatabaseInfo current.cvd.clamav.net

# Incremental (.cld) updates: a few hundred KB per refresh instead of ~113 MB.
ScriptedUpdates yes
CompressLocalDatabase no

# Verify every downloaded database before it replaces the live one. freshclam
# stages downloads in a temp file and installs by atomic rename, so a scan that
# is running concurrently either sees the old database or the new one — never a
# half-written file.
TestDatabases yes

# Bounded network behaviour. The supervisor also imposes a hard wall-clock
# timeout (AV_UPDATER_TIMEOUT_MS) on the whole process.
ConnectTimeout 30
ReceiveTimeout 300
MaxAttempts 3

# Run in the foreground and log to stdout: the supervisor owns scheduling, and
# the platform owns log collection. No daemon, no PID file, no socket.
Foreground yes
LogVerbose no
LogTime no
LogSyslog no

Bytecode true
