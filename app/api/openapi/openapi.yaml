            $ref: '#/components/schemas/ResumeConflict'
      additionalProperties: false

    # ── LiveKit ──────────────────────────────────────────────────────
    LiveKitStartResponse:
      type: object
      required: [session_id, room_name, url]
      properties:
        session_id:
          type: string
          format: uuid
        room_name:
          type: string
        url:
          type: string
      additionalProperties: false

    RecordingUploadResponse:
      type: object
      required: [object_key]
      properties:
        object_key:
          type: string
      additionalProperties: false

    CandidateCompleteResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [completed, already_completed]
      additionalProperties: false

    WorkerContext:
      type: object
      required: [session_id, candidate_id, role_id, candidate_name, room_name, status]
      properties:
        session_id:
          type: string
          format: uuid
        candidate_id:
          type: string
          format: uuid
        role_id:
          type: string
          format: uuid
          nullable: true
        candidate_name:
          type: string
          nullable: true
        room_name:
          type: string
        status:
          type: string
      additionalProperties: false

    WorkerContextResponse:
      type: object
      required: [ok, context]
      properties:
        ok:
          type: boolean
          const: true
        context:
          $ref: '#/components/schemas/WorkerContext'
      additionalProperties: false

    WorkerContextError:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
      additionalProperties: false

    PhoneWorkerError:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
          description: Stable snake_case code. Never a driver message and never a phone number.
      additionalProperties: false

    PhoneWorkerEventRequest:
      type: object
      required: [attempt_id, event_type]
      properties:
        attempt_id:
          type: string
          format: uuid
          description: The live attempt. Required for EVERY event: an engagement-scoped post cannot drive an attempt-scoped edge, and 0042 refuses one with attempt_required rather than applying half a transition.
        event_type:
          type: string
          description: CLOSED worker vocabulary. Narrower than apply_phone_event's open format on purpose — the provider's sip.originate_* verdicts are excluded because they charge a candidate's anti-harassment budget.
          enum:
            - classify.human
            - classify.machine
            - disclosure.delivered
            - disclosure.refused
            - candidate.opt_out
            - candidate.wrong_number
            - candidate.deferred_pre_disclosure
            - sip.participant_left
            - assessment.completed
            - assessment.aborted
        epoch:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: Fencing epoch. When omitted, 0042 fences against the epoch stored on the attempt, so a late callback from a superseded conversation is still recorded as stale_epoch rather than applied to a live one.
      additionalProperties: false

    PhoneWorkerEventResponse:
      type: object
      required: [ok, status, ignored_reason, duplicate]
      properties:
        ok:
          type: boolean
          description: True when the database reached a verdict, whether applied or ignored.
        status:
          type: string
          enum: [applied, ignored, attempt_required, invalid_source, invalid_event_type, invalid_provider_event_id, provider_event_id_required, unknown_status]
        ignored_reason:
          type: string
          nullable: true
          enum: [stale_epoch, unknown_attempt, terminal, unexpected_event, null]
          description: Why the event was recorded but not applied. `terminal` and `stale_epoch` both mean "this conversation is over, stop talking".
        duplicate:
          type: boolean
          description: True when a redelivery converged on the original verdict.
      additionalProperties: false

    PhoneWorkerAppointmentRequest:
      type: object
      required: [attempt_id, starts_at, duration_seconds]
      properties:
        attempt_id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
          description: ABSOLUTE UTC ISO-8601 with a literal Z. An offset or a naive datetime is refused rather than coerced — "18:30" means different instants to different readers, and the calendar is pinned to IST precisely so that ambiguity never enters.
        duration_seconds:
          type: integer
          minimum: 900
          maximum: 3600
          description: The 0042 appointment duration envelope, enforced identically here.
      additionalProperties: false

    PhoneWorkerAppointmentResponse:
      type: object
      required: [ok, status]
      properties:
        ok:
          type: boolean
          description: THE LOAD-BEARING FIELD. Only true is a booking. The worker speaks a confirmation on true and NEVER otherwise, so a lenient value here becomes a bot promising a callback that does not exist.
        status:
          type: string
          description: ok / ok_prereqs_pending are bookings. Everything else is a stable refusal, including unknown_status, which means no answer we understand was received and must never be read as success.
        appointment_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
      additionalProperties: false

    PhoneAssessmentStartRequest:
      type: object
      required: [attempt_id, session_id]
      properties:
        attempt_id:
          type: string
          format: uuid
          description: The live attempt. The engagement is resolved from it and must already be in_call.
        session_id:
          type: string
          format: uuid
          description: The session to bind. VERIFIED, never trusted — it must already name its own deterministic phone room in external_call_id and belong to the engagement's candidate.
      additionalProperties: false

    PhoneAssessmentPlanQuestion:
      type: object
      required: [key, text, mandatory, hint]
      properties:
        key:
          type: string
          description: The STABLE question identity the cursor and the progress trail point at. Never derived from prose and never from a turn count.
        text:
          type: string
        mandatory:
          type: boolean
        hint:
          type: string
          nullable: true
      additionalProperties: false

    PhoneAssessmentTurnEntry:
      type: object
      required: [turn_index, speaker, text]
      properties:
        turn_index:
          type: integer
          minimum: 0
        speaker:
          type: string
          enum: [bot, candidate]
        text:
          type: string
      additionalProperties: false

    PhoneAssessmentStateResponse:
      type: object
      required: [ok, status]
      properties:
        ok:
          type: boolean
          description: True only when the assessment may proceed. A refusal is never a reason to ask a question.
        status:
          type: string
          description: ok, or a stable refusal — already_scored, disclosure_not_delivered, engagement_terminal, invalid_role_template, plan_missing, session_already_bound, session_binding_mismatch, session_candidate_mismatch, session_not_active, unknown_attempt, unknown_session, unknown_status, invalid_request, phone_assessment_error. `already_scored` is the one that is not really a refusal: it means the screening is FINISHED and its acknowledgement was lost, and it is DISTINCT from session_not_active because the two demand opposite actions.
        context:
          type: object
          description: A strict SUBSET of the browser worker context. No candidate_id, no role_id, no room_name.
          required: [session_id, candidate_name, status]
          properties:
            session_id:
              type: string
              nullable: true
            candidate_name:
              type: string
              nullable: true
            status:
              type: string
              nullable: true
          additionalProperties: false
        plan:
          type: object
          required: [source, question_count, questions]
          properties:
            source:
              type: string
              nullable: true
              description: role_template when the role carried one, default when it did not.
            question_count:
              type: integer
              minimum: 0
            questions:
              type: array
              items:
                $ref: '#/components/schemas/PhoneAssessmentPlanQuestion'
          additionalProperties: false
        progress:
          type: object
          required: [cursor, next_key, completed_keys, plan_complete]
          properties:
            cursor:
              type: integer
              minimum: 0
            next_key:
              type: string
              nullable: true
              description: The key the cursor owes. Null once the plan is complete.
            completed_keys:
              type: array
              items:
                type: string
            plan_complete:
              type: boolean
          additionalProperties: false
        turns:
          type: array
          description: The persisted assessment transcript, in order, so a reconnecting leg can rehydrate the conversation instead of starting it again.
          items:
            $ref: '#/components/schemas/PhoneAssessmentTurnEntry'
        assessment_exists:
          type: boolean
        already_scored:
          type: boolean
          description: The session is `completed` AND a phone-sourced assessment row exists — a SCORED screening whose acknowledgement was lost. Derived in SQL rather than by each caller, because a two-part condition re-derived in three places is one remembered correctly in two of them. The only legitimate action on it is to post assessment.completed, which 0044 accepts because the row is there.
      additionalProperties: false

    PhoneAssessmentTurnRequest:
      type: object
      required: [session_id, question_key, expected_index, source_event_id, turns]
      properties:
        session_id:
          type: string
          format: uuid
        question_key:
          type: string
          description: Must be the key the cursor currently owes. Anything else is refused key_not_current, which is what stops a model skipping a mandatory question.
        expected_index:
          type: integer
          minimum: 0
          maximum: 99
          description: A compare-and-swap, not a hint. An omitted value is refused as firmly as a wrong one.
        source_event_id:
          type: string
          description: The caller's idempotency key. A retry after a lost response MUST reuse it, and is answered with the ORIGINAL success rather than appending the exchange twice.
        turns:
          type: array
          minItems: 2
          maxItems: 12
          description: The ordered exchange, opening with the ask and closing with the answer. Follow-ups on the same key ride inside this array.
          items:
            type: object
            required: [speaker, text]
            properties:
              speaker:
                type: string
                enum: [bot, candidate]
              text:
                type: string
                minLength: 1
                maxLength: 8000
            additionalProperties: false
      additionalProperties: false

    PhoneAssessmentTurnResponse:
      type: object
      required: [ok, status]
      properties:
        ok:
          type: boolean
          description: THE LOAD-BEARING FIELD. True only when the boundary is durable; a worker that does not see true must not ask the next question and must not claim a completion.
        status:
          type: string
          description: applied, or a stable refusal — stale_cursor, key_not_current, invalid_turns, plan_missing, plan_complete, session_not_active, unknown_session, unknown_status, invalid_request, phone_assessment_error.
        duplicate:
          type: boolean
          description: True when a retry converged on the original boundary.
        cursor:
          type: integer
          nullable: true
        question_count:
          type: integer
          nullable: true
        plan_complete:
          type: boolean
        expected_key:
          type: string
          nullable: true
          description: On key_not_current, the key the cursor actually owes.
      additionalProperties: false

    PhoneAssessmentCompleteRequest:
      type: object
      required: [attempt_id, session_id]
      properties:
        attempt_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
      additionalProperties: false

    PhoneAssessmentCompleteResponse:
      type: object
      required: [ok, status]
      properties:
        ok:
          type: boolean
          description: True only when an assessment row has been VERIFIED to exist. Only then may the worker post assessment.completed — and 0044 refuses that event anyway if the row is absent.
        status:
          type: string
          description: scored, or a stable refusal — plan_incomplete, completion_failed, scoring_failed, assessment_missing, session_not_active, plan_missing, unknown_session, unknown_status, invalid_request, phone_assessment_error.
        adopted:
          type: boolean
          description: True when the assessment row already existed and was ADOPTED rather than produced — nothing was re-scored and no second writeback occurred.
        cursor:
          type: integer
          nullable: true
        question_count:
          type: integer
          nullable: true
      additionalProperties: false

    InviteCreateResponse:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
          description: Plaintext 64-hex invite token (returned exactly once).
        expires_at:
          type: string
          format: date-time
      additionalProperties: false

    InviteExchangeResponse:
      type: object
      required: [grant_token, url, room_name, session_id, expires_at, livekit_token]
      properties:
        grant_token:
          type: string
        url:
          type: string
        room_name:
          type: string
        session_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        livekit_token:
          type: string
      additionalProperties: false

    RecordingGrantResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string
      additionalProperties: false

    # ── Recordings ───────────────────────────────────────────────────
    # 0038: recording-finalization convergence health (admin-only surface).
    RecordingFinalizeHealth:
      type: object
      required: [worker, halt, backlog, degraded, reasons]
      properties:
        worker:
          type: object
          description: IN-PROCESS scheduler heartbeat. `enabled=false` means THIS process has no runtime — never a fleet-wide claim.
          required: [enabled, running, loops]
          properties:
            enabled:
              type: boolean
            running:
              type: boolean
            loops:
              type: array
              items:
                type: object
                required: [name, running, lastTickAt, ticks, errors, consecutiveErrors, stale]
                properties:
                  name:
                    type: string
                    enum: [recording-finalize, recording-sweep, recording-reclaim, recording-reap]
                  running:
                    type: boolean
                  lastTickAt:
                    type: string
                    format: date-time
                    nullable: true
                  ticks:
                    type: integer
                  errors:
                    type: integer
                  consecutiveErrors:
                    type: integer
                  stale:
                    type: boolean
              additionalProperties: false
          additionalProperties: false
        halt:
          type: object
          nullable: true
          description: Operator kill switch. Null when this process has no runtime to read it through.
          required: [halted, reason, since, degraded]
          properties:
            halted:
              type: boolean
            reason:
              type: string
              nullable: true
              enum: [operator_pause, storage_incident, provider_incident, backlog_control]
            since:
              type: string
              format: date-time
              nullable: true
            degraded:
              type: boolean
              description: True when the flag could not be read and a cached or fail-open answer was served.
          additionalProperties: false
        backlog:
          type: object
          nullable: true
          description: DURABLE, multi-machine-safe counts read live from the database. Null means the read FAILED — never that the backlog is empty.
          required: [stuckCount, oldestStuckAgeSec, exhaustedCount, deferredByReason, queueDepth, oldestScheduledAt, oldestQueuedAgeSec, dlqDepth]
          properties:
            stuckCount:
              type: integer
            oldestStuckAgeSec:
              type: integer
              nullable: true
            exhaustedCount:
              type: integer
              description: Sessions that spent their deferral budget and stopped being swept. Any non-zero value needs a human decision.
            deferredByReason:
              type: object
              description: Per-reason counts, keyed by the bounded 0038 defer-reason allowlist.
              additionalProperties:
                type: integer
            queueDepth:
              type: integer
              description: Live recording.finalize jobs. Without this, "converging slowly" and "not converging" look identical.
            oldestScheduledAt:
              type: string
              format: date-time
              nullable: true
            oldestQueuedAgeSec:
              type: integer
              nullable: true
            dlqDepth:
              type: integer
          additionalProperties: false
        degraded:
          type: boolean
        reasons:
          type: array
          description: Sanitized codes only.
          items:
            type: string
            enum:
              - sweep_halted
              - halt_flag_unavailable
              - backlog_unavailable
              - finalize_exhausted
              - stuck_backlog_aging
              - queue_not_draining
              - finalize_dead_lettered
              - loop_stale
      additionalProperties: false

    RecordingDownloadResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string
      additionalProperties: false

    # REC-05 (F2): recording revocation request/response.
    RecordingRevokeRequest:
      type: object
      properties:
        reason:
          type: string
          description: Optional bounded human-readable revocation reason (<= 200 chars).
      additionalProperties: false

    RecordingRevokeResponse:
      type: object
      required: [ok, status, revoked_at]
      properties:
        ok:
          type: boolean
          const: true
        status:
          type: string
          enum: [revoked, already_revoked]
          description: revoked = transition (or evidence backfill) happened; already_revoked = idempotent retry, fully converged.
        revoked_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false

    # ── DSAR ─────────────────────────────────────────────────────────
    DSARRequest:
      type: object
      required: [id, candidateId, requestType, requestStatus, requestedBy, requestedAt, reviewedBy, reviewedAt, fulfilledAt, rejectionReason, legalHoldBlocked, notes, metadata, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        candidateId:
          type: string
          format: uuid
        requestType:
          type: string
          enum: [export, delete, correct, restrict]
        requestStatus:
          type: string
          enum: [pending, in_progress, fulfilled, rejected, cancelled]
        requestedBy:
          type: string
        requestedAt:
          type: string
          format: date-time
        reviewedBy:
          type: string
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        fulfilledAt:
          type: string
          format: date-time
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        legalHoldBlocked:
          type: boolean
        notes:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    DSARSessionItem:
      type: object
      required: [id, mode, status, started_at, ended_at, duration_sec]
      properties:
        id:
          type: string
          format: uuid
        mode:
          type: string
        status:
          type: string
        started_at:
          type: string
          format: date-time
          nullable: true
        ended_at:
          type: string
          format: date-time
          nullable: true
        duration_sec:
          type: integer
          nullable: true
      additionalProperties: false

    DSARAssessmentItem:
      type: object
      required: [id, overall_score, recommendation, summary, created_at]
      properties:
        id:
          type: string
          format: uuid
        overall_score:
          type: number
          nullable: true
        recommendation:
          type: string
