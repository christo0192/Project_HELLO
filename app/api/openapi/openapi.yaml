  /api/phone/halt:
    post:
      tags: [phone]
      operationId: setPhoneHalt
      summary: Raise the phone admission kill switch
      description: Admin only. Delegates to set_phone_halt. An explicit reason from the 0042 vocabulary is required. Repeated halts PRESERVE the original instant, reason and actor, and already_halted says so. The audit is fail-closed — if the sink fails, the halt this call CAUSED is rolled back and the response is 500 with rolled_back true; a halt that was already in force is not rolled back, because our call changed nothing and lifting it would undo somebody else's decision.
