            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    post:
      tags: [admin]
      operationId: addAdminAllowlistEntry
      summary: Add an allowlist email via the atomic add_allowlist_entry RPC (audit in the same transaction; metadata never contains the full email). Actor derived from auth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAllowlistAddRequest'
      responses:
        '201':
          description: Entry created (active by default).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAllowlistAddResponse'
        '400':
          description: invalid_email / invalid_role (server-side normalization identical to the resolver).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Non-admin denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: duplicate normalized email (case/whitespace variants conflict).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/admin/allowlist/{id}:
    patch:
      tags: [admin]
      operationId: updateAdminAllowlistEntry
      summary: Update/disable/demote an allowlist entry via the atomic update_allowlist_entry RPC (audit in the same transaction). Self-disable/demote and last-linked-active-admin removal are rejected.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAllowlistUpdateRequest'
      responses:
        '200':
          description: Entry updated (propagated to the linked membership row).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAllowlistUpdateResponse'
        '400':
          description: invalid_role / no_changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Non-admin denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Entry not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: self_modification_denied / last_linked_active_admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  # ── Phase 9: recruiter notes + candidate status transitions ────────
  /api/notes:
    get:
      tags: [notes]
      operationId: listNotes
      summary: Append-only recruiter notes for a candidate (viewer read-only, ownership-scoped).
      parameters:
        - name: candidate_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Bounded note list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteListResponse'
        '403':
          description: Non-owner or viewer mutation denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    post:
      tags: [notes]
      operationId: createNote
      summary: Append a bounded note (interviewer+/admin, ownership).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteCreateRequest'
      responses:
        '201':
          description: Note appended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'
        '400':
          description: Bounded body rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Non-owner denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/notes/{candidateId}/status:
    post:
      tags: [notes]
      operationId: updateCandidateStatus
      summary: Allowlisted CAS candidate status transition; fails closed while decision_use_blocked_at is set.
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteStatusUpdateRequest'
      responses:
        '200':
          description: Transition applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusTransitionResponse'
        '400':
          description: Illegal transition or unknown status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Non-owner denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Candidate not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: decision_use_blocked or status_conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  # ── Phase 9: candidate pre-join consent (invite-opaque, public) ────
  /api/candidate-consent/status:
    post:
      tags: [consent]
      operationId: getCandidateConsentStatus
      summary: Bounded consent/template status for an opaque invite token. Public — token validated inline.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateConsentStatusRequest'
      responses:
        '200':
          description: Bounded status — no candidate_id/PII/token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateConsentStatusResponse'
        '400':
          description: Malformed body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: invite_token_invalid_or_expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/candidate-consent/template:
    get:
      tags: [consent]
      operationId: getCandidateConsentTemplate
      summary: Active versioned consent template for a bounded locale. Public. Absence fails closed (404).
      security: []
      parameters:
        - name: locale
          in: query
          required: false
          schema:
            type: string
            pattern: '^[a-z]{2}(-[A-Z]{2})?$'
      responses:
        '200':
          description: Active template only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateConsentTemplateResponse'
        '404':
          description: consent_template_unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/candidate-consent/submit:
    post:
      tags: [consent]
      operationId: submitCandidateConsent
      summary: Append-only consent grant/decline bound to an opaque invite. Public — invite validated inline, never consumed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateConsentSubmitRequest'
      responses:
        '201':
          description: Consent recorded; proof carries invite/session binding only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateConsentSubmitResponse'
        '400':
          description: required_consents_missing or malformed body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: invite_token_invalid_or_expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: Consent template unavailable (fail closed, stable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  # ── Phase 9: notification intents (recruiter status query) ────────
  /api/notifications:
    get:
      tags: [notifications]
      operationId: listNotificationIntents
      summary: Recruiter (interviewer+) notification intents — own/authorized only, no contact/token material.
      responses:
        '200':
          description: Bounded intent list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationIntentListResponse'
        '403':
          description: Viewer denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  # ── Phase 9: CSV scorecard export (ownership-scoped) ──────────────
  /api/export/{candidateId}/csv:
    get:
      tags: [export]
      operationId: exportCandidateCsv
      summary: Ownership-scoped, data-minimized scorecard CSV (RFC4180 + BOM, formula-neutralized). No PDF claim.
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: CSV attachment.
          content:
            text/csv:
              schema:
                type: string
        '403':
          description: Non-owner denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Candidate not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  # ── Phase 9: appeals (separate grants table; immutable review events) ─
  /api/appeals/grants:
    post:
      tags: [appeals]
      operationId: issueAppealGrant
      summary: Issue a one-time appeal grant (SHA-256 digest persisted; plaintext returned once). Interviewer+/admin, ownership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppealGrantCreateRequest'
      responses:
        '201':
          description: One-time plaintext grant token + expiry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppealGrantResponse'
        '400':
          description: candidate_session_mismatch or invalid expiry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Non-owner denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Candidate or session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/appeals:
    get:
      tags: [appeals]
      operationId: listAppeals
      summary: Recruiter appeal list scoped to one candidate (viewer read-only).
      parameters:
        - name: candidate_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Bounded appeal rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppealListResponse'
        '403':
          description: Non-owner denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    post:
      tags: [appeals]
      operationId: submitAppeal
      summary: Public candidate appeal submission (grant-authenticated). Server-built minimized snapshot; atomic create_appeal RPC.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppealCreateRequest'
      responses:
        '201':
          description: Appeal created; decision_use_blocked_at set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppealCreateResponse'
        '400':
          description: Malformed body or invalid grant digest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: appeal_grant_invalid_or_expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: no_assessment_for_appeal or grant consumed/revoked/expired/mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/appeals/{appealId}/review:
    post:
      tags: [appeals]
      operationId: reviewAppeal
      summary: Legal CAS review via atomic review_appeal RPC (immutable appeal_review_events). Interviewer+/admin, ownership.
      parameters:
        - name: appealId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppealReviewRequest'
      responses:
        '200':
          description: Review recorded (or no-op).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppealReviewResponse'
        '400':
          description: Invalid transition/target/notes/evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Appeal not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: appeal_already_final.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Supabase Auth bearer JWT, validated server-side via getUser(). Single factor — no MFA/AAL2 requirement (ADR-0011). Authorization is an active entry in the server-held email allowlist plus the role held there, resolved on every request.
    grantToken:
      type: apiKey
      in: header
      name: x-grant-token
      description: 64-hex candidate access grant token bound to one session.
    workerBearer:
      type: http
      scheme: bearer
      description: Worker bearer credential (env WORKER_CONTEXT_SECRET, timing-safe compare).

  schemas:
    # ── Common errors ────────────────────────────────────────────────
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, message]
          properties:
            type:
              type: string
              description: Stable error type code.
            message:
              type: string
            details:
              type: array
              items:
                type: object
                required: [field, code, message]
                properties:
                  field:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
      additionalProperties: false

    SimpleError:
      type: object
      required: [error]
      properties:
        error:
          type: string
      additionalProperties: false

    RoomUnavailableError:
      description: Just-in-time LiveKit room/egress provisioning failed. The one-time invite is left unconsumed and the join is retryable.
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: ['screening_room_unavailable']
      additionalProperties: false

    MaintenanceBlockedBody:
      description: New joins are blocked by maintenance mode. The one-time invite is left unconsumed.
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type]
          properties:
            type:
              type: string
              enum: ['maintenance_mode']
            message:
              type: string
      additionalProperties: false

    AuthErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, message]
          properties:
            type:
              type: string
              enum: [authentication_error, authorization_error]
            message:
              type: string
      additionalProperties: false

    DSARForbidden:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, message]
          properties:
            type:
              type: string
            message:
              type: string
      additionalProperties: false

    DSARNotFound:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, message]
          properties:
            type:
              type: string
            message:
              type: string
      additionalProperties: false

    # ── Health ───────────────────────────────────────────────────────
    HealthResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
      additionalProperties: false

    AshbyWebhookAck:
      type: object
      required: [ok, status]
      properties:
        ok:
          type: boolean
        status:
          type: string
      additionalProperties: false

    AshbyWebhookError:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
        error:
          type: string
      additionalProperties: false

    AshbyMcMapping:
      type: object
      required: [id, externalJobId, status, deliveryMode, hasAiStage, hasTaStage, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        externalJobId:
          type: string
        status:
          type: string
          enum: [paused, enabled, drift]
        statusReason:
          type: string
          nullable: true
        deliveryMode:
          type: string
        hasAiStage:
          type: boolean
        hasTaStage:
          type: boolean
        label:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    AshbyMcMappingsResponse:
      type: object
      required: [ok, mappings]
      properties:
        ok:
          type: boolean
        mappings:
          type: array
          items:
            $ref: '#/components/schemas/AshbyMcMapping'
      additionalProperties: false

    AshbyIntegrationState:
      type: object
      required: [enabled, webhookSecretConfigured, active]
      properties:
        enabled:
          type: boolean
        webhookSecretConfigured:
          type: boolean
        active:
          type: boolean
      additionalProperties: false

    AshbyRuntimeState:
      type: object
      required:
        - runtimeEnabled
        - apiKeyConfigured
        - resumeAllowlistEnabled
        - resumeAllowlistCount
        - active
        - signalPollMs
        - operationPollMs
        - reconcileIntervalMs
        - reclaimIntervalMs
        - leaseSeconds
      properties:
        runtimeEnabled:
          type: boolean
        apiKeyConfigured:
          type: boolean
        resumeAllowlistEnabled:
          type: boolean
        resumeAllowlistCount:
          description: Count only — the hostnames themselves are tenant-identifying and are never disclosed.
          type: integer
        active:
          type: boolean
        signalPollMs:
          type: integer
        operationPollMs:
          type: integer
        reconcileIntervalMs:
          type: integer
        reclaimIntervalMs:
          type: integer
        leaseSeconds:
          type: integer
      additionalProperties: false

    AshbyScannerState:
      description: Resume malware-scanner readiness. `clamscan` exits 0 on a clean file whatever its signature database age, so an installed binary is not evidence that anything was screened; `ready` is true only for ClamAV with a database that is present, parseable and within the configured maximum age. Sanitized — no path, ClamAV or signature version, mirror, hostname, filename, or candidate field.
      type: object
      required:
        - mode
        - ready
        - signatureAgeSec
        - maxAgeSec
        - reason
      properties:
        mode:
          description: Which scanner the configuration selects.
          type: string
          enum: [clamav, test, fail-closed]
        ready:
          description: True only when this scanner can currently accept a file on production evidence. The development test scanner is never ready.
          type: boolean
        signatureAgeSec:
          description: Age of the signature database in seconds; null when it could not be read.
          type: integer
          nullable: true
        maxAgeSec:
          description: Age ceiling this verdict was measured against; null when not applicable.
          type: integer
          nullable: true
        reason:
          description: Stable reason code when not ready (signature-state, capability-failure, scanner_busy, test_scanner, or scanner_not_configured); null when ready.
          type: string
          nullable: true
    AshbyRuntimeHealthResponse:
      type: object
      required: [ok, integration, runtime, scanner, provider]
      properties:
        ok:
          type: boolean
        integration:
          $ref: '#/components/schemas/AshbyIntegrationState'
        runtime:
          $ref: '#/components/schemas/AshbyRuntimeState'
        scanner:
          $ref: '#/components/schemas/AshbyScannerState'
        reconcile:
          description: Last reconciliation pass observed by THIS process, or null when this process has run none (never a fleet-wide claim, and never a claim that no reconciliation happened). Counts and sanitized codes only.
          nullable: true
          $ref: '#/components/schemas/AshbyReconcilePassState'
        provider:
          description: Always "unknown" — this handler contacts no provider, so it makes no live-connectivity claim.
          type: string
      additionalProperties: false

    AshbyReconcileSkipState:
      type: object
      required: [noApplicationId, noEnabledMapping, stageNotAi, ambiguousMapping]
      properties:
        noApplicationId:
          description: Rows with no usable application id.
          type: integer
        noEnabledMapping:
          description: Rows whose job has no ENABLED mapping (unmapped, paused, or drifted).
          type: integer
        stageNotAi:
          description: Rows on a mapped, enabled job but at some stage other than its AI screening stage.
          type: integer
        ambiguousMapping:
          description: Rows whose job had conflicting AI stages in the index — never guessed.
          type: integer
      additionalProperties: false

    AshbyReconcilePassState:
      description: Sanitized counts from the last reconciliation pass. No application, job, stage, candidate, mapping, or tenant identifier appears here. On a pass that reached a normal stop, observed = admitted + sum(skipped); on an aborted pass (enqueue_cap / unclassified_cap) the row that tripped the bound is observed but neither admitted nor skipped.
      type: object
      required: [stop, mode, observed, admitted, skipped, unclassified, enabledMappings, mappingIndexTruncated, recovered, duplicates, enqueued, advanced, observedAt]
      properties:
        stop:
          description: Sanitized stop code — drained, page_cap, item_cap, deadline, enqueue_cap, or unclassified_cap.
          type: string
        mode:
          description: full or incremental.
          type: string
        observed:
          description: Applications seen on the pages read.
          type: integer
        admitted:
          description: Applications that passed admission, including fail-open unclassified rows. Must be 0 while every mapping is paused.
          type: integer
        skipped:
          $ref: '#/components/schemas/AshbyReconcileSkipState'
        unclassified:
          description: Rows admitted fail-open because their job or stage id was unreadable. A sustained non-zero value indicates provider list-schema drift.
          type: integer
        enabledMappings:
          description: Enabled mappings in this pass's admission index. 0 means nothing could be admitted.
          type: integer
        mappingIndexTruncated:
          description: True when more enabled mappings exist than the per-run bound.
          type: boolean
        recovered:
          description: Newly recorded stage receipts (dropped-webhook recovery).
          type: integer
        duplicates:
          description: Admitted applications whose receipt already existed.
          type: integer
        enqueued:
          description: Signal jobs enqueued by this pass. Non-zero alongside a climbing no_progress_runs means real backlog progress, not a stuck stream.
          type: integer
        advanced:
          description: Whether the opaque cursor advanced (only on a fully drained pass).
          type: boolean
        observedAt:
          description: When this pass was published. Never a provider timestamp.
          type: string
          format: date-time
      additionalProperties: false

    AshbyProbeStage:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
        title:
          type: string
          nullable: true
      additionalProperties: false

    AshbyProbeStagesResponse:
      type: object
      required: [ok, stages, empty]
      properties:
        ok:
          type: boolean
        stages:
          type: array
          items:
            $ref: '#/components/schemas/AshbyProbeStage'
        empty:
          type: boolean
      additionalProperties: false

    AshbyFormOption:
      type: object
      description: One selectable value of a rating/select field — the scale, never an answer.
      required: [value, label]
      properties:
        value:
          type: string
          nullable: true
        label:
          type: string
          nullable: true
      additionalProperties: false

    AshbyFormField:
      type: object
      description: One sanitized form field. Structure only; never a submitted value.
      required: [id, title, path, type, required, options, optionsTruncated]
      properties:
        id:
          type: string
        title:
          type: string
          nullable: true
        path:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        required:
          type: boolean
          nullable: true
          description: From the payload's isRequired only. null means the payload did not say — never inferred.
        options:
          type: array
          items:
            $ref: '#/components/schemas/AshbyFormOption'
        optionsTruncated:
          type: boolean
      additionalProperties: false

    AshbyFormSection:
      type: object
      required: [id, title, fields]
      properties:
        id:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        fields:
          type: array
          items:
            $ref: '#/components/schemas/AshbyFormField'
      additionalProperties: false

    AshbyFeedbackForm:
      type: object
      required: [formDefinitionId, title, interviewId, interviewTitle, stageId, stageTitle, sections, fieldCount, schemaAvailable]
      properties:
        formDefinitionId:
          type: string
        title:
          type: string
          nullable: true
        interviewId:
          type: string
          nullable: true
        interviewTitle:
          type: string
          nullable: true
        stageId:
          type: string
          nullable: true
        stageTitle:
          type: string
          nullable: true
        sections:
          type: array
          items:
