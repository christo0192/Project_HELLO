  # ── Phone screening operator API (P6) ───────────────────────────
  # Internal calendar, engagement, health and control surface over
  # migration 0042. Reads are interviewer+, every mutation is admin-only
  # and delegates to a 0042 SECURITY DEFINER RPC. Disabled by default.
  /api/phone/calendar:
    get:
      tags: [phone]
      operationId: getPhoneCalendar
      summary: Internal phone screening appointments in a UTC range
      description: Interviewer role or above. Sanitized operator projection — opaque ids, closed-vocabulary states, the candidate display name, ATS reference and pipeline status, and IST display times. Never a phone number, a suppression digest, a SIP call id, a room name, a participant identity, an egress id, a lease token or owner, a provider event id, provider metadata or a transcript. Both bounds are UTC ISO-8601 with a literal Z; an offset or a naive datetime is refused. The range is half-open and at most 31 days. Results are capped at 200 rows and report truncation rather than dropping rows silently. While PHONE_SCREENING_ENABLED is off the route answers with enabled=false and an empty list, having performed no database work.
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          description: Inclusive lower bound on the appointment start, UTC ISO-8601.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: Exclusive upper bound on the appointment start, UTC ISO-8601.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Sanitized appointments in the requested range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneCalendarResponse'
        '400':
          description: Shape validation failed — a non-UTC instant, a reversed or empty range, a range wider than 31 days, or an unexpected query key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: phone_read_error — the projection could not be read. Never a driver message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneApiError'
        '401':
          description: No bearer token, or a token the server could not validate. Emitted by the global auth middleware before the router is reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorBody'
        '403':
          description: Authenticated but insufficiently privileged — reads need interviewer or above, every mutation needs admin, and the global viewer read-only guard rejects a viewer mutation before the role gate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorBody'
        '429':
          description: Per-user rate limit exceeded. NOT a health signal — retry, do not report degraded. This mount uses the default bucket precisely so an operator poll of /api/phone/health cannot be throttled into looking degraded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/phone/calendar/slots:
    get:
      tags: [phone]
      operationId: getPhoneCalendarSlots
      summary: One IST day's slot grid, projected against live appointments
      description: Interviewer role or above. The grid runs from the 0900 IST open to the 2100 IST close on all seven days, stepped by the configured slot length, which is clamped into the same 900 to 3600 second envelope the 0042 duration CHECK enforces. Each slot reports booked (live appointments overlapping it), the fleet cap mirrored from phone_max_concurrent, and remaining. IMPORTANT — 0042 has no per-slot capacity model and consumes the fleet cap at dial time, not at booking time, so remaining is an advisory projection rather than a reservation. Refusals are stable codes. A final slot may end after the close because the window bounds only the start.
