  /api/phone/health:
    get:
      tags: [phone]
      operationId: getPhoneHealth
      summary: Phone screening backlog, halt, window and concurrency
      description: Interviewer role or above. Booleans, bounded integers, counts and stable codes ONLY. A missing phone_control singleton reads as HALTED, matching 0042's fail-closed admission. When the backlog cannot be read every count block becomes null and the status degrades — a zero would say there is none, which is not the same answer. The five ingress verdicts stay split because a stale epoch is fencing working as designed while an unknown attempt is an ingress describing a call we have no record of. Also publishes the four P1 substrate residuals, each drift-tested against 0042.
