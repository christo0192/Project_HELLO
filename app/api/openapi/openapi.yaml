  /api/phone/appointments/{id}:
    patch:
      tags: [phone]
      operationId: reschedulePhoneAppointment
      summary: Reschedule a live appointment, superseding it atomically
      description: Admin only. Rescheduling is schedule_phone_appointment with an expected version — it supersedes the live row and inserts the new one inside ONE transaction under the engagement row lock. There is deliberately no cancel-then-book, which would leave a window in which the candidate has no slot at all. The path id is resolved first to find the engagement and to refuse a request aimed at a row that is no longer live; the RPC re-checks the version under the lock and stays the authority, so superseded_appointment_id is returned verbatim from the RPC rather than echoed back from the path.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The live appointment being moved.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneAppointmentPatchBody'
      responses:
