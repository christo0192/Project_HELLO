        body_md:
          type: string
        required_consents:
          type: array
          items:
            type: string
      additionalProperties: false

    CandidateConsentSubmitRequest:
      type: object
      required: [invite_token, template_version, locale, consents, status]
      properties:
        invite_token:
          type: string
          pattern: '^[a-f0-9]{64}$'
        template_version:
          type: string
          minLength: 1
          maxLength: 64
        locale:
          type: string
          pattern: '^[a-z]{2}(-[A-Z]{2})?$'
        consents:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [granted, declined]
      additionalProperties: false

    CandidateConsentSubmitResponse:
      type: object
      required: [id, status, consents, template_version, locale, created_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [granted, declined]
        consents:
          type: array
          items:
            type: string
        template_version:
          type: string
        locale:
          type: string
        created_at:
          type: string
          format: date-time
      additionalProperties: false

    # ── Phase 9: notification intents ────────────────────────────────
    NotificationIntentResponse:
      type: object
      required: [id, kind, candidate_id, consent_verified, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [quota_warning, assessment_ready, appeal_resolved]
        candidate_id:
          type: string
          format: uuid
          nullable: true
        consent_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
      additionalProperties: false

    NotificationIntentListResponse:
      type: object
      required: [intents]
      properties:
        intents:
          type: array
          items:
            $ref: '#/components/schemas/NotificationIntentResponse'
      additionalProperties: false

    # ── Phase 9: appeals ─────────────────────────────────────────────
    AppealGrantCreateRequest:
      type: object
      required: [candidate_id, session_id, expires_in_hours]
      properties:
        candidate_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        expires_in_hours:
          type: integer
          minimum: 1
          maximum: 72
      additionalProperties: false

    AppealGrantResponse:
      type: object
      required: [appeal_grant_token, expires_at]
      properties:
        appeal_grant_token:
          type: string
          pattern: '^[a-f0-9]{64}$'
        expires_at:
          type: string
          format: date-time
      additionalProperties: false

    AppealCreateRequest:
      type: object
      required: [appeal_grant_token, category, description]
      properties:
        appeal_grant_token:
          type: string
          pattern: '^[a-f0-9]{64}$'
        category:
          type: string
          enum: [scoring, recording, accessibility, other]
        description:
          type: string
          minLength: 1
          maxLength: 2000
      additionalProperties: false

    AppealCreateResponse:
      type: object
      required: [ok, appeal_id]
      properties:
        ok:
          type: boolean
        appeal_id:
          type: string
          format: uuid
      additionalProperties: false

    AppealRow:
      type: object
      required: [id, candidate_id, session_id, assessment_id, category, description, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        candidate_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        assessment_id:
          type: string
          format: uuid
          nullable: true
        category:
          type: string
        description:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false

    AppealListResponse:
      type: object
      required: [appeals]
      properties:
        appeals:
          type: array
          items:
            $ref: '#/components/schemas/AppealRow'
      additionalProperties: false

    AppealReviewRequest:
      type: object
      required: [to_status]
      properties:
        to_status:
          type: string
          enum: [under_review, granted, denied]
        notes:
          type: string
          maxLength: 2000
        evidence:
          type: object
          additionalProperties: true
      additionalProperties: false

    AppealReviewResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
      additionalProperties: false

    # ── Phone screening operator API (P6) ────────────────────────
    PhoneApiError:
      description: The stable error envelope of the phone operator surface. The code is always a snake_case constant, never a driver message, a constraint name or a row value.
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
        error:
          type: string
        rolled_back:
          description: Present only on phone_audit_write_failed. True means the mutation this call caused was fully undone — which happens on POST /halt/clear and nowhere else. POST /halt deliberately never undoes a raised kill switch, and an appointment supersede is not reversible at all.
          type: boolean
        appointment_rolled_back:
          description: Present only on the PATCH lost-update path. Deliberately NARROWER than rolled_back — the stray appointment is cancelled, but the ENGAGEMENT is not restored: the insert may have promoted it to scheduled and the compensating cancel drives it to eligible with next_eligible_at set to now. Nothing in 0042 can put the original state or pacing stamp back. Bounded — the per-IST-day attempt index still prevents an extra dial — but next_eligible_at may read as eligible now when the real pacing was the next IST day.
          type: boolean
      additionalProperties: false

    PhoneWindow:
      description: The approved IST calling window, mirrored from phone_ist_window_open_at and phone_ist_window_close_at. Open is inclusive, close is exclusive, and every one of the seven days is a calling day.
      type: object
      required: [time_zone, open_ist, close_ist]
      properties:
        time_zone:
          type: string
        open_ist:
          type: string
        close_ist:
          type: string
      additionalProperties: false

    PhoneCandidateRef:
      description: The candidate fields an operator calendar may show. Never an email address, a phone number in any form, a resume, or parsed resume content.
      type: object
      required: [id, name, status, reference]
      properties:
        id:
          type: string
          format: uuid
        name:
          description: Display name. Null when the candidate row carries none.
          type: string
          nullable: true
        status:
          description: The candidate's pipeline status.
          type: string
        reference:
          description: The ATS external reference, or null for a candidate that never came from an ATS. No substitute is invented for that case.
          type: string
          nullable: true
      additionalProperties: false

    PhoneAppointment:
      description: One row of screening_v2.phone_appointments, minus created_by (an operator identity that is never read).
      type: object
      required: [id, engagement_id, starts_at, ends_at, ist_date, ist_start, ist_end, status, source, confirmed_at, cancel_reason, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        engagement_id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        ist_date:
          description: The IST calendar date, derived by a 0042 trigger and impossible for a caller to falsify.
          type: string
        ist_start:
          description: IST wall clock HH-MM of the start, so no client re-derives the time zone.
          type: string
          nullable: true
        ist_end:
          type: string
          nullable: true
        status:
          type: string
          enum: [scheduled, confirmed, cancelled, superseded, fulfilled, missed]
        source:
          type: string
          enum: [candidate_voice, hr_manual, system_deferral]
        confirmed_at:
          description: ALWAYS null today. Nothing in migration 0042 writes it — an appointment is confirmed when the bot reads the slot back to the candidate, which is a voice event owned by a later phase. Reported rather than dropped so the residual stays visible; see the appointment_confirmed_has_no_writer entry on the health surface.
          type: string
          format: date-time
          nullable: true
        cancel_reason:
          type: string
          nullable: true
        version:
          description: Optimistic-concurrency token. Required on reschedule and cancel.
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false

    PhoneCalendarAppointment:
      description: A calendar row — one appointment plus the engagement state and candidate reference it belongs to. engagement_state and candidate are null only on a torn read between the batched queries, never as a guess.
      type: object
      required: [id, engagement_id, starts_at, ends_at, ist_date, ist_start, ist_end, status, source, confirmed_at, cancel_reason, version, created_at, updated_at, engagement_state, candidate]
      properties:
        id:
          type: string
          format: uuid
        engagement_id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        ist_date:
          type: string
        ist_start:
          type: string
          nullable: true
        ist_end:
          type: string
          nullable: true
        status:
          type: string
          enum: [scheduled, confirmed, cancelled, superseded, fulfilled, missed]
        source:
          type: string
          enum: [candidate_voice, hr_manual, system_deferral]
        confirmed_at:
          type: string
          format: date-time
          nullable: true
        cancel_reason:
          type: string
          nullable: true
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        engagement_state:
          type: string
          nullable: true
          enum: [pending_prereqs, eligible, scheduled, dialing, in_call, reconnecting, awaiting_retry, completed, abandoned_no_answer, opted_out, wrong_number, failed, cancelled]
        candidate:
          nullable: true
          $ref: '#/components/schemas/PhoneCandidateRef'
      additionalProperties: false

    PhoneCalendarResponse:
      type: object
      required: [ok, enabled, range, window, count, truncated, appointments]
      properties:
        ok:
          type: boolean
        enabled:
          description: False while PHONE_SCREENING_ENABLED is off, in which case the list is empty and no database work was performed.
          type: boolean
        range:
          $ref: '#/components/schemas/PhoneCalendarRange'
        window:
          $ref: '#/components/schemas/PhoneWindow'
        count:
          type: integer
        truncated:
          description: True when the range held more than the 200-row cap. Rows are never dropped silently.
          type: boolean
        appointments:
          type: array
          items:
            $ref: '#/components/schemas/PhoneCalendarAppointment'
      additionalProperties: false

    PhoneCalendarRange:
      description: The half-open UTC range that was queried, echoed back verbatim.
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
      additionalProperties: false

    PhoneSlot:
      description: One grid slot. booked and max_concurrent are database facts; remaining is arithmetic over them. remaining is an ADVISORY projection of a dial-time cap onto booking time — 0042 has no per-slot capacity model and consumes the fleet cap at admit_phone_attempt, so booking reserves nothing.
      type: object
      required: [starts_at, ends_at, ist_start, ist_end, booked, remaining, bookable, refusals]
      properties:
        starts_at:
          type: string
          format: date-time
        ends_at:
          description: May fall after the IST close. The window bounds only the start, exactly as the 0042 appointment trigger does.
          type: string
          format: date-time
        ist_start:
          type: string
        ist_end:
          type: string
        booked:
          description: Live scheduled or confirmed appointments overlapping this slot. Touching intervals do not overlap.
          type: integer
        remaining:
          type: integer
        bookable:
          description: True iff refusals is empty. Advisory, not a reservation — and when the response's occupancy_truncated is true this field is OPTIMISTIC, because booked is then only a lower bound.
          type: boolean
        refusals:
          type: array
          items:
            type: string
            enum: [slot_in_past, at_projected_capacity]
      additionalProperties: false

    PhoneSlotsResponse:
      type: object
      required: [ok, enabled, date, window, slot_seconds, max_concurrent, booked_total, occupancy_truncated, slots]
      properties:
        ok:
          type: boolean
        enabled:
          type: boolean
        date:
          type: string
        window:
          $ref: '#/components/schemas/PhoneWindow'
        slot_seconds:
          description: The grid step. NOT a schema guarantee — 0042 exposes no slot length, only the 900 to 3600 second duration envelope this value is clamped into. Reported so the grid is never mistaken for a database fact.
          type: integer
        max_concurrent:
          description: The fleet cap mirrored from phone_max_concurrent. Null while the feature is disabled.
          type: integer
          nullable: true
        booked_total:
          type: integer
        occupancy_truncated:
          description: True when the IST day held more live appointments than the projection counted. booked is then a LOWER bound and remaining an UPPER one — a silent truncation would claim more capacity than exists.
          type: boolean
        slots:
          type: array
          items:
            $ref: '#/components/schemas/PhoneSlot'
      additionalProperties: false

    PhoneBudget:
      description: One of the three 0042 budgets. The ceiling mirrors a CHECK constraint and is drift-tested against the migration text.
      type: object
      required: [used, ceiling, exhausted]
      properties:
        used:
          type: integer
        ceiling:
          type: integer
        exhausted:
          type: boolean
      additionalProperties: false

    PhoneBudgets:
      type: object
      required: [no_answer, reconnect, provider_failure]
      properties:
        no_answer:
          $ref: '#/components/schemas/PhoneBudget'
        reconnect:
          $ref: '#/components/schemas/PhoneBudget'
        provider_failure:
          description: A provider error costs the engagement its whole IST day, so exhausting this budget takes up to five IST days. See the provider_error_costs_one_ist_day residual.
          $ref: '#/components/schemas/PhoneBudget'
      additionalProperties: false

    PhoneAttempt:
      description: One call attempt, with every provider-bearing column ABSENT rather than redacted — the read never selects sip_call_id, room_name, participant_identity, egress_id, egress_status, lease_token or lease_owner.
      type: object
      required: [id, attempt_seq, epoch, kind, state, outcome_class, ist_date, prior_engagement_state, admitted_at, answered_at, classified_at, ended_at]
      properties:
        id:
          type: string
          format: uuid
        attempt_seq:
          type: integer
        epoch:
          type: integer
        kind:
          type: string
          enum: [initial, no_answer_retry, reconnect, scheduled]
        state:
          type: string
          enum: [admitted, ringing, answered_unclassified, human, machine, ended, abandoned]
        outcome_class:
          description: Null while the attempt is live. The eleven members are 0042's, and a value outside them fails the read rather than making the field vanish.
          type: string
          nullable: true
          enum: [completed, disconnected, no_answer, busy, voicemail, declined, wrong_number, opt_out, provider_error, window_closed, cancelled]
        ist_date:
          type: string
        prior_engagement_state:
          type: string
          enum: [eligible, scheduled, reconnecting]
        admitted_at:
          type: string
          format: date-time
        answered_at:
          type: string
          format: date-time
          nullable: true
        classified_at:
          type: string
          format: date-time
          nullable: true
        ended_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false

    PhoneEngagementDetail:
      type: object
      required: [id, state, state_reason, epoch, version, terminal, terminal_at, next_eligible_at, next_eligible_ist, last_attempt_at, created_at, updated_at, budgets]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [pending_prereqs, eligible, scheduled, dialing, in_call, reconnecting, awaiting_retry, completed, abandoned_no_answer, opted_out, wrong_number, failed, cancelled]
        state_reason:
          description: A stable snake_case code from 0042, never free text.
          type: string
          nullable: true
        epoch:
          type: integer
        version:
          type: integer
        terminal:
          description: True for the six terminal states, whose rows 0042 makes immutable.
          type: boolean
        terminal_at:
          type: string
          format: date-time
          nullable: true
        next_eligible_at:
          type: string
          format: date-time
          nullable: true
        next_eligible_ist:
          description: IST wall clock of next_eligible_at, WITH its calendar date (YYYY-MM-DD HH-MM). The date is not optional here — the provider-error rule defers to the next legal instant on the NEXT IST day, so a bare time would be ambiguous by exactly one day on the one field that residual is about.
          type: string
          nullable: true
        last_attempt_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        budgets:
          $ref: '#/components/schemas/PhoneBudgets'
      additionalProperties: false

    PhoneEngagementResponse:
      type: object
      required: [ok, enabled, engagement, candidate, appointment, attempts, attempts_truncated]
      properties:
        ok:
          type: boolean
        enabled:
          type: boolean
        engagement:
          nullable: true
          $ref: '#/components/schemas/PhoneEngagementDetail'
        candidate:
          nullable: true
          $ref: '#/components/schemas/PhoneCandidateRef'
        appointment:
          description: The single live scheduled or confirmed appointment, or null.
          nullable: true
          $ref: '#/components/schemas/PhoneAppointment'
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/PhoneAttempt'
        attempts_truncated:
          type: boolean
      additionalProperties: false

    PhoneAdmissionState:
      description: The 0042 kill switch. A MISSING control singleton reads as halted with reason halt_unreadable — inventing a cleared row would turn a fail-closed stop into a go.
      type: object
      required: [control_present, halted, halt_reason]
      properties:
        control_present:
          type: boolean
        halted:
          type: boolean
        halt_reason:
          type: string
          nullable: true
      additionalProperties: false

    PhoneConcurrencyState:
      description: Fleet concurrency. live counts attempts in a live state; live_with_unexpired_lease additionally requires an unexpired lease, and a gap between the two means slots are held by attempts no worker is heartbeating.
      type: object
      required: [live, live_with_unexpired_lease, max_concurrent, oldest_live_age_seconds]
      properties:
        live:
          type: integer
        live_with_unexpired_lease:
          type: integer
        max_concurrent:
          type: integer
        oldest_live_age_seconds:
          type: integer
      additionalProperties: false

    PhoneAppointmentCounts:
      type: object
      required: [live, overdue]
      properties:
        live:
          type: integer
        overdue:
          description: Live appointments whose start has passed. Nothing in this phase calls the expiry sweep, so this is the honest signal that the status column has not caught up.
          type: integer
      additionalProperties: false

    PhoneIngressCounts:
      description: The five ingress verdicts of the last 24 hours, deliberately kept SPLIT. Collapsing them would hide the difference between a stale epoch, which is fencing working as designed, and an unknown attempt, which is an ingress describing a call we have no record of.
      type: object
      required: [ignored_last_24h, unknown_attempt_last_24h, stale_epoch_last_24h, terminal_last_24h, unexpected_event_last_24h]
      properties:
        ignored_last_24h:
          type: integer
        unknown_attempt_last_24h:
          type: integer
        stale_epoch_last_24h:
          type: integer
        terminal_last_24h:
          type: integer
        unexpected_event_last_24h:
          type: integer
      additionalProperties: false

    PhoneConfigState:
      description: Booleans, a mode and a COUNT. Never the dial allowlist contents, which are digests of specific people's numbers.
      type: object
      required: [screeningEnabled, runtimeEnabled, runtimeActive, dialMode, dialAllowlistSize, liveDialPermitted]
      properties:
        screeningEnabled:
          type: boolean
        runtimeEnabled:
          type: boolean
        runtimeActive:
          type: boolean
        dialMode:
          type: string
          enum: [off, synthetic, live]
        dialAllowlistSize:
          type: integer
        liveDialPermitted:
          type: boolean
      additionalProperties: false

    PhoneHealthWindow:
      type: object
      required: [time_zone, open_ist, close_ist, open_now, ist_date]
      properties:
        time_zone:
          type: string
        open_ist:
          type: string
        close_ist:
          type: string
        open_now:
          description: Null when the backlog could not be read. A false would claim the window is shut, which is a different answer.
          type: boolean
          nullable: true
        ist_date:
          type: string
          nullable: true
      additionalProperties: false

    PhoneResidual:
      description: One P1 substrate residual, each drift-tested against migration 0042. A null writer means NOTHING in 0042 writes the fact, which is the whole point of the entry.
      type: object
      required: [code, writer, appointment_status, owner]
      properties:
        code:
          type: string
          enum: [appointment_confirmed_has_no_writer, appointment_fulfilled_written_by_admission, appointment_missed_written_by_expiry_sweep, provider_error_costs_one_ist_day]
        writer:
          type: string
          nullable: true
        appointment_status:
          type: string
          nullable: true
        owner:
          type: string
      additionalProperties: false

    PhoneHealthResponse:
      description: Always 200. Degradation is reported in the body. Every count block is NULL rather than zero when the backlog cannot be read, because we could not read it and there is none are different answers and only one of them means everything is fine.
      type: object
      required: [ok, enabled, status, reasons, config, window, admission, concurrency, engagements_by_state, appointments, ingress, backlog_unavailable, residuals]
      properties:
        ok:
          type: boolean
        enabled:
          type: boolean
        status:
          type: string
          enum: [ok, degraded, disabled]
        reasons:
          description: Stable codes only — phone_screening_disabled, backlog_unavailable, halt_unreadable, admission_halted, attempt_leases_expired, fleet_at_capacity, appointments_overdue.
          type: array
          items:
            type: string
        config:
          $ref: '#/components/schemas/PhoneConfigState'
        window:
          $ref: '#/components/schemas/PhoneHealthWindow'
        admission:
          nullable: true
          $ref: '#/components/schemas/PhoneAdmissionState'
        concurrency:
          nullable: true
          $ref: '#/components/schemas/PhoneConcurrencyState'
        engagements_by_state:
          description: Counts keyed by engagement state. Null when the backlog could not be read.
          type: object
          nullable: true
          additionalProperties: true
        appointments:
          nullable: true
          $ref: '#/components/schemas/PhoneAppointmentCounts'
        ingress:
          nullable: true
          $ref: '#/components/schemas/PhoneIngressCounts'
        backlog_unavailable:
          type: boolean
        residuals:
          type: array
          items:
            $ref: '#/components/schemas/PhoneResidual'
      additionalProperties: false

    PhoneAppointmentCreateBody:
      description: source is deliberately absent. Every appointment this API books is hr_manual by definition, and because the schema is strict a client that sends source is refused rather than silently overridden.
      type: object
      required: [engagement_id, starts_at, ends_at]
      properties:
        engagement_id:
          type: string
          format: uuid
        starts_at:
          description: UTC ISO-8601 with a literal Z. An offset or a naive datetime is refused.
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
      additionalProperties: false

    PhoneAppointmentPatchBody:
      type: object
      required: [starts_at, ends_at, version]
      properties:
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        version:
          description: REQUIRED. schedule_phone_appointment treats a null expected version as there must be no live appointment, so an optional version would turn every reschedule into a refusal.
          type: integer
      additionalProperties: false

    PhoneAppointmentCancelBody:
      type: object
      required: [reason, version]
      properties:
        reason:
          description: The 0042 cancel vocabulary NARROWED to the reasons an operator may give. superseded and system_deferral_expired are written only by the substrate.
          type: string
          enum: [candidate_request, hr_cancelled, emergency_stop, engagement_cancelled]
        version:
          type: integer
      additionalProperties: false

    PhoneHaltBody:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [operator_pause, provider_incident, cost_control, legal_hold, emergency_stop]
      additionalProperties: false

    PhoneHaltClearBody:
      type: object
      required: [reason]
      properties:
        reason:
          description: Must NAME the halt currently in force, verified against the control row before anything is cleared.
          type: string
          enum: [operator_pause, provider_incident, cost_control, legal_hold, emergency_stop]
      additionalProperties: false

    PhoneAppointmentWriteResponse:
      type: object
      required: [ok, appointment_id, version, engagement_state, prereqs_pending, superseded_appointment_id]
      properties:
        ok:
          type: boolean
        appointment_id:
          type: string
          format: uuid
          nullable: true
        version:
          type: integer
          nullable: true
        engagement_state:
          type: string
          nullable: true
        prereqs_pending:
          description: True on the ok_prereqs_pending answer. The slot is real and HR can see it, but the engagement's prerequisites are unmet so nothing will dial it. Collapsing this into ok would let an operator believe a call is going to happen at that time.
          type: boolean
        superseded_appointment_id:
          description: Returned VERBATIM from the RPC, never echoed back from the path. If a concurrent write changed which appointment was live, this says which row was actually superseded.
          type: string
          format: uuid
          nullable: true
      additionalProperties: false

    PhoneCancelResponse:
      type: object
      required: [ok, appointment_id, version, already_cancelled]
      properties:
        ok:
          type: boolean
        appointment_id:
          type: string
          format: uuid
        version:
          type: integer
          nullable: true
        already_cancelled:
          description: Idempotent success, not a conflict — reporting 409 would make a retry after a dropped response look like a failure.
          type: boolean
      additionalProperties: false

    PhoneHaltResponse:
      type: object
      required: [ok, halted, already_halted, reason]
      properties:
        ok:
          type: boolean
        halted:
          type: boolean
        already_halted:
          description: True when a halt was ALREADY in force. 0042 preserves the original instant, reason and actor across repeated halts.
          type: boolean
        reason:
          type: string
      additionalProperties: false

    PhoneHaltClearResponse:
      type: object
      required: [ok, halted, was_halted, previous_reason]
      properties:
        ok:
          type: boolean
        halted:
          type: boolean
        was_halted:
          type: boolean
        previous_reason:
          type: string
          nullable: true
      additionalProperties: false
