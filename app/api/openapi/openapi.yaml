            application/json:
              schema:
                $ref: '#/components/schemas/DSARNotFound'

  # ── Consent ────────────────────────────────────────────────────────
  /api/consent/submit:
    post:
      tags: [consent]
      operationId: submitConsent
      summary: Record a candidate consent submission (append-only; authenticated)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentSubmitRequest'
      responses:
        '201':
          description: Created consent record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentSubmitResponse'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Candidate not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Failed to record consent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/consent/{candidateId}/status:
    parameters:
      - name: candidateId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [consent]
      operationId: getConsentStatus
      summary: Get a candidate's current consent status (authenticated)
      responses:
        '200':
          description: Consent status flags plus latest consent record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentStatusResponse'
        '404':
          description: Candidate not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/consent/check:
    post:
      tags: [consent]
      operationId: checkConsent
      summary: Check required consent types for an operation (authenticated)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentCheckRequest'
      responses:
        '200':
          description: Whether all required consents are granted and the missing set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentCheckResponse'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/consent/withdraw:
    post:
      tags: [consent]
      operationId: withdrawConsent
      summary: Withdraw previously granted consent types (append-only; authenticated)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentWithdrawRequest'
      responses:
        '200':
          description: Withdrawal record id, status and timestamp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentWithdrawResponse'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Candidate not found or no active consent to withdraw.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Failed to withdraw consent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/consent/templates:
    get:
      tags: [consent]
      operationId: listConsentTemplates
      summary: List active privacy notice templates (authenticated)
      responses:
        '200':
          description: Array of active templates.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsentTemplate'
        '500':
          description: Failed to fetch templates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  # ── Phase 9: status / me / admin ──────────────────────────────────
  /api/status:
    get:
      tags: [health]
      operationId: getPublicStatus
      summary: Bounded public operational status (ok/maintenance/degraded). No model/provider/internal dependencies, no PII.
      security: []
      responses:
        '200':
          description: Bounded status envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /api/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Authenticated authoritative profile (JWT email + membership role/active). Never public.
      responses:
        '200':
          description: Authoritative role/active from the membership resolver.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Not authorized — no active allowlist entry, or insufficient role. Uniform generic denial; never distinguishes wrong domain, not-allowlisted, inactive or disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/admin/members:
    get:
      tags: [admin]
      operationId: listAdminMembers
      summary: Opaque membership list (user_id, role, active) — no email, no auth.users join. Admin only.
      responses:
        '200':
          description: Opaque member rows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminMember'
        '403':
          description: Non-admin denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/admin/members/{userId}:
    patch:
      tags: [admin]
      operationId: updateAdminMember
      summary: Atomic last-admin-safe membership mutation via update_membership RPC. Admin only.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminMemberUpdateRequest'
      responses:
        '200':
          description: Membership updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMemberUpdateResponse'
        '400':
          description: Invalid role or no changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Member not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: last_active_admin / self_modification_denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/admin/maintenance:
    post:
      tags: [admin]
      operationId: toggleMaintenance
      summary: Atomic maintenance toggle + audit via toggle_maintenance RPC. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminMaintenanceRequest'
      responses:
        '200':
          description: Toggle applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMaintenanceToggleResponse'
        '400':
          description: Invalid reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/admin/sessions/{sessionId}/override:
    post:
      tags: [admin]
      operationId: overrideAdminSession
      summary: Bounded CAS session override with reason via override_admin_session RPC. Admin only.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSessionOverrideRequest'
      responses:
        '200':
          description: Override applied (or no-op).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionOverrideResponse'
        '400':
          description: Invalid target or reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: resurrection_denied / deleted_denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  # ── Phase 9 review repair: admin audit / sessions / quota policy views ──
  /api/admin/audit:
    get:
      tags: [admin]
      operationId: listAdminAudit
      summary: Bounded redacted audit list — allowlisted fields only, no metadata/source_ip/correlation/PII/token.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 10000
      responses:
        '200':
          description: Redacted audit rows (newest first).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuditListResponse'
        '400':
          description: Bounded pagination rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Non-admin denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/admin/sessions:
    get:
      tags: [admin]
      operationId: listAdminSessions
      summary: Bounded admin session view with optional status filter. Opaque ids only — no candidate PII/transcript/recording.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [created, waiting, in_progress, completed, failed, cancelled, expired, abandoned]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 10000
      responses:
        '200':
          description: Bounded session rows (newest first).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionListResponse'
        '400':
          description: Unknown status or unbounded pagination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Non-admin denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/admin/quotas:
    get:
      tags: [admin]
      operationId: listAdminQuotaPolicies
      summary: Bounded quota-policy list. Abstract cost units only — never price/currency/usage.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 10000
      responses:
        '200':
          description: Bounded policy rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaPolicyListResponse'
        '400':
          description: Unbounded pagination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Non-admin denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    post:
      tags: [admin]
      operationId: createAdminQuotaPolicy
      summary: Create a quota policy via the atomic upsert_quota_policy RPC (quota_override audit in the same transaction). Actor derived from auth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotaPolicyUpsertRequest'
      responses:
        '201':
          description: Policy created (disabled by default unless enabled=true).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaPolicyCreateResponse'
        '400':
          description: Bounded validation or RPC stable status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Non-admin denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/admin/quotas/{id}:
    patch:
      tags: [admin]
      operationId: updateAdminQuotaPolicy
      summary: Update a quota policy via the atomic upsert RPC (quota_override audit in the same transaction).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotaPolicyUpsertRequest'
      responses:
        '200':
          description: Policy updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaPolicyUpdateResponse'
        '400':
          description: Bounded validation or RPC stable status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Non-admin denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: policy_not_found (no row created).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  # ── HELLO access allowlist (0016): normalized-email access gate ─────
  /api/admin/allowlist:
    get:
      tags: [admin]
      operationId: listAdminAllowlist
      summary: Admin-only list of normalized-email allowlist entries (id, email, role, active, linked_user_id, linked_at).
      responses:
        '200':
          description: Allowlist entries (oldest first).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAllowlistListResponse'
        '403':
          description: Non-admin denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    post:
      tags: [admin]
      operationId: addAdminAllowlistEntry
      summary: Add an allowlist email via the atomic add_allowlist_entry RPC (audit in the same transaction; metadata never contains the full email). Actor derived from auth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAllowlistAddRequest'
      responses:
        '201':
          description: Entry created (active by default).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAllowlistAddResponse'
        '400':
          description: invalid_email / invalid_role (server-side normalization identical to the resolver).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Non-admin denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: duplicate normalized email (case/whitespace variants conflict).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/admin/allowlist/{id}:
    patch:
      tags: [admin]
      operationId: updateAdminAllowlistEntry
      summary: Update/disable/demote an allowlist entry via the atomic update_allowlist_entry RPC (audit in the same transaction). Self-disable/demote and last-linked-active-admin removal are rejected.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAllowlistUpdateRequest'
      responses:
        '200':
          description: Entry updated (propagated to the linked membership row).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAllowlistUpdateResponse'
        '400':
          description: invalid_role / no_changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Non-admin denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Entry not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: self_modification_denied / last_linked_active_admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  # ── Phase 9: recruiter notes + candidate status transitions ────────
  /api/notes:
    get:
      tags: [notes]
      operationId: listNotes
      summary: Append-only recruiter notes for a candidate (viewer read-only, ownership-scoped).
      parameters:
        - name: candidate_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Bounded note list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteListResponse'
        '403':
          description: Non-owner or viewer mutation denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    post:
      tags: [notes]
      operationId: createNote
      summary: Append a bounded note (interviewer+/admin, ownership).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteCreateRequest'
      responses:
        '201':
          description: Note appended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'
        '400':
          description: Bounded body rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Non-owner denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/notes/{candidateId}/status:
    post:
      tags: [notes]
      operationId: updateCandidateStatus
      summary: Allowlisted CAS candidate status transition; fails closed while decision_use_blocked_at is set.
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteStatusUpdateRequest'
      responses:
        '200':
          description: Transition applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusTransitionResponse'
        '400':
          description: Illegal transition or unknown status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Non-owner denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Candidate not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: decision_use_blocked or status_conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  # ── Phase 9: candidate pre-join consent (invite-opaque, public) ────
  /api/candidate-consent/status:
    post:
      tags: [consent]
      operationId: getCandidateConsentStatus
      summary: Bounded consent/template status for an opaque invite token. Public — token validated inline.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateConsentStatusRequest'
      responses:
        '200':
          description: Bounded status — no candidate_id/PII/token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateConsentStatusResponse'
        '400':
          description: Malformed body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: invite_token_invalid_or_expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/candidate-consent/template:
    get:
      tags: [consent]
      operationId: getCandidateConsentTemplate
      summary: Active versioned consent template for a bounded locale. Public. Absence fails closed (404).
      security: []
      parameters:
        - name: locale
          in: query
          required: false
          schema:
            type: string
            pattern: '^[a-z]{2}(-[A-Z]{2})?$'
      responses:
        '200':
          description: Active template only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateConsentTemplateResponse'
        '404':
          description: consent_template_unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/candidate-consent/submit:
    post:
      tags: [consent]
      operationId: submitCandidateConsent
      summary: Append-only consent grant/decline bound to an opaque invite. Public — invite validated inline, never consumed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateConsentSubmitRequest'
      responses:
        '201':
          description: Consent recorded; proof carries invite/session binding only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateConsentSubmitResponse'
        '400':
          description: required_consents_missing or malformed body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: invite_token_invalid_or_expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: Consent template unavailable (fail closed, stable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  # ── Phase 9: notification intents (recruiter status query) ────────
  /api/notifications:
    get:
      tags: [notifications]
      operationId: listNotificationIntents
      summary: Recruiter (interviewer+) notification intents — own/authorized only, no contact/token material.
      responses:
        '200':
          description: Bounded intent list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationIntentListResponse'
        '403':
          description: Viewer denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  # ── Phase 9: CSV scorecard export (ownership-scoped) ──────────────
  /api/export/{candidateId}/csv:
    get:
      tags: [export]
      operationId: exportCandidateCsv
      summary: Ownership-scoped, data-minimized scorecard CSV (RFC4180 + BOM, formula-neutralized). No PDF claim.
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: CSV attachment.
          content:
            text/csv:
              schema:
                type: string
        '403':
          description: Non-owner denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Candidate not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  # ── Phase 9: appeals (separate grants table; immutable review events) ─
  /api/appeals/grants:
    post:
      tags: [appeals]
      operationId: issueAppealGrant
      summary: Issue a one-time appeal grant (SHA-256 digest persisted; plaintext returned once). Interviewer+/admin, ownership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppealGrantCreateRequest'
      responses:
        '201':
          description: One-time plaintext grant token + expiry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppealGrantResponse'
        '400':
          description: candidate_session_mismatch or invalid expiry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Non-owner denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Candidate or session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/appeals:
    get:
      tags: [appeals]
      operationId: listAppeals
      summary: Recruiter appeal list scoped to one candidate (viewer read-only).
      parameters:
        - name: candidate_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Bounded appeal rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppealListResponse'
        '403':
          description: Non-owner denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    post:
      tags: [appeals]
      operationId: submitAppeal
