      type: object
      required: [id, type, state]
      properties:
        id:
          type: string
        type:
          type: string
        state:
          type: string
        errorCode:
          type: string
          nullable: true
      additionalProperties: false

    AshbyMcWorkflow:
      type: object
      required: [applicationLinkId, externalApplicationId, lifecycle, operations, updatedAt]
      properties:
        applicationLinkId:
          type: string
          format: uuid
        externalApplicationId:
          type: string
        externalJobId:
          type: string
          nullable: true
        lifecycle:
          type: string
        terminalState:
          type: string
          nullable: true
        ingestionState:
          type: string
          nullable: true
        operations:
          type: array
          items:
            $ref: '#/components/schemas/AshbyMcWorkflowOperation'
        sessionStatus:
          type: string
          nullable: true
          description: Status of the screening session this application was materialized into, or null when none exists yet. A completed session on a non-terminal workflow whose lifecycle is not writeback_pending is a screening whose completion park did not land — the diagnostic the best-effort completion observer requires.
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    AshbyMcWorkflowsResponse:
      type: object
      required: [ok, workflows]
      properties:
        ok:
          type: boolean
        workflows:
          type: array
          items:
            $ref: '#/components/schemas/AshbyMcWorkflow'
      additionalProperties: false

    AshbyCandidateWorkflowOperation:
      type: object
      required: [type, state, errorCode]
      properties:
        type:
          type: string
          enum: [invite_delivery, scorecard_write]
          description: The reported operation leg. stage_move is never included on this surface.
        state:
          type: string
          enum: [pending, running, succeeded, failed, blocked, cancelled]
        errorCode:
          type: string
          nullable: true
          description: Sanitized stable code only (`^[a-z0-9_.:-]{1,64}$` per the 0029 CHECK). Free-text error_detail is never exposed here.
      additionalProperties: false

    AshbyCandidateWorkflow:
      type: object
      required: [lifecycle, terminalState, ingestionState, operations, sessionStatus, updatedAt]
      properties:
        lifecycle:
          type: string
          enum: [imported, processing, ready, completed, writeback_pending, cancelled]
        terminalState:
          type: string
          nullable: true
          enum: [withdrawn, deleted, manual_stage_cancel]
        ingestionState:
          type: string
          nullable: true
          enum: [queued, fetching, scanning, extracting, structuring, ready, failed_review, cancelled]
        operations:
          type: array
          description: At most one entry per reported type, most recently updated wins, in a stable declaration order.
          items:
            $ref: '#/components/schemas/AshbyCandidateWorkflowOperation'
        sessionStatus:
          type: string
          nullable: true
          description: Screening session status, or null when no session exists yet or the additive diagnostic read failed. Not PII, and carries no session id.
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Null when the workflow row carries no usable timestamp. The card omits the timestamp line rather than rendering an empty one.
      additionalProperties: false

    AshbyCandidateWorkflowResponse:
      type: object
      required: [ok, workflow]
      properties:
        ok:
          type: boolean
        workflow:
          $ref: '#/components/schemas/AshbyCandidateWorkflow'
          nullable: true
          description: Null when the candidate has no Ashby application link. An ordinary absence, never an error - the web card renders nothing.
      additionalProperties: false

