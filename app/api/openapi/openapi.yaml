          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSARDeleteConflict'
        '500':
          description: Failed to execute DSAR deletion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/dsar/{dsarId}/correct:
    parameters:
      - name: dsarId
