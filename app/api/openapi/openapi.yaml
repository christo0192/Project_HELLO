      type: object
      required: [target_status, reason]
      properties:
        target_status:
          type: string
          enum: [created, waiting, in_progress, failed, cancelled, completed]
        reason:
          type: string
          minLength: 1
          maxLength: 200
      additionalProperties: false

    # ── HELLO access allowlist (0016) ────────────────────────────────
    AdminAllowlistRow:
      type: object
      required: [id, email, role, active, linked_user_id, linked_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          description: Canonical company email (admin management surface only — never in audit metadata).
        role:
          type: string
          enum: [admin, interviewer, viewer]
        active:
          type: boolean
        linked_user_id:
          type: string
          format: uuid
          nullable: true
        linked_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false

    AdminAllowlistListResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AdminAllowlistRow'
      additionalProperties: false

    AdminAllowlistAddRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: Company email; normalized/validated server-side (exact domain interviewkickstart.com).
          minLength: 1
          maxLength: 320
        role:
          type: string
          enum: [admin, interviewer, viewer]
          default: viewer
      additionalProperties: false

    AdminAllowlistAddResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        id:
          type: string
          format: uuid
          nullable: true
      additionalProperties: false

    AdminAllowlistUpdateRequest:
      type: object
      properties:
        role:
          type: string
          enum: [admin, interviewer, viewer]
        active:
          type: boolean
      additionalProperties: false

    AdminAllowlistUpdateResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
      additionalProperties: false

    # ── Phase 9: notes / status transitions ──────────────────────────
    NoteResponse:
      type: object
      required: [id, candidate_id, author_id, note, created_at]
      properties:
        id:
          type: string
          format: uuid
        candidate_id:
          type: string
          format: uuid
        author_id:
          type: string
        note:
          type: string
        created_at:
          type: string
          format: date-time
      additionalProperties: false

    NoteListResponse:
      type: object
      required: [notes]
      properties:
        notes:
          type: array
          items:
            $ref: '#/components/schemas/NoteResponse'
      additionalProperties: false

    NoteCreateRequest:
      type: object
      required: [candidate_id, note]
      properties:
        candidate_id:
          type: string
          format: uuid
        note:
          type: string
          minLength: 1
          maxLength: 2000
      additionalProperties: false

    NoteStatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [queued, screening, screened, advanced, rejected]
      additionalProperties: false

    StatusTransitionResponse:
      type: object
      required: [ok, from, to]
      properties:
        ok:
          type: boolean
        from:
          type: string
        to:
          type: string
      additionalProperties: false

    # ── Phase 9: candidate pre-join consent ──────────────────────────
    CandidateConsentStatusRequest:
      type: object
      required: [invite_token]
      properties:
        invite_token:
          type: string
          pattern: '^[a-f0-9]{64}$'
      additionalProperties: false

    CandidateConsentStatusResponse:
      type: object
      required: [has_consent, template_version, locale, required_consents]
      properties:
        has_consent:
          type: boolean
        template_version:
          type: string
          nullable: true
        locale:
          type: string
          nullable: true
        required_consents:
          type: array
          items:
            type: string
      additionalProperties: false

    CandidateConsentTemplateResponse:
      type: object
      required: [version, locale, title, body_md, required_consents]
      properties:
        version:
          type: string
        locale:
          type: string
        title:
          type: string
        body_md:
          type: string
        required_consents:
          type: array
          items:
            type: string
      additionalProperties: false

    CandidateConsentSubmitRequest:
      type: object
      required: [invite_token, template_version, locale, consents, status]
      properties:
        invite_token:
          type: string
          pattern: '^[a-f0-9]{64}$'
        template_version:
          type: string
          minLength: 1
          maxLength: 64
        locale:
          type: string
          pattern: '^[a-z]{2}(-[A-Z]{2})?$'
        consents:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [granted, declined]
      additionalProperties: false

    CandidateConsentSubmitResponse:
      type: object
      required: [id, status, consents, template_version, locale, created_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [granted, declined]
        consents:
          type: array
          items:
            type: string
        template_version:
          type: string
        locale:
          type: string
        created_at:
          type: string
          format: date-time
      additionalProperties: false

    # ── Phase 9: notification intents ────────────────────────────────
    NotificationIntentResponse:
      type: object
      required: [id, kind, candidate_id, consent_verified, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [quota_warning, assessment_ready, appeal_resolved]
        candidate_id:
          type: string
          format: uuid
          nullable: true
        consent_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
      additionalProperties: false

    NotificationIntentListResponse:
      type: object
      required: [intents]
      properties:
        intents:
          type: array
          items:
            $ref: '#/components/schemas/NotificationIntentResponse'
      additionalProperties: false

    # ── Phase 9: appeals ─────────────────────────────────────────────
    AppealGrantCreateRequest:
      type: object
      required: [candidate_id, session_id, expires_in_hours]
      properties:
        candidate_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        expires_in_hours:
          type: integer
          minimum: 1
          maximum: 72
      additionalProperties: false

    AppealGrantResponse:
      type: object
      required: [appeal_grant_token, expires_at]
      properties:
        appeal_grant_token:
          type: string
          pattern: '^[a-f0-9]{64}$'
        expires_at:
          type: string
          format: date-time
      additionalProperties: false

    AppealCreateRequest:
      type: object
      required: [appeal_grant_token, category, description]
      properties:
        appeal_grant_token:
          type: string
          pattern: '^[a-f0-9]{64}$'
        category:
          type: string
          enum: [scoring, recording, accessibility, other]
        description:
          type: string
          minLength: 1
          maxLength: 2000
      additionalProperties: false

    AppealCreateResponse:
      type: object
      required: [ok, appeal_id]
      properties:
        ok:
          type: boolean
        appeal_id:
          type: string
          format: uuid
      additionalProperties: false

    AppealRow:
      type: object
      required: [id, candidate_id, session_id, assessment_id, category, description, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        candidate_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        assessment_id:
          type: string
          format: uuid
          nullable: true
        category:
          type: string
        description:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false

    AppealListResponse:
      type: object
      required: [appeals]
      properties:
        appeals:
          type: array
          items:
            $ref: '#/components/schemas/AppealRow'
      additionalProperties: false

    AppealReviewRequest:
      type: object
      required: [to_status]
      properties:
        to_status:
          type: string
          enum: [under_review, granted, denied]
        notes:
          type: string
          maxLength: 2000
        evidence:
          type: object
          additionalProperties: true
      additionalProperties: false

    AppealReviewResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
      additionalProperties: false
