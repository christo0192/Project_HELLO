  /api/phone/halt/clear:
    post:
      tags: [phone]
      operationId: clearPhoneHalt
      summary: Lower the phone admission kill switch
      description: Admin only. The reason on the body must NAME the halt currently in force, verified against the control row before anything is cleared. 0042 defines no separate resume vocabulary and this API does not invent one; requiring the existing reason makes the field a genuine interlock and gives the audit-failure path a reason it verified rather than guessed. A control singleton that cannot be read is never cleared — 0042 reads a missing row as halted and refuses to invent a cleared one, and so does this route. On audit failure the halt is re-raised with that verified reason.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneHaltClearBody'
      responses:
        '200':
          description: The kill switch is cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneHaltClearResponse'
        '400':
          description: Shape validation failed.
          content:
            application/json:
              schema:
