          description: Opaque member rows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminMember'
        '403':
          description: Non-admin denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

