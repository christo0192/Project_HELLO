# OpenAPI 3.0.3 specification for the HR screening bot API.
#
# Phase 6 (TST-02): documents ONLY routes that already exist in
# app/api/src/app.ts and the route modules as of origin/main 4f7293d.
# This file is the single source of truth that contract-openapi.test.ts
# validates the live Express handlers against.
#
# Conventions:
#   - additionalProperties: false  => the handler CONSTRUCTS this object
#     (its shape is fixed by code); the contract test asserts exactness.
#   - additionalProperties omitted => pass-through DB row; the test asserts
#     the documented required keys and types only.
#   - Every documented route exists in the live app; the contract test
#     asserts the reverse direction too (no undocumented mounted routes).
#
# L5 (Phase 7) removed the grant-route shadow: POST /api/livekit/grant/recording
# is now registered BEFORE POST /api/livekit/{sessionId}/recording, so the
# literal "grant" segment is no longer captured by the UUID path-param route.
# The grant endpoint mints a short-TTL signed URL (200 {url}) and is gated
# fail-closed on revoked (403) / quarantined (409) / deleted (404) recordings.

openapi: 3.0.3
info:
  title: HR Screening Bot API
  version: 0.2.0
  description: Backend API for the AI HR screening bot (Supabase screening_v2 + LiveKit voice).
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: health
  - name: roles
  - name: candidates
  - name: resumes
  - name: screening
  - name: assess
  - name: livekit
  - name: recordings
  - name: dsar
  - name: consent
  - name: csp

paths:
  # ── Health ──────────────────────────────────────────────────────────
  /api/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Service health probe
      security: []
      responses:
        '200':
          description: Service is up and the configured brain model is reported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # ── CSP violation report (public, unauthenticated by design) ───────
  /api/csp-report:
    post:
      tags: [csp]
      operationId: reportCspViolation
      summary: Bounded CSP violation report endpoint (64 KiB, 204 always)
      security: []
      responses:
        '204':
          description: Accepted and logged; browsers must not see retry/error signals.

  # ── Roles ──────────────────────────────────────────────────────────
  /api/roles:
    get:
      tags: [roles]
      operationId: listRoles
      summary: List roles (viewer+; interviewer scoped to own records)
      responses:
        '200':
          description: Array of role rows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
    post:
      tags: [roles]
      operationId: createRole
      summary: Create role with screening template (interviewer+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: Created role row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal error (including fail-closed audit sink failure).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/roles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [roles]
      operationId: getRole
      summary: Get one role (viewer+; interviewer must own)
      responses:
        '200':
          description: Role row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Role not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
    put:
      tags: [roles]
      operationId: updateRole
      summary: Update role (interviewer+; interviewer must own)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Updated role row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Role not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '500':
          description: Internal error (including fail-closed audit sink failure).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  # ── Candidates ─────────────────────────────────────────────────────
  /api/candidates:
    get:
      tags: [candidates]
      operationId: listCandidates
      summary: List candidates (viewer+; interviewer scoped to own records)
      parameters:
        - name: role_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Array of candidate list rows (projected columns).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CandidateListItem'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/candidates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [candidates]
      operationId: getCandidate
      summary: Candidate detail with latest sessions and assessments (viewer+)
      responses:
        '200':
          description: Candidate, sessions and assessments envelopes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateDetail'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Candidate not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'

  # ── Resumes ────────────────────────────────────────────────────────
  /api/resumes:
    post:
      tags: [resumes]
      operationId: uploadResume
      summary: Upload and ingest a resume (interviewer+; creates candidate + consent record)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                role_id:
                  type: string
                  format: uuid
              required: [file]
      responses:
        '201':
          description: Candidate and resume rows plus normalized phone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeUploadResponse'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Recruiter authorization required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Upload guard, malware or parse rejection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '502':
          description: Storage, brain or persistence failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  # ── Screening ──────────────────────────────────────────────────────
  /api/screening/start:
    post:
      tags: [screening]
      operationId: startScreening
      summary: Start a simulation screening session (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartScreeningRequest'
      responses:
        '201':
          description: Session id plus the bot opening message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartScreeningResponse'
        '400':
          description: Request validation failed or candidate_id missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'

  /api/screening/{id}/turn:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [screening]
      operationId: screeningTurn
      summary: Submit a candidate turn and get the bot reply (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScreeningTurnRequest'
      responses:
        '200':
          description: Bot message, done flag, assessment and scoring status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreeningTurnResponse'
        '400':
          description: Request validation failed or text missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '404':
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '409':
          description: Session already completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'

  /api/screening/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [screening]
      operationId: getScreeningSession
      summary: Session, transcript and latest assessment (admin only)
      responses:
        '200':
          description: Session detail envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreeningSessionDetail'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Screening session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'

  # ── Assess ─────────────────────────────────────────────────────────
  /api/assess/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [assess]
      operationId: runAssessment
      summary: Score a completed screening session (admin only)
      responses:
        '200':
          description: Assessment object (API shape) with id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal error (including fail-closed audit sink failure).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  # ── LiveKit ────────────────────────────────────────────────────────
  /api/livekit/start:
    post:
      tags: [livekit]
      operationId: startLiveKitSession
      summary: Create a LiveKit room + browser session (interviewer+; no candidate join token returned)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiveKitStartRequest'
      responses:
        '201':
          description: Session id, room name and LiveKit URL (no join token).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveKitStartResponse'
        '400':
          description: Request validation failed or candidate_id missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '403':
          description: Access denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '409':
          description: Candidate ownership conflict or session transition conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'

  /api/livekit/{sessionId}/recording:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [livekit]
      operationId: uploadRecording
      summary: Upload a recording bound to a session (grant-token or recruiter auth)
      security:
        - grantToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        '200':
          description: Stored object key (no signed URL).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingUploadResponse'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: No grant token and no recruiter auth.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '403':
          description: Grant token not bound to this session, or non-owner recruiter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '404':
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '409':
          description: Recording already exists for this session (one recording per session; replay rejected).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '413':
          description: File exceeds the reduced bounded upload cap (PROPOSED default 25 MiB, hard max 50 MiB) — rejected before buffering.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '415':
          description: Unsupported media type — magic bytes, MIME/extension agreement, or polyglot guard failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Malware scan rejected the upload (fail-closed). At-rest tampering is detected on DOWNLOAD (re-verify vs recording_sha256), not on upload — the upload path never compares against a persisted digest (unreachable + uploader-controlled; see runbook).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/livekit/worker-context:
    post:
      tags: [livekit]
      operationId: resolveWorkerContext
      summary: Resolve minimal worker context from opaque session/room identifiers (worker bearer credential)
      security:
        - workerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerContextRequest'
      responses:
        '200':
          description: Minimal worker context (no resume facts, no PII beyond name).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerContextResponse'
        '400':
          description: Request validation failed or identifiers missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerContextError'
        '401':
          description: Worker bearer credential required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerContextError'
        '403':
          description: Credential invalid or room binding mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerContextError'
        '404':
          description: Session not found or not active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerContextError'
        '503':
          description: Worker credential not configured (deny closed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerContextError'

  /api/livekit/invite:
    post:
      tags: [livekit]
      operationId: createInvite
      summary: Issue a one-time invite token (admin/interviewer; only SHA-256 digest persisted)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteCreateRequest'
      responses:
        '201':
          description: Plaintext token (returned once) and expiry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteCreateResponse'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Recruiter authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '403':
          description: Candidate or owner mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '404':
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '409':
          description: Session not in an invitable state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'

  /api/livekit/exchange:
    post:
      tags: [livekit]
      operationId: exchangeInvite
      summary: Exchange an invite token for a short-lived candidate access grant + LiveKit JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteExchangeRequest'
      responses:
        '200':
          description: Grant token, room binding and short-TTL LiveKit JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteExchangeResponse'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Stable 404 for unknown/expired/revoked/consumed tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'

  /api/livekit/grant/recording:
    post:
      tags: [livekit]
      operationId: grantRecording
      summary: Mint a short-TTL signed URL for a recording via a candidate grant
      description: Registered before /api/livekit/{sessionId}/recording (L5 route-shadow fix). Validates the grant binding, then gates fail-closed on deleted (404) / quarantined (409) / revoked (403) recordings before minting.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordingGrantRequest'
      responses:
        '200':
          description: Short-TTL signed recording URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingGrantResponse'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Grant invalid, not bound to the session, or recording revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '404':
          description: Session/recording not found or recording deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '409':
          description: Recording is quarantined and never served.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'

  # ── Recordings ─────────────────────────────────────────────────────
  /api/recordings/{sessionId}/download:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [recordings]
      operationId: downloadRecording
      summary: Mint a short-TTL signed recording URL for a recruiter (viewer+; interviewer must own)
      description: Gates fail-closed on deleted (404) / quarantined (409) / revoked (403), then — when recording_sha256 is persisted — re-verifies the stored bytes server-side (SHA-256 fetched through storage vs the persisted digest) BEFORE minting. A mismatch or over-cap object quarantines the session (409); a storage read failure is a redacted fail-closed 500 and never mints a URL. No hash (legacy rows) skips re-verification entirely.
      responses:
        '200':
          description: Short-TTL signed URL (never persisted or logged).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingDownloadResponse'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Non-privileged role, not the owning interviewer, or recording revoked (uniform denial).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorBody'
        '404':
          description: Recording not found or deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Recording is quarantined (flag-gated OR caught by download-time re-verification: digest mismatch or over-cap object) and never served.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Signing failure or integrity re-verification storage failure (redacted stable error; never mints a URL).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/recordings/{sessionId}/revoke:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [recordings]
      operationId: revokeRecording
      summary: Revoke recording access (admin only) — REC-05 write path
      description: Sets recording_revoked_at (CAS-guarded), appends exactly one 'revoked' integrity event (unique partial index; retries backfill a missing event), and audits recording.revoked only on the transition. Both mint paths (recruiter download + candidate grant) then return 403 before createSignedUrl. Retries converge to already_revoked with no duplicate evidence.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordingRevokeRequest'
      responses:
        '200':
          description: Revocation applied (status revoked) or already converged (status already_revoked).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingRevokeResponse'
        '400':
          description: Request validation failed (malformed session id or oversize reason).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Non-admin caller (uniform denial).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorBody'
        '404':
          description: Recording/session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  # ── DSAR ───────────────────────────────────────────────────────────
  /api/dsar:
    post:
      tags: [dsar]
      operationId: createDSAR
      summary: Create a data subject access request (interviewer+; interviewer must own candidate)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDSARRequest'
      responses:
        '201':
          description: Created DSAR request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSAREnvelope'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSARForbidden'
        '500':
          description: Failed to create DSAR request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/dsar/{dsarId}:
    parameters:
      - name: dsarId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [dsar]
      operationId: getDSAR
      summary: Get a DSAR request, optionally with export data (viewer+)
      parameters:
        - name: include_export
          in: query
          required: false
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: DSAR request (optionally with export data when fulfilled export).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSARWithExportEnvelope'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSARForbidden'
        '404':
          description: DSAR request not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSARNotFound'

  /api/dsar/candidate/{candidateId}:
    parameters:
      - name: candidateId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [dsar]
      operationId: listCandidateDSARs
      summary: List DSAR requests for a candidate (viewer+; interviewer must own)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, in_progress, fulfilled, rejected, cancelled]
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [export, delete, correct, restrict]
      responses:
        '200':
          description: Array of DSAR requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSARListEnvelope'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSARForbidden'

  /api/dsar/{dsarId}/fulfill:
    parameters:
      - name: dsarId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [dsar]
      operationId: fulfillDSAR
      summary: Fulfill, reject or cancel a DSAR request (interviewer+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FulfillDSARRequest'
      responses:
        '200':
          description: Updated DSAR request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSAREnvelope'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSARForbidden'
        '404':
          description: DSAR request not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSARNotFound'
        '500':
          description: Failed to update DSAR status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/dsar/{dsarId}/export:
    parameters:
      - name: dsarId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [dsar]
      operationId: exportDSAR
      summary: Execute a DSAR data export (interviewer+)
      responses:
        '200':
          description: Structured export payload respecting consent boundaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSARExportEnvelope'
        '400':
          description: Request validation failed or DSAR is not an export type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSARForbidden'
        '404':
          description: DSAR request not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSARNotFound'
        '500':
          description: Failed to export data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/dsar/{dsarId}/delete:
    parameters:
      - name: dsarId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [dsar]
      operationId: deleteDSAR
      summary: Execute a DSAR data deletion (interviewer+)
      responses:
        '200':
          description: Deletion result with deleted entity references.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSARDeleteEnvelope'
        '400':
          description: Request validation failed or DSAR is not a delete type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSARForbidden'
        '404':
          description: DSAR request not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSARNotFound'
        '409':
          description: Deletion blocked by active legal hold(s).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSARDeleteConflict'
        '500':
          description: Failed to execute DSAR deletion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/dsar/{dsarId}/correct:
    parameters:
      - name: dsarId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [dsar]
      operationId: correctDSAR
      summary: Apply targeted corrections (interviewer+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectDSARRequest'
      responses:
        '200':
          description: Correction result with old/new values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSARCorrectEnvelope'
        '400':
          description: Request validation failed or DSAR is not a correct type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSARForbidden'
        '404':
          description: DSAR request not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSARNotFound'
        '500':
          description: Failed to apply corrections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/dsar/legal-holds:
    post:
      tags: [dsar]
      operationId: createLegalHold
      summary: Place a legal hold (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLegalHoldRequest'
      responses:
        '201':
          description: Created legal hold.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalHoldEnvelope'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSARForbidden'

  /api/dsar/legal-holds/{holdId}/release:
    parameters:
      - name: holdId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [dsar]
      operationId: releaseLegalHold
      summary: Release a legal hold (admin only; idempotent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseLegalHoldRequest'
      responses:
        '200':
          description: Released legal hold.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalHoldEnvelope'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSARForbidden'
        '404':
          description: Legal hold not found or already released.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSARNotFound'

  /api/dsar/legal-holds/check:
    get:
      tags: [dsar]
      operationId: checkLegalHold
      summary: Check legal-hold and erasure-block status for an entity (viewer+)
      parameters:
        - name: entity_type
          in: query
          required: true
          schema:
            type: string
            enum: [candidate, session, transcript, recording, assessment, resume]
        - name: entity_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Hold status and active holds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalHoldCheck'
        '400':
          description: Missing or invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/dsar/legal-holds/{holdId}:
    parameters:
      - name: holdId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [dsar]
      operationId: getLegalHold
      summary: Get legal hold details (viewer+)
      responses:
        '200':
          description: Legal hold row (pass-through DB shape).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalHoldRowEnvelope'
        '404':
          description: Legal hold not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSARNotFound'

  # ── Consent ────────────────────────────────────────────────────────
  /api/consent/submit:
    post:
      tags: [consent]
      operationId: submitConsent
      summary: Record a candidate consent submission (append-only; authenticated)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentSubmitRequest'
      responses:
        '201':
          description: Created consent record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentSubmitResponse'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Candidate not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Failed to record consent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/consent/{candidateId}/status:
    parameters:
      - name: candidateId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [consent]
      operationId: getConsentStatus
      summary: Get a candidate's current consent status (authenticated)
      responses:
        '200':
          description: Consent status flags plus latest consent record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentStatusResponse'
        '404':
          description: Candidate not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/consent/check:
    post:
      tags: [consent]
      operationId: checkConsent
      summary: Check required consent types for an operation (authenticated)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentCheckRequest'
      responses:
        '200':
          description: Whether all required consents are granted and the missing set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentCheckResponse'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/consent/withdraw:
    post:
      tags: [consent]
      operationId: withdrawConsent
      summary: Withdraw previously granted consent types (append-only; authenticated)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentWithdrawRequest'
      responses:
        '200':
          description: Withdrawal record id, status and timestamp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentWithdrawResponse'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Candidate not found or no active consent to withdraw.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Failed to withdraw consent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/consent/templates:
    get:
      tags: [consent]
      operationId: listConsentTemplates
      summary: List active privacy notice templates (authenticated)
      responses:
        '200':
          description: Array of active templates.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsentTemplate'
        '500':
          description: Failed to fetch templates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Supabase Auth bearer JWT (AAL2 for privileged roles).
    grantToken:
      type: apiKey
      in: header
      name: x-grant-token
      description: 64-hex candidate access grant token bound to one session.
    workerBearer:
      type: http
      scheme: bearer
      description: Worker bearer credential (env WORKER_CONTEXT_SECRET, timing-safe compare).

  schemas:
    # ── Common errors ────────────────────────────────────────────────
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, message]
          properties:
            type:
              type: string
              description: Stable error type code.
            message:
              type: string
            details:
              type: array
              items:
                type: object
                required: [field, code, message]
                properties:
                  field:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
      additionalProperties: false

    SimpleError:
      type: object
      required: [error]
      properties:
        error:
          type: string
      additionalProperties: false

    AuthErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, message]
          properties:
            type:
              type: string
              enum: [authentication_error, authorization_error]
            message:
              type: string
      additionalProperties: false

    DSARForbidden:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, message]
          properties:
            type:
              type: string
            message:
              type: string
      additionalProperties: false

    DSARNotFound:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, message]
          properties:
            type:
              type: string
            message:
              type: string
      additionalProperties: false

    # ── Health ───────────────────────────────────────────────────────
    HealthResponse:
      type: object
      required: [ok, model]
      properties:
        ok:
          type: boolean
        model:
          type: string
      additionalProperties: false

    # ── Roles / candidates ───────────────────────────────────────────
    ScreeningQuestion:
      type: object
      required: [id, question]
      properties:
        id:
          type: string
        question:
          type: string
        weight:
          type: number
        follow_up_hint:
          type: string
        mandatory:
          type: boolean
      additionalProperties: true

    Role:
      type: object
      required: [id, title, required_skills, screening_template, is_active, created_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        jd:
          type: string
          nullable: true
        required_skills:
          type: array
          items:
            type: string
        screening_template:
          type: array
          items:
            $ref: '#/components/schemas/ScreeningQuestion'
        is_active:
          type: boolean
        owner_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: true

    CandidateListItem:
      type: object
      required: [id, name, email, phone_e164, phone_valid, skills, experience_years, status, role_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone_e164:
          type: string
          nullable: true
        phone_valid:
          type: boolean
        skills:
          type: array
          items:
            type: string
        experience_years:
          type: number
          nullable: true
        status:
          type: string
          enum: [new, queued, screening, screened, advanced, rejected, consent_declined]
        role_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
      additionalProperties: true

    Candidate:
      type: object
      required: [id, name, email, phone_e164, phone_valid, skills, experience_years, status, role_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        role_id:
          type: string
          format: uuid
          nullable: true
        resume_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone_raw:
          type: string
          nullable: true
        phone_e164:
          type: string
          nullable: true
        phone_valid:
          type: boolean
        skills:
          type: array
          items:
            type: string
        experience_years:
          type: number
          nullable: true
        parsed:
          type: object
          nullable: true
        status:
          type: string
          enum: [new, queued, screening, screened, advanced, rejected, consent_declined]
        consent_source:
          type: string
          nullable: true
        consent_at:
          type: string
          format: date-time
          nullable: true
        owner_id:
          type: string
          format: uuid
          nullable: true
        ats_external_id:
          type: string
          nullable: true
        ats_source:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: true

    CallSession:
      type: object
      required: [id, candidate_id, role_id, mode, provider, status, started_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        candidate_id:
          type: string
          format: uuid
        role_id:
          type: string
          format: uuid
          nullable: true
        mode:
          type: string
          enum: [browser, live, simulation]
        provider:
          type: string
        external_call_id:
          type: string
          nullable: true
        status:
          type: string
          enum: [created, waiting, in_progress, completed, failed, cancelled, expired]
        recording_url:
          type: string
          nullable: true
        recording_object_key:
          type: string
          nullable: true
        current_question_index:
          type: integer
        owner_id:
          type: string
          format: uuid
          nullable: true
        provenance:
          type: object
          nullable: true
        waiting_at:
          type: string
          format: date-time
          nullable: true
        terminal_reason:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        duration_sec:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: true

    TranscriptTurn:
      type: object
      required: [speaker, text]
      properties:
        speaker:
          type: string
          enum: [bot, candidate]
        text:
          type: string
      additionalProperties: false

    AssessmentRecord:
      type: object
      required: [id, session_id, candidate_id, overall_score, recommendation, summary, created_at]
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        candidate_id:
          type: string
          format: uuid
        english:
          type: object
          nullable: true
        tone:
          type: object
          nullable: true
        communication:
          type: object
          nullable: true
        motivation:
          type: object
          nullable: true
        role_fit:
          type: object
          nullable: true
        resume_conflicts:
          type: array
          items:
            type: object
          nullable: true
        overall_score:
          type: number
          nullable: true
        recommendation:
          type: string
          enum: [advance, hold, reject]
          nullable: true
        summary:
          type: string
          nullable: true
        raw:
          type: object
          nullable: true
        provenance:
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: true

    CandidateDetail:
      type: object
      required: [candidate, sessions, assessments]
      properties:
        candidate:
          $ref: '#/components/schemas/Candidate'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/CallSession'
        assessments:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentRecord'
      additionalProperties: false

    # ── Resumes ──────────────────────────────────────────────────────
    Phone:
      type: object
      required: [raw, e164, valid]
      properties:
        raw:
          type: string
        e164:
          type: string
          nullable: true
        valid:
          type: boolean
      additionalProperties: false

    ResumeRecord:
      type: object
      required: [id, file_path, file_name, mime_type, text_extracted, parsed, created_at]
      properties:
        id:
          type: string
          format: uuid
        file_path:
          type: string
          nullable: true
        file_name:
          type: string
          nullable: true
        mime_type:
          type: string
          nullable: true
        text_extracted:
          type: string
          nullable: true
        parsed:
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: true

    ResumeUploadResponse:
      type: object
      required: [candidate, resume, phone]
      properties:
        candidate:
          $ref: '#/components/schemas/Candidate'
        resume:
          $ref: '#/components/schemas/ResumeRecord'
        phone:
          $ref: '#/components/schemas/Phone'
      additionalProperties: false

    # ── Screening ────────────────────────────────────────────────────
    StartScreeningResponse:
      type: object
      required: [session_id, message, done]
      properties:
        session_id:
          type: string
          format: uuid
        message:
          type: string
        done:
          type: boolean
      additionalProperties: false

    ScreeningTurnResponse:
      type: object
      required: [message, done, assessment, scoringStatus]
      properties:
        message:
          type: string
        done:
          type: boolean
        assessment:
          $ref: '#/components/schemas/Assessment'
          nullable: true
        scoringStatus:
          type: string
          enum: [pending, done, error]
      additionalProperties: false

    ScreeningSessionDetail:
      type: object
      required: [session, transcript, assessment]
      properties:
        session:
          $ref: '#/components/schemas/CallSession'
        transcript:
          type: array
          items:
            $ref: '#/components/schemas/TranscriptTurn'
        assessment:
          $ref: '#/components/schemas/AssessmentRecord'
          nullable: true
      additionalProperties: false

    # ── Assessment (API shape from runAssessment) ────────────────────
    LanguageProficiencyScore:
      type: object
      required: [band, grammar, vocabulary, fluency, coherence, notes]
      properties:
        band:
          type: string
        grammar:
          type: number
        vocabulary:
          type: number
        fluency:
          type: number
        coherence:
          type: number
        notes:
          type: string
      additionalProperties: false

    SpeechPatternSignal:
      type: object
      required: [level, examples, impact_score, notes]
      properties:
        level:
          type: string
          enum: [none, low, moderate, high]
        examples:
          type: array
          items:
            type: string
        impact_score:
          type: number
        notes:
          type: string
      additionalProperties: false

    FillerUsage:
      type: object
      required: [level, examples, impact_score, notes]
      properties:
        level:
          type: string
          enum: [low, moderate, high]
        examples:
          type: array
          items:
            type: string
        impact_score:
          type: number
        notes:
          type: string
      additionalProperties: false

    Tone:
      type: object
      required: [clarity, confidence, professionalism, sentiment, notes]
      properties:
        clarity:
          type: number
        confidence:
          type: number
        professionalism:
          type: number
        sentiment:
          type: string
          enum: [positive, neutral, negative]
        notes:
          type: string
      additionalProperties: false

    Communication:
