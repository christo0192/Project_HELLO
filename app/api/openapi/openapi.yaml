# OpenAPI 3.0.3 specification for the HR screening bot API.
#
# Phase 6 (TST-02): documents ONLY routes that already exist in
# app/api/src/app.ts and the route modules as of origin/main 4f7293d.
# This file is the single source of truth that contract-openapi.test.ts
# validates the live Express handlers against.
#
# Conventions:
#   - additionalProperties: false  => the handler CONSTRUCTS this object
#     (its shape is fixed by code); the contract test asserts exactness.
#   - additionalProperties omitted => pass-through DB row; the test asserts
#     the documented required keys and types only.
#   - Every documented route exists in the live app; the contract test
#     asserts the reverse direction too (no undocumented mounted routes).
#
# L5 (Phase 7) removed the grant-route shadow: POST /api/livekit/grant/recording
# is now registered BEFORE POST /api/livekit/{sessionId}/recording, so the
# literal "grant" segment is no longer captured by the UUID path-param route.
# The grant endpoint mints a short-TTL signed URL (200 {url}) and is gated
# fail-closed on revoked (403) / quarantined (409) / deleted (404) recordings.

openapi: 3.0.3
info:
  title: HR Screening Bot API
  version: 0.2.0
  description: Backend API for the AI HR screening bot (Supabase screening_v2 + LiveKit voice).
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: health
  - name: roles
  - name: candidates
  - name: resumes
  - name: screening
  - name: assess
  - name: livekit
  - name: recordings
  - name: dsar
  - name: consent
  - name: csp

paths:
  # ── Health ──────────────────────────────────────────────────────────
  /api/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Service health probe
      security: []
      responses:
        '200':
          description: Service is up. Bounded to ok:true — no model/provider/internal dependency leakage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # ── CSP violation report (public, unauthenticated by design) ───────
  /api/csp-report:
    post:
      tags: [csp]
      operationId: reportCspViolation
      summary: Bounded CSP violation report endpoint (64 KiB, 204 always)
      security: []
      responses:
        '204':
          description: Accepted and logged; browsers must not see retry/error signals.

  # ── Roles ──────────────────────────────────────────────────────────
  /api/roles:
    get:
      tags: [roles]
      operationId: listRoles
      summary: List roles (viewer+; interviewer scoped to own records)
      responses:
        '200':
          description: Array of role rows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
    post:
      tags: [roles]
      operationId: createRole
      summary: Create role with screening template (interviewer+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: Created role row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal error (including fail-closed audit sink failure).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/roles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [roles]
      operationId: getRole
      summary: Get one role (viewer+; interviewer must own)
      responses:
        '200':
          description: Role row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Role not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
    put:
      tags: [roles]
      operationId: updateRole
      summary: Update role (interviewer+; interviewer must own)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Updated role row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Role not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '500':
          description: Internal error (including fail-closed audit sink failure).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  # ── Candidates ─────────────────────────────────────────────────────
  /api/candidates:
    get:
      tags: [candidates]
      operationId: listCandidates
      summary: List candidates (viewer+; interviewer scoped to own records)
      parameters:
        - name: role_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Array of candidate list rows (projected columns).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CandidateListItem'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/candidates/summary:
    get:
      tags: [candidates]
      operationId: getCandidatesSummary
      summary: Aggregate assessment metrics (viewer+; interviewer scoped to own records)
      responses:
        '200':
          description: Aggregate assessment metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidatesSummary'

  /api/candidates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [candidates]
      operationId: getCandidate
      summary: Candidate detail with latest sessions and assessments (viewer+)
      responses:
        '200':
          description: Candidate, sessions and assessments envelopes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateDetail'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Candidate not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'

  /api/candidates/{id}/ashby-workflow:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [candidates, ashby]
      operationId: getCandidateAshbyWorkflow
      summary: Read-only Ashby screening workflow status for a candidate (viewer+)
      description: Sanitized, read-only projection of the candidate's Ashby screening workflow, rendered as a status card in the candidate Overview. Same state vocabulary as the Mission Control workflow list, but deliberately narrower - it never returns external Ashby identifiers, internal row ids (application link, operation, ingestion, session), operation keys, markers, leases, invite tokens, provider payloads, or candidate PII. Viewer role or above; the existing interviewer ownership rule is re-applied verbatim, so this grants no new access. A malformed id, an unknown candidate and a candidate the caller does not own all return the identical 404 used by GET /api/candidates/{id}. A candidate with no Ashby application link is not an error - the response is 200 with `workflow: null` and no card is rendered. There is no action on this surface; retry, cancel and stage controls remain in Mission Control.
      responses:
        '200':
          description: The candidate's current Ashby workflow, or null when not Ashby-linked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyCandidateWorkflowResponse'
        '404':
          description: Candidate unknown, not owned by the caller, or malformed id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '500':
          description: Sanitized internal error - a database lookup failed. Deliberately distinct from the 404 so an outage is retryable and is not shown as "not found"; returned identically whether or not the candidate exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  # ── Resumes ────────────────────────────────────────────────────────
  /api/resumes:
    post:
      tags: [resumes]
      operationId: uploadResume
      summary: Upload and ingest a resume (interviewer+; creates candidate + consent record)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                role_id:
                  type: string
                  format: uuid
              required: [file]
      responses:
        '201':
          description: Candidate and resume rows plus normalized phone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeUploadResponse'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Recruiter authorization required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Upload guard, malware or parse rejection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '502':
          description: Storage, brain or persistence failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  # ── Screening ──────────────────────────────────────────────────────
  /api/screening/start:
    post:
      tags: [screening]
      operationId: startScreening
      summary: Start a simulation screening session (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartScreeningRequest'
      responses:
        '201':
          description: Session id plus the bot opening message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartScreeningResponse'
        '400':
          description: Request validation failed or candidate_id missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'

  /api/screening/{id}/turn:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [screening]
      operationId: screeningTurn
      summary: Submit a candidate turn and get the bot reply (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScreeningTurnRequest'
      responses:
        '200':
          description: Bot message, done flag, assessment and scoring status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreeningTurnResponse'
        '400':
          description: Request validation failed or text missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '404':
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '409':
          description: Session already completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'

  /api/screening/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [screening]
      operationId: getScreeningSession
      summary: Session, transcript and latest assessment (admin only)
      responses:
        '200':
          description: Session detail envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreeningSessionDetail'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Screening session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'

  # ── Assess ─────────────────────────────────────────────────────────
  /api/assess/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [assess]
      operationId: runAssessment
      summary: Score a completed screening session (admin only)
      responses:
        '200':
          description: Assessment object (API shape) with id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal error (including fail-closed audit sink failure).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/internal/assess/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [assess]
      operationId: runWorkerAssessment
      summary: Score a completed screening session from the voice worker
      security:
        - workerBearer: []
      responses:
        '200':
          description: Assessment object created by the configured scoring provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
        '400':
          description: Session identifier validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Worker bearer credential required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerContextError'
        '403':
          description: Worker bearer credential invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerContextError'
        '409':
          description: Session is not eligible for assessment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Scoring or persistence failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: Worker credential is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerContextError'

  # ── Internal phone worker surface (P4) ─────────────────────────────
  /api/internal/phone/events:
    post:
      tags: [phone]
      operationId: postPhoneWorkerEvent
      summary: Post one phone screening event from the named phone voice worker
      description: Internal, service-authenticated surface for the named phone voice worker. Uses the SAME constant-time WORKER_CONTEXT_SECRET boundary as the scoring callback, not a recruiter session, and is mounted before recruiter auth. The event vocabulary is a CLOSED allowlist, deliberately narrower than apply_phone_event's open event-type FORMAT: the open format exists so an unrecognised PROVIDER event stays recordable, but the worker is our own code with exactly one legitimate vocabulary, and an event outside it is refused before any database work. The sip.originate_* verdicts are absent on purpose — those are the provider's, arrive through the signed webhook, and a worker able to post them could manufacture a no-answer for a call that was answered, charging a real candidate's anti-harassment budget. Disabled by default: answers 503 while PHONE_SCREENING_ENABLED is off, having performed no database work. Duplicate posts converge on the original verdict via the deterministic synthetic provider id 0042 mints for internal events.
      security:
        - workerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneWorkerEventRequest'
      responses:
        '200':
          description: The database reached a verdict. `status` is `applied` or `ignored`; an ignored event is a normal answer, not an error, and `ignored_reason` says which of stale_epoch, unknown_attempt, terminal or unexpected_event applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneWorkerEventResponse'
        '400':
          description: Request body failed validation, or the event is outside the closed worker allowlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneWorkerError'
        '401':
          description: Worker bearer credential required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneWorkerError'
        '403':
          description: Worker bearer credential invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneWorkerError'
        '500':
          description: phone_event_error — sanitized stable code, never a driver message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneWorkerError'
        '503':
          description: Phone screening disabled, or the worker credential is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneWorkerError'

  /api/internal/phone/appointments:
    post:
      tags: [phone]
      operationId: bookPhoneWorkerAppointment
      summary: Book a candidate-requested callback from the phone voice worker
      description: Internal, service-authenticated callback booking for the "call me later" path. The worker PROPOSES an absolute UTC instant; the SERVER decides whether it is legal, revalidating not-in-the-past and the 09:00-21:00 IST window, because an LLM-driven caller is exactly the client that will confidently propose 03:00 IST. Duration is bounded to the same 900-3600 second envelope 0042's appointment CHECK enforces. Both bounds are UTC ISO-8601 with a literal Z; an offset or naive datetime is refused. IMPORTANT — schedule_phone_appointment refuses outright while the engagement is `dialing` (attempt_in_flight), because a live dial owns the engagement and booking under it would put the calendar and the wire into disagreement. Since "call me later" is most likely said DURING the identity/disclosure exchange, this endpoint first ends the attempt truthfully and WITHOUT CHARGE via 0043's candidate.deferred_pre_disclosure edge, then books from a legal state. A refusal is ALWAYS returned as ok=false so the worker never speaks a confirmation for a booking that did not happen; unknown_status is treated as a refusal, not as success. No Google, no email. Disabled by default.
      security:
        - workerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneWorkerAppointmentRequest'
      responses:
        '200':
          description: Either a booking (ok=true, status ok or ok_prereqs_pending) or a stable refusal (ok=false). ONLY ok=true may be spoken as a confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneWorkerAppointmentResponse'
        '400':
          description: Body validation failed — bad instant format, or duration outside 900-3600 s.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneWorkerAppointmentResponse'
        '401':
          description: Worker bearer credential required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneWorkerError'
        '403':
          description: Worker bearer credential invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneWorkerError'
        '500':
          description: phone_schedule_error — sanitized stable code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneWorkerAppointmentResponse'
        '503':
          description: Phone screening disabled, or the worker credential is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneWorkerError'

  /api/internal/phone/assessment/start:
    post:
      tags: [phone]
      operationId: startPhoneWorkerAssessment
      summary: Bind, activate and snapshot the question plan for a phone screening
      description: Internal, service-authenticated. Called ONCE per leg, immediately after the disclosure gate is accepted and never before it. 0044's start_phone_assessment refuses unless the engagement is already in_call — the same state-machine consent gate 0043 puts on recording, reachable through exactly one transition — so a screening cannot begin on a call nobody consented to. It binds the call_sessions row to the engagement and the attempt after VERIFYING the binding (the session must already name its own deterministic phone room in external_call_id and must belong to the engagement's candidate; a worker cannot hand us somebody else's session), activates it waiting->in_progress idempotently, and snapshots an IMMUTABLE question plan from the role's validated screening_template — or, when that template is empty, from the deterministic default plan. A malformed template is REFUSED rather than replaced by the defaults, because screening a candidate against questions nobody chose while the recruiter believes their own are running is the worse of the two failures. Every call is idempotent: a reconnecting leg gets the ORIGINAL snapshot back, so a role edited mid-call cannot renumber a conversation in progress. The response is a projection built key by key and is a strict SUBSET of the browser worker context — no phone number, no SIP or provider identifier, no attempt id, no room name, no egress key and no raw resume. Disabled by default.
      security:
        - workerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneAssessmentStartRequest'
      responses:
        '200':
          description: Either the full assessment state (ok=true) or a stable refusal (ok=false), including disclosure_not_delivered, invalid_role_template, session_candidate_mismatch and session_binding_mismatch. A refusal is never a reason to ask a question.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneAssessmentStateResponse'
        '400':
          description: Request body failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneAssessmentStateResponse'
        '401':
          description: Worker bearer credential required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneWorkerError'
        '403':
          description: Worker bearer credential invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneWorkerError'
        '500':
          description: phone_assessment_error — sanitized stable code, never a driver message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneAssessmentStateResponse'
        '503':
          description: Phone screening disabled, or the worker credential is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneWorkerError'

  /api/internal/phone/assessment/turn:
    post:
      tags: [phone]
      operationId: commitPhoneWorkerQuestionBoundary
      summary: Commit one completed question boundary atomically
      description: Internal, service-authenticated. One call is ONE completed question — its ordered turns, its progress row and its cursor advance, in a single transaction under the session row lock. Half a boundary is precisely the state a reconnect misreads, so any failure rolls the whole thing back and the worker re-drives it under the same source_event_id. turns is an ORDERED array rather than a pair, so a follow-up exchange on the same key rides inside the boundary it belongs to; that is what "a follow-up does not advance the cursor" means mechanically, because the only call that advances the cursor is the one that closes the question. question_key must be the key the cursor currently owes — not any key in the plan and not any unanswered key — so a model can neither skip a mandatory question nor claim another one; a mismatch is refused key_not_current and names the key actually owed. expected_index is a compare-and-swap and an OMITTED value is refused as firmly as a wrong one, because a CAS a caller may leave out is a guard that can be skipped. A repeated source_event_id returns the ORIGINAL success without appending anything. A worker that does not receive ok=true MUST NOT ask the next question and MUST NOT claim a completion. Disabled by default.
      security:
        - workerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneAssessmentTurnRequest'
      responses:
        '200':
          description: ok=true only when the boundary is durable. Every other value — stale_cursor, key_not_current, invalid_turns, plan_missing, plan_complete, session_not_active, unknown_session, unknown_status — means nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneAssessmentTurnResponse'
        '400':
          description: Request body failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneAssessmentTurnResponse'
        '401':
          description: Worker bearer credential required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneWorkerError'
        '403':
          description: Worker bearer credential invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneWorkerError'
        '500':
          description: phone_assessment_error — sanitized stable code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneAssessmentTurnResponse'
        '503':
          description: Phone screening disabled, or the worker credential is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneWorkerError'

  /api/internal/phone/assessment/complete:
    post:
      tags: [phone]
      operationId: completePhoneWorkerAssessment
      summary: Complete the session, await scoring, and verify the assessment exists
      description: Internal, service-authenticated, and the ordering this phase exists for — every plan key durable, then the session completion CAS, then AWAIT the shared runAssessment, then VERIFY the assessment row. The browser route fires scoring on a detached eight-second timer and swallows the error, which is right for a path whose completed session is durable on its own and where a reconciler can retry; it is wrong here, because nothing may claim a phone completion until the score exists. A completion CAS CONFLICT is not a failure — two legs racing to complete is exactly what a reconnect produces — so the loser still scores and still verifies. This endpoint NEVER posts assessment.completed itself: it reports whether a score exists, the worker posts the event through /api/internal/phone/events, and 0044's apply_phone_event refuses that event outright when the row is absent. The claim is therefore gated twice and the second gate is in SQL. Scoring is idempotent for the phone source: a partial unique index admits exactly one assessment per session and the loser of the race reuses the winner's row without repeating the notification intent, the candidate status update or the Ashby writeback. Disabled by default.
      security:
        - workerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneAssessmentCompleteRequest'
      responses:
        '200':
          description: ok=true with status scored means an assessment row exists and a completion may now be claimed. Every other value — plan_incomplete, completion_failed, scoring_failed, assessment_missing, session_not_active, plan_missing, unknown_session, unknown_status — means it may not.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneAssessmentCompleteResponse'
        '400':
          description: Request body failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneAssessmentCompleteResponse'
        '401':
          description: Worker bearer credential required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneWorkerError'
        '403':
          description: Worker bearer credential invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneWorkerError'
        '500':
          description: phone_assessment_error — sanitized stable code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneAssessmentCompleteResponse'
        '503':
          description: Phone screening disabled, or the worker credential is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneWorkerError'

  # ── Ashby integration ──────────────────────────────────────────────
  /api/integrations/livekit-phone/webhook:
    post:
      tags: [phone]
      operationId: receiveLiveKitPhoneWebhook
      summary: Receive a LiveKit phone webhook verified by the signed Authorize JWT
      description: Inbound LiveKit phone webhook receiver for outbound phone screening. The only trust boundary is the LiveKit Authorize JWT, whose sha256 claim is verified against the exact raw request bytes before any JSON parsing, with issuer, expiry and not-before enforced under an explicit clock tolerance (PHONE_WEBHOOK_TOLERANCE_SECONDS, default 300 seconds, a deliberate widening of the SDK default of 10). This is not the Ashby HMAC scheme. Not recruiter authenticated and mounted before auth; only this exact method and path are public. The call attempt is resolved solely from the deterministic phone participant identity, never from a phone number, and no participant attribute other than the fencing epoch is read. Disabled by default and fails closed with no database or network work until the phone screening master flag is on and the existing LiveKit key pair is configured. Duplicate deliveries return the original outcome; unknown, stale, terminal and unexpected events are accepted and recorded with a stable sanitized status.
      parameters:
        - name: Authorize
          in: header
          required: true
          description: LiveKit-signed JWT whose sha256 claim is the digest of the raw request body.
          schema:
            type: string
      responses:
        '200':
          description: Verdict reached and durable, duplicate acknowledged with the original outcome, or a non-phone LiveKit event accepted and ignored without database work.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneWebhookAck'
        '400':
          description: Empty body, a body that is not valid UTF-8, or a signed event name this SDK version cannot produce (non-retryable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneWebhookError'
        '401':
          description: Authorize header missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneWebhookError'
        '403':
          description: JWT signature, expiry tolerance, or body hash did not verify.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneWebhookError'
        '413':
          description: Raw body exceeded PHONE_WEBHOOK_MAX_BYTES.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneWebhookError'
        '500':
          description: The apply outcome could not be determined and redelivery is wanted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneWebhookError'
        '503':
          description: Phone screening disabled or LiveKit credentials not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneWebhookError'
  /api/integrations/ashby/webhook:
    post:
      tags: [ashby]
      operationId: receiveAshbyWebhook
      summary: Receive an Ashby webhook verified by HMAC-SHA256 over the raw body
      description: Inbound Ashby webhook receiver. The only trust boundary is the Ashby-Signature header verified as an HMAC-SHA256 of the exact raw request bytes before JSON parsing. Not recruiter authenticated. Disabled by default and fails closed until the integration flag and secret are configured. Ashby's signed idless configuration ping is acknowledged without persistence or queue work so webhook create/edit can enable delivery.
      parameters:
        - name: Ashby-Signature
          in: header
          required: true
          description: HMAC-SHA256 of the raw request body as sha256 equals hex.
          schema:
            type: string
      responses:
        '200':
          description: Signal durably received, duplicate acknowledged, or signed configuration ping accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyWebhookAck'
        '400':
          description: Malformed signature or body, or an unusable payload (non-retryable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyWebhookError'
        '401':
          description: Signature header missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyWebhookError'
        '403':
          description: Signature did not verify.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyWebhookError'
        '413':
          description: Raw body exceeded the byte bound.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyWebhookError'
        '500':
          description: Durable ingress failed and is retryable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyWebhookError'
        '503':
          description: Integration disabled or secret not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyWebhookError'

  # ── Ashby Mission Control (recruiter/admin authenticated) ───────────
  /api/integrations/ashby/mission-control/mappings:
    get:
      tags: [ashby]
      operationId: listAshbyMappings
      summary: List Ashby job mappings for Mission Control
      description: Sanitized job-mapping projections (status incl. paused/drift, delivery mode, completeness) for HR/admin review. Interviewer role or above. No PII or tokens.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum rows to return (bounded).
          schema:
            type: integer
      responses:
        '200':
          description: Sanitized mapping list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcMappingsResponse'
    post:
      tags: [ashby]
      operationId: upsertAshbyMapping
      summary: Create or update an Ashby job mapping (always paused)
      description: Admin-only. ALWAYS writes the mapping in the `paused` state — this endpoint can never enable one. Enabling remains the separate POST /mappings/{id}/resume action, which the database still gates on stage completeness and absence of drift. invite_ttl_hours is fixed at 24 by a DB CHECK; supplying any other value is rejected.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AshbyMappingUpsertRequest'
      responses:
        '201':
          description: Mapping created or updated; always paused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMappingUpsertResponse'
  /api/integrations/ashby/mission-control/health:
    get:
      tags: [ashby]
      operationId: getAshbyRuntimeHealth
      summary: Ashby integration and runtime health
      description: Booleans, bounded integers and counts ONLY — never the API key, the webhook secret, an allowlisted resume host, an invite token, a presigned URL, or any candidate field. Makes no live-connectivity claim: `provider` is always `unknown` because this handler contacts no provider. Interviewer role or above; deliberately separate from the unauthenticated liveness-only /api/health.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sanitized integration + runtime configuration state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyRuntimeHealthResponse'
  /api/integrations/ashby/mission-control/jobs/{externalJobId}/stages:
    get:
      tags: [ashby]
      operationId: probeAshbyJobStages
      summary: Read-only tenant probe for a job's interview stages
      description: Admin-only discovery. Performs exactly one allowlisted READ operation (jobInterviewPlan.info) and returns sanitized stage ids plus bounded display titles. Writes nothing — it proposes stage ids that an admin applies via POST /mappings. Returns 503 when the runtime gates are closed (no client is constructed and no network call is made).
      security:
        - bearerAuth: []
      parameters:
        - name: externalJobId
          in: path
          required: true
          description: Opaque Ashby job id.
          schema:
            type: string
      responses:
        '200':
          description: Sanitized stage descriptors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyProbeStagesResponse'
  /api/integrations/ashby/mission-control/jobs/{externalJobId}/feedback-form:
    get:
      tags: [ashby]
      operationId: discoverAshbyFeedbackForm
      summary: Read-only feedback-form SCHEMA discovery for a job
      description: Read-only admin discovery of sanitized feedback-form structure using jobInterviewPlan.info. It does not read feedback content, write data, or create a binding. A false schemaAvailable value means the provider named a form without returning its field schema.
      security:
        - bearerAuth: []
      parameters:
        - name: externalJobId
          in: path
          required: true
          description: Opaque Ashby job id.
          schema:
            type: string
      responses:
        '200':
          description: Sanitized feedback-form schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyFeedbackFormResponse'
  /api/integrations/ashby/mission-control/workflows:
    get:
      tags: [ashby]
      operationId: listAshbyWorkflows
      summary: List Ashby application workflows for Mission Control
      description: Sanitized application-workflow projections (lifecycle, terminal, ingestion state, operation states and sanitized error codes) for HR/admin review. Interviewer role or above. No candidate PII, tokens, or presigned URLs.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum rows to return (bounded).
          schema:
            type: integer
      responses:
        '200':
          description: Sanitized workflow list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcWorkflowsResponse'
  /api/integrations/ashby/mission-control/mappings/{id}/pause:
    post:
      tags: [ashby]
      operationId: pauseAshbyMapping
      summary: Pause an Ashby job mapping
      description: Admin-only. Pauses a mapping so no further applications are processed. Audited and race-safe inside the RPC.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Mapping paused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcActionResponse'
        '400':
          description: Invalid mapping id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcError'
        '404':
          description: Mapping not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcError'
        '409':
          description: Action rejected by the mapping gate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcError'
  /api/integrations/ashby/mission-control/mappings/{id}/resume:
    post:
      tags: [ashby]
      operationId: resumeAshbyMapping
      summary: Resume (enable) an Ashby job mapping
      description: Admin-only. Enables a mapping only when it is complete (both stage ids) and not drifted; otherwise 409. Audited and race-safe inside the RPC.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Mapping resumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcActionResponse'
        '400':
          description: Invalid mapping id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcError'
        '404':
          description: Mapping not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcError'
        '409':
          description: Cannot enable an incomplete or drifted mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcError'
  /api/integrations/ashby/mission-control/workflows/{id}/cancel:
    post:
      tags: [ashby]
      operationId: cancelAshbyWorkflow
      summary: Terminal-cancel an Ashby application workflow
      description: Admin-only atomic terminal cancellation — marks the application link terminal and cancels every in-flight operation and the in-flight ingestion in one transaction. Idempotent. Never reverses succeeded work or auto-rejects.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                terminal_state:
                  type: string
                  enum: [withdrawn, deleted, manual_stage_cancel]
                reason:
                  type: string
              additionalProperties: false
      responses:
        '200':
          description: Application terminal-cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcCancelResponse'
        '400':
          description: Invalid workflow id or terminal state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcError'
        '404':
          description: Workflow not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcError'
        '409':
          description: Workflow already terminal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcError'
  /api/integrations/ashby/mission-control/workflows/{id}/invite:
    post:
      tags: [ashby]
      operationId: deliverAshbyManualInvite
      summary: Issue a usable manual invite link for an Ashby application
      description: Admin-only. Atomically revokes every prior ACTIVE invite for the application's session and issues exactly one new 24-hour invite, persisting ONLY its SHA-256 digest. Returns the candidate join URL exactly once in this response; the token is carried in the URL fragment and is never logged, audited, persisted, placed in a query string, or sent to Ashby. The response is uncacheable (Cache-Control no-store). Refuses a terminal application and one whose screening session has not been materialized.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Ashby application-link id.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A usable candidate join link, returned exactly once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyManualInviteResponse'
  /api/integrations/ashby/mission-control/operations/{id}/retry:
    post:
      tags: [ashby]
      operationId: retryAshbyOperation
      summary: Retry a failed Ashby operation
      description: Admin-only. Resets a failed safe operation back to pending for a bounded retry. No-op (409) if the operation is not in a retryable state.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Operation re-queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcRetryResponse'
        '400':
          description: Invalid operation id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcError'
        '409':
          description: Operation not in a retryable state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcError'

  /api/integrations/ashby/mission-control/ingestions/{applicationLinkId}/retry:
    post:
      tags: [ashby]
      operationId: retryAshbyIngestionParse
      summary: Retry a parse-class failed resume ingestion (bounded, audited)
      description: Admin-only. Returns ONE resume ingestion rested in failed_review on a parse-availability reason to queued. This is NOT an attempt-counter reset - the transition charges an attempt against the unchanged five-requeue ceiling, so an exhausted row is refused (409) rather than resurrected. Document verdicts (an unparseable document, garbled or absent extractor output, an exceeded output bound, no extractable fields, a rejected magic/MIME guard, an infected scan) are never recoverable and answer 409. The legacy generic parse_error IS accepted, within the same ceiling, so a row written before failures were sub-classified can be reclassified. Issues no invite and moves no stage. The response carries no failure reason, file handle, external Ashby id, or candidate field.
      security:
        - bearerAuth: []
      parameters:
        - name: applicationLinkId
          in: path
          required: true
          description: Opaque Ashby application link id (UUID). Carries no candidate identifier or PII.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ingestion re-queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcRetryResponse'
        '400':
          description: Invalid application link id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcError'
        '409':
          description: Not recoverable - unknown link, a non-failed_review row, a terminal application, a document-verdict reason, or an exhausted ceiling.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcError'

  /api/integrations/ashby/mission-control/ingestions/{applicationLinkId}/retry-legacy-parse:
    post:
      tags: [ashby]
      operationId: retryAshbyLegacyBadOutput
      summary: One-shot release of a legacy stdout-polluted parse_bad_output ingestion
      description: Admin-only. Releases ONE resume ingestion rested on parse_bad_output that was written BEFORE the server-stamped stdout-purity boundary - i.e. while a bundled PDF library could still write warnings to the parser child's stdout protocol channel and turn a well-formed result into a document verdict it never earned. Eligibility is decided entirely server-side; no caller value contributes to it. A parse_bad_output written AFTER that boundary is a genuine protocol anomaly and is refused, as is every other document verdict (unparseable document, absent or over-large extractor output, no extractable fields, a rejected magic/MIME guard, an infected scan) and every transport reason. Strictly one release per row, ever, AND still inside the unchanged five-requeue ceiling - whichever is stricter. Issues no invite, moves no stage, calls no provider. The response carries no failure reason, boundary, file handle, external Ashby id, or candidate field.
      security:
        - bearerAuth: []
      parameters:
        - name: applicationLinkId
          in: path
          required: true
          description: Opaque Ashby application link id (UUID). Carries no candidate identifier or PII.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ingestion re-queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcRetryResponse'
        '400':
          description: Invalid application link id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcError'
        '409':
          description: Not eligible - unknown link, a non-failed_review row, a terminal application, a reason other than parse_bad_output, a parse_bad_output newer than the boundary, a release already spent, an exhausted ceiling, or an ingestion job already in flight.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcError'

  # ── Ashby candidate-scoped review (authenticated recruiter) ────────
  /api/integrations/ashby/review/{applicationLinkId}:
    parameters:
      - name: applicationLinkId
        in: path
        required: true
        description: Opaque Ashby application link id (UUID). Carries no candidate identifier or PII.
        schema:
          type: string
          format: uuid
    get:
      tags: [ashby]
      operationId: getAshbyScopedReview
      summary: Candidate Overview + Review payload resolved from an application link
      description: Read-only. Resolves the candidate/session SERVER-SIDE from the opaque application link and returns the same envelope as GET /api/candidates/{id}. Viewer role or above; the existing interviewer ownership rule is re-applied, so the link grants no new privilege. A malformed, unknown, unlinked or unowned id all return the identical 404, so the surface cannot be used to enumerate links.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Candidate, sessions and assessments envelopes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateDetail'
        '404':
          description: Link unknown, unresolved, not owned by the caller, or malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '500':
          description: Sanitized internal error — a database lookup failed. Deliberately distinct from the 404 so an outage is retryable and is not shown as "removed or no access"; returned identically whether or not the link exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/integrations/ashby/review/{applicationLinkId}/notes:
    parameters:
      - name: applicationLinkId
