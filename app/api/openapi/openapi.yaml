# OpenAPI 3.0.3 specification for the HR screening bot API.
#
# Phase 6 (TST-02): documents ONLY routes that already exist in
# app/api/src/app.ts and the route modules as of origin/main 4f7293d.
# This file is the single source of truth that contract-openapi.test.ts
# validates the live Express handlers against.
#
# Conventions:
#   - additionalProperties: false  => the handler CONSTRUCTS this object
#     (its shape is fixed by code); the contract test asserts exactness.
#   - additionalProperties omitted => pass-through DB row; the test asserts
#     the documented required keys and types only.
#   - Every documented route exists in the live app; the contract test
#     asserts the reverse direction too (no undocumented mounted routes).
#
# L5 (Phase 7) removed the grant-route shadow: POST /api/livekit/grant/recording
# is now registered BEFORE POST /api/livekit/{sessionId}/recording, so the
# literal "grant" segment is no longer captured by the UUID path-param route.
# The grant endpoint mints a short-TTL signed URL (200 {url}) and is gated
# fail-closed on revoked (403) / quarantined (409) / deleted (404) recordings.

openapi: 3.0.3
info:
  title: HR Screening Bot API
  version: 0.2.0
  description: Backend API for the AI HR screening bot (Supabase screening_v2 + LiveKit voice).
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: health
  - name: roles
  - name: candidates
  - name: resumes
  - name: screening
  - name: assess
  - name: livekit
  - name: recordings
  - name: dsar
  - name: consent
  - name: csp

paths:
  # ── Health ──────────────────────────────────────────────────────────
  /api/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Service health probe
      security: []
      responses:
        '200':
          description: Service is up. Bounded to ok:true — no model/provider/internal dependency leakage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # ── CSP violation report (public, unauthenticated by design) ───────
  /api/csp-report:
    post:
      tags: [csp]
      operationId: reportCspViolation
      summary: Bounded CSP violation report endpoint (64 KiB, 204 always)
      security: []
      responses:
        '204':
          description: Accepted and logged; browsers must not see retry/error signals.

  # ── Roles ──────────────────────────────────────────────────────────
  /api/roles:
    get:
      tags: [roles]
      operationId: listRoles
      summary: List roles (viewer+; interviewer scoped to own records)
      responses:
        '200':
          description: Array of role rows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
    post:
      tags: [roles]
      operationId: createRole
      summary: Create role with screening template (interviewer+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: Created role row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal error (including fail-closed audit sink failure).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/roles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [roles]
      operationId: getRole
      summary: Get one role (viewer+; interviewer must own)
      responses:
        '200':
          description: Role row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Role not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
    put:
      tags: [roles]
      operationId: updateRole
      summary: Update role (interviewer+; interviewer must own)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Updated role row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Role not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '500':
          description: Internal error (including fail-closed audit sink failure).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  # ── Candidates ─────────────────────────────────────────────────────
  /api/candidates:
    get:
      tags: [candidates]
      operationId: listCandidates
      summary: List candidates (viewer+; interviewer scoped to own records)
      parameters:
        - name: role_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Array of candidate list rows (projected columns).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CandidateListItem'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/candidates/summary:
    get:
      tags: [candidates]
      operationId: getCandidatesSummary
      summary: Aggregate assessment metrics (viewer+; interviewer scoped to own records)
      responses:
        '200':
          description: Aggregate assessment metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidatesSummary'

  /api/candidates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [candidates]
      operationId: getCandidate
      summary: Candidate detail with latest sessions and assessments (viewer+)
      responses:
        '200':
          description: Candidate, sessions and assessments envelopes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateDetail'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Candidate not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'

  /api/candidates/{id}/ashby-workflow:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [candidates, ashby]
      operationId: getCandidateAshbyWorkflow
      summary: Read-only Ashby screening workflow status for a candidate (viewer+)
      description: Sanitized, read-only projection of the candidate's Ashby screening workflow, rendered as a status card in the candidate Overview. Same state vocabulary as the Mission Control workflow list, but deliberately narrower - it never returns external Ashby identifiers, internal row ids (application link, operation, ingestion, session), operation keys, markers, leases, invite tokens, provider payloads, or candidate PII. Viewer role or above; the existing interviewer ownership rule is re-applied verbatim, so this grants no new access. A malformed id, an unknown candidate and a candidate the caller does not own all return the identical 404 used by GET /api/candidates/{id}. A candidate with no Ashby application link is not an error - the response is 200 with `workflow: null` and no card is rendered. There is no action on this surface; retry, cancel and stage controls remain in Mission Control.
      responses:
        '200':
          description: The candidate's current Ashby workflow, or null when not Ashby-linked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyCandidateWorkflowResponse'
        '404':
          description: Candidate unknown, not owned by the caller, or malformed id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '500':
          description: Sanitized internal error - a database lookup failed. Deliberately distinct from the 404 so an outage is retryable and is not shown as "not found"; returned identically whether or not the candidate exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  # ── Resumes ────────────────────────────────────────────────────────
  /api/resumes:
    post:
      tags: [resumes]
      operationId: uploadResume
      summary: Upload and ingest a resume (interviewer+; creates candidate + consent record)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                role_id:
                  type: string
                  format: uuid
              required: [file]
      responses:
        '201':
          description: Candidate and resume rows plus normalized phone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeUploadResponse'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Recruiter authorization required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Upload guard, malware or parse rejection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '502':
          description: Storage, brain or persistence failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  # ── Screening ──────────────────────────────────────────────────────
  /api/screening/start:
    post:
      tags: [screening]
      operationId: startScreening
      summary: Start a simulation screening session (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartScreeningRequest'
      responses:
        '201':
          description: Session id plus the bot opening message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartScreeningResponse'
        '400':
          description: Request validation failed or candidate_id missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'

  /api/screening/{id}/turn:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [screening]
      operationId: screeningTurn
      summary: Submit a candidate turn and get the bot reply (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScreeningTurnRequest'
      responses:
        '200':
          description: Bot message, done flag, assessment and scoring status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreeningTurnResponse'
        '400':
          description: Request validation failed or text missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '404':
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '409':
          description: Session already completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'

  /api/screening/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [screening]
      operationId: getScreeningSession
      summary: Session, transcript and latest assessment (admin only)
      responses:
        '200':
          description: Session detail envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreeningSessionDetail'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Screening session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'

  # ── Assess ─────────────────────────────────────────────────────────
  /api/assess/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [assess]
      operationId: runAssessment
      summary: Score a completed screening session (admin only)
      responses:
        '200':
          description: Assessment object (API shape) with id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal error (including fail-closed audit sink failure).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/internal/assess/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [assess]
      operationId: runWorkerAssessment
      summary: Score a completed screening session from the voice worker
      security:
        - workerBearer: []
      responses:
        '200':
          description: Assessment object created by the configured scoring provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
        '400':
          description: Session identifier validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Worker bearer credential required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerContextError'
        '403':
          description: Worker bearer credential invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerContextError'
        '409':
          description: Session is not eligible for assessment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Scoring or persistence failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: Worker credential is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerContextError'

  # ── Ashby integration ──────────────────────────────────────────────
  /api/integrations/ashby/webhook:
    post:
      tags: [ashby]
      operationId: receiveAshbyWebhook
      summary: Receive an Ashby webhook verified by HMAC-SHA256 over the raw body
      description: Inbound Ashby webhook receiver. The only trust boundary is the Ashby-Signature header verified as an HMAC-SHA256 of the exact raw request bytes before JSON parsing. Not recruiter authenticated. Disabled by default and fails closed until the integration flag and secret are configured. Ashby's signed idless configuration ping is acknowledged without persistence or queue work so webhook create/edit can enable delivery.
      parameters:
        - name: Ashby-Signature
          in: header
          required: true
          description: HMAC-SHA256 of the raw request body as sha256 equals hex.
          schema:
            type: string
      responses:
        '200':
          description: Signal durably received, duplicate acknowledged, or signed configuration ping accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyWebhookAck'
        '400':
          description: Malformed signature or body, or an unusable payload (non-retryable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyWebhookError'
        '401':
          description: Signature header missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyWebhookError'
        '403':
          description: Signature did not verify.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyWebhookError'
        '413':
          description: Raw body exceeded the byte bound.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyWebhookError'
        '500':
          description: Durable ingress failed and is retryable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyWebhookError'
        '503':
          description: Integration disabled or secret not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyWebhookError'

  # ── Ashby Mission Control (recruiter/admin authenticated) ───────────
  /api/integrations/ashby/mission-control/mappings:
    get:
      tags: [ashby]
      operationId: listAshbyMappings
      summary: List Ashby job mappings for Mission Control
      description: Sanitized job-mapping projections (status incl. paused/drift, delivery mode, completeness) for HR/admin review. Interviewer role or above. No PII or tokens.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum rows to return (bounded).
          schema:
            type: integer
      responses:
        '200':
          description: Sanitized mapping list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcMappingsResponse'
    post:
      tags: [ashby]
      operationId: upsertAshbyMapping
      summary: Create or update an Ashby job mapping (always paused)
      description: Admin-only. ALWAYS writes the mapping in the `paused` state — this endpoint can never enable one. Enabling remains the separate POST /mappings/{id}/resume action, which the database still gates on stage completeness and absence of drift. invite_ttl_hours is fixed at 24 by a DB CHECK; supplying any other value is rejected.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AshbyMappingUpsertRequest'
      responses:
        '201':
          description: Mapping created or updated; always paused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMappingUpsertResponse'
  /api/integrations/ashby/mission-control/health:
    get:
      tags: [ashby]
      operationId: getAshbyRuntimeHealth
      summary: Ashby integration and runtime health
      description: Booleans, bounded integers and counts ONLY — never the API key, the webhook secret, an allowlisted resume host, an invite token, a presigned URL, or any candidate field. Makes no live-connectivity claim: `provider` is always `unknown` because this handler contacts no provider. Interviewer role or above; deliberately separate from the unauthenticated liveness-only /api/health.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sanitized integration + runtime configuration state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyRuntimeHealthResponse'
  /api/integrations/ashby/mission-control/jobs/{externalJobId}/stages:
    get:
      tags: [ashby]
      operationId: probeAshbyJobStages
      summary: Read-only tenant probe for a job's interview stages
      description: Admin-only discovery. Performs exactly one allowlisted READ operation (jobInterviewPlan.info) and returns sanitized stage ids plus bounded display titles. Writes nothing — it proposes stage ids that an admin applies via POST /mappings. Returns 503 when the runtime gates are closed (no client is constructed and no network call is made).
      security:
        - bearerAuth: []
      parameters:
        - name: externalJobId
          in: path
          required: true
          description: Opaque Ashby job id.
          schema:
            type: string
      responses:
        '200':
          description: Sanitized stage descriptors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyProbeStagesResponse'
  /api/integrations/ashby/mission-control/jobs/{externalJobId}/feedback-form:
    get:
      tags: [ashby]
      operationId: discoverAshbyFeedbackForm
      summary: Read-only feedback-form SCHEMA discovery for a job
      description: Read-only admin discovery of sanitized feedback-form structure using jobInterviewPlan.info. It does not read feedback content, write data, or create a binding. A false schemaAvailable value means the provider named a form without returning its field schema.
      security:
        - bearerAuth: []
      parameters:
        - name: externalJobId
          in: path
          required: true
          description: Opaque Ashby job id.
          schema:
            type: string
      responses:
        '200':
          description: Sanitized feedback-form schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyFeedbackFormResponse'
  /api/integrations/ashby/mission-control/workflows:
    get:
      tags: [ashby]
      operationId: listAshbyWorkflows
      summary: List Ashby application workflows for Mission Control
      description: Sanitized application-workflow projections (lifecycle, terminal, ingestion state, operation states and sanitized error codes) for HR/admin review. Interviewer role or above. No candidate PII, tokens, or presigned URLs.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum rows to return (bounded).
          schema:
            type: integer
      responses:
        '200':
          description: Sanitized workflow list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcWorkflowsResponse'
  /api/integrations/ashby/mission-control/mappings/{id}/pause:
    post:
      tags: [ashby]
      operationId: pauseAshbyMapping
      summary: Pause an Ashby job mapping
      description: Admin-only. Pauses a mapping so no further applications are processed. Audited and race-safe inside the RPC.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Mapping paused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcActionResponse'
        '400':
          description: Invalid mapping id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcError'
        '404':
          description: Mapping not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcError'
        '409':
          description: Action rejected by the mapping gate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcError'
  /api/integrations/ashby/mission-control/mappings/{id}/resume:
    post:
      tags: [ashby]
      operationId: resumeAshbyMapping
      summary: Resume (enable) an Ashby job mapping
      description: Admin-only. Enables a mapping only when it is complete (both stage ids) and not drifted; otherwise 409. Audited and race-safe inside the RPC.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Mapping resumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcActionResponse'
        '400':
          description: Invalid mapping id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcError'
        '404':
          description: Mapping not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcError'
        '409':
          description: Cannot enable an incomplete or drifted mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcError'
  /api/integrations/ashby/mission-control/workflows/{id}/cancel:
    post:
      tags: [ashby]
      operationId: cancelAshbyWorkflow
      summary: Terminal-cancel an Ashby application workflow
      description: Admin-only atomic terminal cancellation — marks the application link terminal and cancels every in-flight operation and the in-flight ingestion in one transaction. Idempotent. Never reverses succeeded work or auto-rejects.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                terminal_state:
                  type: string
                  enum: [withdrawn, deleted, manual_stage_cancel]
                reason:
                  type: string
              additionalProperties: false
      responses:
        '200':
          description: Application terminal-cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcCancelResponse'
        '400':
          description: Invalid workflow id or terminal state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcError'
        '404':
          description: Workflow not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcError'
        '409':
          description: Workflow already terminal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcError'
  /api/integrations/ashby/mission-control/workflows/{id}/invite:
    post:
      tags: [ashby]
      operationId: deliverAshbyManualInvite
      summary: Issue a usable manual invite link for an Ashby application
      description: Admin-only. Atomically revokes every prior ACTIVE invite for the application's session and issues exactly one new 24-hour invite, persisting ONLY its SHA-256 digest. Returns the candidate join URL exactly once in this response; the token is carried in the URL fragment and is never logged, audited, persisted, placed in a query string, or sent to Ashby. The response is uncacheable (Cache-Control no-store). Refuses a terminal application and one whose screening session has not been materialized.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Ashby application-link id.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A usable candidate join link, returned exactly once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyManualInviteResponse'
  /api/integrations/ashby/mission-control/operations/{id}/retry:
    post:
      tags: [ashby]
      operationId: retryAshbyOperation
      summary: Retry a failed Ashby operation
      description: Admin-only. Resets a failed safe operation back to pending for a bounded retry. No-op (409) if the operation is not in a retryable state.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Operation re-queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcRetryResponse'
        '400':
          description: Invalid operation id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcError'
        '409':
          description: Operation not in a retryable state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcError'

  /api/integrations/ashby/mission-control/ingestions/{applicationLinkId}/retry:
    post:
      tags: [ashby]
      operationId: retryAshbyIngestionParse
      summary: Retry a parse-class failed resume ingestion (bounded, audited)
      description: Admin-only. Returns ONE resume ingestion rested in failed_review on a parse-availability reason to queued. This is NOT an attempt-counter reset - the transition charges an attempt against the unchanged five-requeue ceiling, so an exhausted row is refused (409) rather than resurrected. Document verdicts (an unparseable document, garbled or absent extractor output, an exceeded output bound, no extractable fields, a rejected magic/MIME guard, an infected scan) are never recoverable and answer 409. The legacy generic parse_error IS accepted, within the same ceiling, so a row written before failures were sub-classified can be reclassified. Issues no invite and moves no stage. The response carries no failure reason, file handle, external Ashby id, or candidate field.
      security:
        - bearerAuth: []
      parameters:
        - name: applicationLinkId
          in: path
          required: true
          description: Opaque Ashby application link id (UUID). Carries no candidate identifier or PII.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ingestion re-queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcRetryResponse'
        '400':
          description: Invalid application link id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcError'
        '409':
          description: Not recoverable - unknown link, a non-failed_review row, a terminal application, a document-verdict reason, or an exhausted ceiling.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcError'

  /api/integrations/ashby/mission-control/ingestions/{applicationLinkId}/retry-legacy-parse:
    post:
      tags: [ashby]
      operationId: retryAshbyLegacyBadOutput
      summary: One-shot release of a legacy stdout-polluted parse_bad_output ingestion
      description: Admin-only. Releases ONE resume ingestion rested on parse_bad_output that was written BEFORE the server-stamped stdout-purity boundary - i.e. while a bundled PDF library could still write warnings to the parser child's stdout protocol channel and turn a well-formed result into a document verdict it never earned. Eligibility is decided entirely server-side; no caller value contributes to it. A parse_bad_output written AFTER that boundary is a genuine protocol anomaly and is refused, as is every other document verdict (unparseable document, absent or over-large extractor output, no extractable fields, a rejected magic/MIME guard, an infected scan) and every transport reason. Strictly one release per row, ever, AND still inside the unchanged five-requeue ceiling - whichever is stricter. Issues no invite, moves no stage, calls no provider. The response carries no failure reason, boundary, file handle, external Ashby id, or candidate field.
      security:
        - bearerAuth: []
      parameters:
        - name: applicationLinkId
          in: path
          required: true
          description: Opaque Ashby application link id (UUID). Carries no candidate identifier or PII.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ingestion re-queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcRetryResponse'
        '400':
          description: Invalid application link id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcError'
        '409':
          description: Not eligible - unknown link, a non-failed_review row, a terminal application, a reason other than parse_bad_output, a parse_bad_output newer than the boundary, a release already spent, an exhausted ceiling, or an ingestion job already in flight.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyMcError'

  # ── Ashby candidate-scoped review (authenticated recruiter) ────────
  /api/integrations/ashby/review/{applicationLinkId}:
    parameters:
      - name: applicationLinkId
        in: path
        required: true
        description: Opaque Ashby application link id (UUID). Carries no candidate identifier or PII.
        schema:
          type: string
          format: uuid
    get:
      tags: [ashby]
      operationId: getAshbyScopedReview
      summary: Candidate Overview + Review payload resolved from an application link
      description: Read-only. Resolves the candidate/session SERVER-SIDE from the opaque application link and returns the same envelope as GET /api/candidates/{id}. Viewer role or above; the existing interviewer ownership rule is re-applied, so the link grants no new privilege. A malformed, unknown, unlinked or unowned id all return the identical 404, so the surface cannot be used to enumerate links.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Candidate, sessions and assessments envelopes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateDetail'
        '404':
          description: Link unknown, unresolved, not owned by the caller, or malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '500':
          description: Sanitized internal error — a database lookup failed. Deliberately distinct from the 404 so an outage is retryable and is not shown as "removed or no access"; returned identically whether or not the link exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/integrations/ashby/review/{applicationLinkId}/notes:
    parameters:
      - name: applicationLinkId
        in: path
        required: true
        description: Opaque Ashby application link id (UUID).
        schema:
          type: string
          format: uuid
    get:
      tags: [ashby]
      operationId: listAshbyScopedReviewNotes
      summary: Read-only recruiter notes for the linked candidate
      description: Read-only, bounded list of the linked candidate's append-only recruiter notes. Same server-side link resolution, role and ownership rules as the review payload; the scoped experience never adds a note.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Bounded note list, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteListResponse'
        '404':
          description: Link unknown, unresolved, not owned by the caller, or malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '500':
          description: Sanitized internal error — a database lookup failed. Deliberately distinct from the 404 so an outage is retryable and is not shown as "removed or no access"; returned identically whether or not the link exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/integrations/ashby/review/{applicationLinkId}/workflow:
    parameters:
      - name: applicationLinkId
        in: path
        required: true
        description: Opaque Ashby application link id (UUID).
        schema:
          type: string
          format: uuid
    get:
      tags: [ashby]
      operationId: getAshbyScopedReviewWorkflow
      summary: Read-only Ashby workflow status for the linked candidate
      description: The SAME sanitized projection as GET /api/candidates/{id}/ashby-workflow, addressed through the opaque application link instead of a candidate id because the scoped review shell never learns one. Same server-side link resolution, same viewer role rule and same interviewer ownership rule as the rest of this router - it broadens no access and adds no navigation. A linked candidate with no Ashby workflow returns 200 with `workflow: null`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The linked candidate's current Ashby workflow, or null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AshbyCandidateWorkflowResponse'
        '404':
          description: Link unknown, unresolved, not owned by the caller, or malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '500':
          description: Sanitized internal error - a database lookup failed. Deliberately distinct from the 404 so an outage is retryable and is not shown as "removed or no access"; returned identically whether or not the link exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  # ── LiveKit ────────────────────────────────────────────────────────
  /api/livekit/start:
    post:
      tags: [livekit]
      operationId: startLiveKitSession
      summary: Create a LiveKit room + browser session (interviewer+; no candidate join token returned)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiveKitStartRequest'
      responses:
        '201':
          description: Session id, room name and LiveKit URL (no join token).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveKitStartResponse'
        '400':
          description: Request validation failed or candidate_id missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '403':
          description: Access denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '409':
          description: Candidate ownership conflict or session transition conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'

  /api/livekit/{sessionId}/complete:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [livekit]
      operationId: completeCandidateScreening
      summary: Complete a candidate LiveKit screening and trigger scorecard generation
      description: Candidate grant-authenticated endpoint called when the browser leaves the LiveKit room. It marks an in-progress session completed and starts best-effort scoring without requiring recruiter auth, but only after at least one durable transcript turn exists; callers retry transcript_pending while worker writes drain.
      security:
        - grantToken: []
      responses:
        '202':
          description: Session completed, or it was already completed by the worker.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateCompleteResponse'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Grant token missing, malformed, expired, or not bound to this session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '404':
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '409':
          description: Session is not currently completable, or its first transcript turn is still pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '503':
          description: Transcript persistence status could not be verified; completion fails closed and may be retried.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'

  /api/livekit/{sessionId}/recording:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [livekit]
      operationId: uploadRecording
      summary: Upload a recording bound to a session (grant-token or recruiter auth)
      security:
        - grantToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        '200':
          description: Stored object key (no signed URL).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingUploadResponse'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: No grant token and no recruiter auth.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '403':
          description: Grant token not bound to this session, or non-owner recruiter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '404':
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '409':
          description: Recording rejected — either recording_already_exists (one recording per session; replay) or authoritative_recording_pending (a LiveKit room-composite egress is active or completing and must be authoritative; browser upload is not accepted while a non-failed egress exists).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '413':
          description: File exceeds the reduced bounded upload cap (PROPOSED default 25 MiB, hard max 50 MiB) — rejected before buffering.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '415':
          description: Unsupported media type — magic bytes, MIME/extension agreement, or polyglot guard failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Malware scan rejected the upload (fail-closed). At-rest tampering is detected on DOWNLOAD (re-verify vs recording_sha256), not on upload — the upload path never compares against a persisted digest (unreachable + uploader-controlled; see runbook).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/livekit/worker-context:
    post:
      tags: [livekit]
      operationId: resolveWorkerContext
      summary: Resolve minimal worker context from opaque session/room identifiers (worker bearer credential)
      security:
        - workerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerContextRequest'
      responses:
        '200':
          description: Minimal worker context (no resume facts, no PII beyond name).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerContextResponse'
        '400':
          description: Request validation failed or identifiers missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerContextError'
        '401':
          description: Worker bearer credential required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerContextError'
        '403':
          description: Credential invalid or room binding mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerContextError'
        '404':
          description: Session not found or not active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerContextError'
        '503':
          description: Worker credential not configured (deny closed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerContextError'

  /api/livekit/invite:
    post:
      tags: [livekit]
      operationId: createInvite
      summary: Issue a one-time invite token (admin/interviewer; only SHA-256 digest persisted)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteCreateRequest'
      responses:
        '201':
          description: Plaintext token (returned once) and expiry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteCreateResponse'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Recruiter authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '403':
          description: Candidate or owner mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '404':
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '409':
          description: Session not in an invitable state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'

  /api/livekit/exchange:
    post:
      tags: [livekit]
      operationId: exchangeInvite
      summary: Exchange an invite token for a short-lived candidate access grant + LiveKit JWT
      description: 'Gate order: invite validity, maintenance, consent, session joinability, just-in-time room provisioning, one-time invite consume, then grant + LiveKit JWT. A session still in `created` (the shape Ashby materialization produces) has its LiveKit room and authoritative egress provisioned here BEFORE the invite is consumed, so any provisioning failure leaves the invite reusable and mints no token. Sessions already `waiting`/`in_progress` are joined unchanged with no provider call. This route reserves no launch-capacity quota; quota is reserved at session creation on POST /api/livekit/start.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteExchangeRequest'
      responses:
        '200':
          description: Grant token, room binding and short-TTL LiveKit JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteExchangeResponse'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Stable 404 for unknown/expired/revoked/consumed tokens, and for a session that is not joinable (terminal, or moved by a concurrent actor). The invite is left unconsumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '409':
          description: Consent missing, declined, withdrawn, expired, or incomplete (`consent_required`). Invite left unconsumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '503':
          description: Maintenance mode (MaintenanceBlockedBody), or just-in-time room/egress provisioning failed (RoomUnavailableError). In both cases the invite is left unconsumed and the join is retryable. Discriminate on the shape of `error`, object vs string.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MaintenanceBlockedBody'
                  - $ref: '#/components/schemas/RoomUnavailableError'

  /api/livekit/grant/recording:
    post:
      tags: [livekit]
      operationId: grantRecording
      summary: Mint a short-TTL signed URL for a recording via a candidate grant
      description: Registered before /api/livekit/{sessionId}/recording (L5 route-shadow fix). Validates the grant binding, then gates fail-closed on deleted (404) / quarantined (409) / revoked (403) recordings before minting.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordingGrantRequest'
      responses:
        '200':
          description: Short-TTL signed recording URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingGrantResponse'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Grant invalid, not bound to the session, or recording revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '404':
          description: Session/recording not found or recording deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '409':
          description: Recording is quarantined and never served.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'

  # ── Recordings ─────────────────────────────────────────────────────
  /api/recordings/health:
    get:
      tags: [recordings]
      operationId: recordingFinalizeHealth
      summary: Recording-finalization convergence health (admin only)
      description: Operator surface for authoritative-recording convergence (migration 0038). Reports the IN-PROCESS scheduler heartbeat and the DURABLE, multi-machine-safe backlog read live from the database — never derived from metric counters, whose sink is a no-op by default and would report a confident zero. queueDepth and oldestQueuedAgeSec are included because stuckCount alone cannot separate "converging slowly" from "not converging" - the sweeper's three bounds all bound the producer. A backlog read failure surfaces as degraded with reason backlog_unavailable, never as a healthy zero. Registered BEFORE any parameterised GET so it can never be shadowed, and routed to the DEFAULT rate-limit bucket rather than the strict one, so a throttled poll returns HTTP 429 which clients MUST NOT interpret as degraded. The response carries booleans, bounded integers, timestamps and sanitized codes only - no session id, object key, URL, or token.
      responses:
        '200':
          description: Convergence health snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingFinalizeHealth'
        '403':
          description: Caller is not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorBody'
        '429':
          description: Poll rate exceeded. NOT a health signal — retry, do not report degraded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/recordings/{sessionId}/download:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [recordings]
      operationId: downloadRecording
      summary: Mint a short-TTL signed recording URL for a recruiter (viewer+; interviewer must own)
      description: Gates fail-closed on deleted (404) / quarantined (409) / revoked (403). When a completed session has linked Egress but no object key yet, the explicit download request first performs bounded authoritative finalization; pending processing returns 409/503 without minting. Once ready — when recording_sha256 is persisted — stored bytes are re-verified server-side (SHA-256 fetched through storage vs the persisted digest) BEFORE minting. A mismatch or over-cap object quarantines the session (409); a storage read failure is a redacted fail-closed 500 and never mints a URL. No hash (legacy rows) skips re-verification entirely.
      responses:
        '200':
          description: Short-TTL signed URL (never persisted or logged).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingDownloadResponse'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Non-privileged role, not the owning interviewer, or recording revoked (uniform denial).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorBody'
        '404':
          description: Recording not found or deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Recording is still processing, or is quarantined (flag-gated OR caught by download-time re-verification) and never served.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: Authoritative Egress finalization is temporarily unavailable; no URL is minted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Signing failure or integrity re-verification storage failure (redacted stable error; never mints a URL).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/recordings/{sessionId}/revoke:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [recordings]
      operationId: revokeRecording
      summary: Revoke recording access (admin only) — REC-05 write path
      description: Sets recording_revoked_at (CAS-guarded), appends exactly one 'revoked' integrity event (unique partial index; retries backfill a missing event), and audits recording.revoked only on the transition. Both mint paths (recruiter download + candidate grant) then return 403 before createSignedUrl. Retries converge to already_revoked with no duplicate evidence.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordingRevokeRequest'
      responses:
        '200':
          description: Revocation applied (status revoked) or already converged (status already_revoked).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingRevokeResponse'
        '400':
          description: Request validation failed (malformed session id or oversize reason).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Non-admin caller (uniform denial).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorBody'
        '404':
          description: Recording/session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  # ── DSAR ───────────────────────────────────────────────────────────
  /api/dsar:
    post:
      tags: [dsar]
      operationId: createDSAR
      summary: Create a data subject access request (interviewer+; interviewer must own candidate)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDSARRequest'
      responses:
        '201':
          description: Created DSAR request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSAREnvelope'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSARForbidden'
        '500':
          description: Failed to create DSAR request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/dsar/{dsarId}:
    parameters:
      - name: dsarId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [dsar]
      operationId: getDSAR
      summary: Get a DSAR request, optionally with export data (viewer+)
      parameters:
        - name: include_export
          in: query
          required: false
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: DSAR request (optionally with export data when fulfilled export).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSARWithExportEnvelope'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSARForbidden'
        '404':
          description: DSAR request not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSARNotFound'

  /api/dsar/candidate/{candidateId}:
    parameters:
      - name: candidateId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [dsar]
      operationId: listCandidateDSARs
      summary: List DSAR requests for a candidate (viewer+; interviewer must own)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, in_progress, fulfilled, rejected, cancelled]
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [export, delete, correct, restrict]
      responses:
        '200':
          description: Array of DSAR requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSARListEnvelope'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSARForbidden'

  /api/dsar/{dsarId}/fulfill:
    parameters:
      - name: dsarId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [dsar]
      operationId: fulfillDSAR
      summary: Fulfill, reject or cancel a DSAR request (interviewer+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FulfillDSARRequest'
      responses:
        '200':
          description: Updated DSAR request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSAREnvelope'
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSARForbidden'
        '404':
          description: DSAR request not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSARNotFound'
        '500':
          description: Failed to update DSAR status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

