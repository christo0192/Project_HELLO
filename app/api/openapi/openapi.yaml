            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: not_found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneApiError'
        '409':
          description: not_live when the addressed appointment is cancelled, superseded, fulfilled or missed, or any schedule refusal including version_conflict. A version_conflict here may also mean the addressed row stopped being live between the pre-read and the RPC — schedule_phone_appointment compares the expected version ONLY when it finds a live appointment, so that race would otherwise turn a reschedule into a silent create. The route detects it (nothing was superseded), undoes the insert, audits the attempt, and reports appointment_rolled_back.
