      description: Admin only. Delegates to cancel_phone_appointment with the required expected version — the RPC treats a null version as cancel-regardless, which is exactly the lost update the version column prevents. The reason vocabulary is 0042's, NARROWED to the reasons an operator may give; superseded and system_deferral_expired are written only by the substrate itself and are refused here so the audit trail cannot misdescribe what happened. already_cancelled is idempotent success, not a conflict.
