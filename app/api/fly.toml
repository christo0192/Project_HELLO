app = "project-hello-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8787"
  SUPABASE_SCHEMA = "screening_v2"
  COMPANY_NAME = "Interview Kickstart"
  WEB_ORIGIN = "https://ib-ik-project-hello.vercel.app"
  DEEPSEEK_MODEL = "test/deepseek-v4-flash"
  DEEPSEEK_SCORING_MODEL = "test/deepseek-v4-flash"
  DEEPSEEK_BASE_URL = "https://ikey-gateway.fly.dev/v1/chat/completions"
  DEEPSEEK_TIMEOUT_MS = "120000"
  DEEPSEEK_MAX_OUTPUT_BYTES = "5242880"
  RECORDINGS_BUCKET = "recordings_v2"
  RECORDING_DOWNLOAD_TTL_SEC = "300"
  RECORDING_MAX_BYTES = "26214400"
  WORKER_CONTEXT_TIMEOUT_SEC = "5"
  RESUME_SCANNER = "clamav"
  RESUME_SCANNER_TIMEOUT_MS = "30000"
  # Signature freshness. The scanner refuses every file whose screening would
  # rest on a database older than this, rather than trusting a stale
  # `clamscan` exit 0. Far stricter than ClamAV's own 7-day warning; the
  # updater below refreshes hourly, so 24h leaves ~23 consecutive failures of
  # headroom before ingestion is blocked.
  RESUME_SCANNER_DB_DIR = "/var/lib/clamav"
  RESUME_SCANNER_MAX_DB_AGE_HOURS = "24"
  # Signature updater (container supervisor). No database is baked into the
  # image, so these own the whole lifecycle: one attempt at boot, then hourly.
  AV_UPDATER_INTERVAL_MS = "3600000"
  AV_UPDATER_TIMEOUT_MS = "600000"
  RESUME_MAX_COMPRESSED_BYTES = "10485760"
  RESUME_PARSER_TIMEOUT_MS = "30000"
  RESUME_MAX_TEXT_LENGTH = "50000"
  SHUTDOWN_GRACE_MS = "30000"
  BREAKER_FAILURE_THRESHOLD = "5"
  BREAKER_COOLDOWN_MS = "30000"
  BREAKER_TIMEOUT_MS = "60000"
  RATE_LIMIT_DEFAULT = "100"
  RATE_LIMIT_STRICT = "20"
  RATE_LIMIT_IP = "300"
  RATE_LIMIT_WINDOW_SEC = "60"
  TRUSTED_PROXY = "loopback"
  # Ashby runtime: OFF. Flipping this to "true" additionally requires the
  # ASHBY_API_KEY and ASHBY_WEBHOOK_SECRET Fly SECRETS (never [env], never the
  # repo) and ASHBY_INTEGRATION_ENABLED. See docs/runbooks/ashby-runtime-activation.md.
  ASHBY_RUNTIME_ENABLED = "false"
  # Empty ⇒ the resume-download SSRF allowlist stays DISABLED (fail-closed).
  ASHBY_RESUME_HOSTS = ""
  ASHBY_SIGNAL_POLL_MS = "5000"
  ASHBY_OPERATION_POLL_MS = "5000"
  ASHBY_RECONCILE_INTERVAL_MS = "900000"
  ASHBY_RECLAIM_INTERVAL_MS = "60000"
  ASHBY_LEASE_SECONDS = "60"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  # Keep one instance warm. The voice worker calls /api/livekit/worker-context
  # on every candidate join and fails the session closed if that call errors.
  # A scale-to-zero cold start made that lookup transiently fail (DB/connection
  # not ready), so the bot never activated. One always-on machine removes the
  # cold-start window; scale-up above 1 is still automatic.
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 2048
