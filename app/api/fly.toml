app = "project-hello-api"
# Region: `sin` — where this app's machine already runs. It said `bom` until
# PR104. `primary_region` is consulted when a resource is CREATED, so the stale
# value was invisible to every deploy of the existing machine and would have
# fired on the first host loss, scale-up or machine re-creation — the same wall
# that killed the first project-hello-phone-voice release. Editing it re-places
# no existing machine. All THREE Fly app configs in this repo are held to the
# allowlist in scripts/fly-region-policy.mjs by
# scripts/validate-voice-worker-apps.mjs.
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8787"
  SUPABASE_SCHEMA = "screening_v2"
  COMPANY_NAME = "Interview Kickstart"
  WEB_ORIGIN = "https://ib-ik-project-hello.vercel.app"
  # Official DeepSeek gateway running V4-Flash. The former "test/" prefix +
  # ikey-gateway origin belonged to the internal proxy and would 404 on the
  # official endpoint, so both model ids and the base URL move together.
  # NOTE (deploy prerequisite): the DEEPSEEK_API_KEY Fly SECRET must now be an
  # OFFICIAL DeepSeek key — the ikey-gateway key will not authenticate here.
  DEEPSEEK_MODEL = "deepseek-v4-flash"
  DEEPSEEK_SCORING_MODEL = "deepseek-v4-flash"
  DEEPSEEK_BASE_URL = "https://api.deepseek.com/v1/chat/completions"
  DEEPSEEK_TIMEOUT_MS = "120000"
  DEEPSEEK_MAX_OUTPUT_BYTES = "5242880"
  RECORDINGS_BUCKET = "recordings_v2"
  RECORDING_DOWNLOAD_TTL_SEC = "300"
  RECORDING_MAX_BYTES = "26214400"
  WORKER_CONTEXT_TIMEOUT_SEC = "5"
  RESUME_SCANNER = "clamav"
  # Real clamscan loads ~1 GiB of signatures on one shared CPU; 30s was below
  # measured cold-start cost. Scans are process-wide serialized in code.
  RESUME_SCANNER_TIMEOUT_MS = "120000"
  # Signature freshness. The scanner refuses every file whose screening would
  # rest on a database older than this, rather than trusting a stale
  # `clamscan` exit 0. Far stricter than ClamAV's own 7-day warning; the
  # updater below refreshes hourly, so 24h leaves ~23 consecutive failures of
  # headroom before ingestion is blocked.
  RESUME_SCANNER_DB_DIR = "/var/lib/clamav"
  RESUME_SCANNER_MAX_DB_AGE_HOURS = "24"
  # Signature updater (container supervisor). No database is baked into the
  # image, so these own the whole lifecycle: one attempt at boot, then hourly.
  AV_UPDATER_INTERVAL_MS = "3600000"
  AV_UPDATER_TIMEOUT_MS = "600000"
  RESUME_MAX_COMPRESSED_BYTES = "10485760"
  # Resume parser child bounds. Both are read by resume-parser.ts itself and
  # CLAMPED there, so a typo degrades to the built-in default rather than
  # taking ingestion down. Neither is a secret.
  #
  # Timeout: raised from the 30s built-in to match the scanner's already-
  # corrected shared-CPU value above. The same single shared vCPU may be
  # mid-clamscan (which loads ~1 GiB of signatures) when a parse starts, and
  # 30s was chosen before that was true. This is a CONFIGURATION change made
  # on the scanner's measured precedent; it is NOT a claim that the live
  # canary's failure was a timeout. Until the new sub-classifier writes a
  # specific parse_* code, that cause is unnamed. Clamped to [1000, 300000].
  RESUME_PARSER_TIMEOUT_MS = "120000"
  # Child old-space cap (MiB), previously the hard literal 256. pdf.js
  # materialises font/glyph tables that make 256 MiB tight for a real-world
  # PDF, and this machine is shared/1cpu/2048MB. 512 leaves the scanner's
  # signature set room while removing the tightest suspected bound.
  # Clamped to [128, 1024]; same caveat as above — evidence-led headroom, not
  # a diagnosis. See docs/runbooks/ashby-resume-parse-recovery.md.
  RESUME_PARSER_CHILD_HEAP_MB = "512"
  RESUME_MAX_TEXT_LENGTH = "50000"
  SHUTDOWN_GRACE_MS = "30000"
  BREAKER_FAILURE_THRESHOLD = "5"
  BREAKER_COOLDOWN_MS = "30000"
  BREAKER_TIMEOUT_MS = "60000"
  RATE_LIMIT_DEFAULT = "100"
  RATE_LIMIT_STRICT = "20"
  RATE_LIMIT_IP = "300"
  RATE_LIMIT_WINDOW_SEC = "60"
  TRUSTED_PROXY = "loopback"
  # Ashby runtime: OFF. Flipping this to "true" additionally requires the
  # ASHBY_API_KEY and ASHBY_WEBHOOK_SECRET Fly SECRETS (never [env], never the
  # repo) and ASHBY_INTEGRATION_ENABLED. See docs/runbooks/ashby-runtime-activation.md.
  ASHBY_RUNTIME_ENABLED = "false"
  # Session-scoped scorecards for explicitly created re-screen cycles. Runtime
  # provider writes remain independently gated by ASHBY_RUNTIME_ENABLED and the
  # enabled tenant mapping.
  ASHBY_RESCREEN_SCORECARD_ENABLED = "true"
  # Empty ⇒ the resume-download SSRF allowlist stays DISABLED (fail-closed).
  ASHBY_RESUME_HOSTS = ""
  ASHBY_SIGNAL_POLL_MS = "5000"
  ASHBY_OPERATION_POLL_MS = "5000"
  ASHBY_RECONCILE_INTERVAL_MS = "900000"
  ASHBY_RECLAIM_INTERVAL_MS = "60000"
  ASHBY_LEASE_SECONDS = "60"
  # Phone canary flip (docs/runbooks/phone-worker-deployment.md §6): the exact
  # name of the dedicated phone worker (fly.phone.toml's PHONE_AGENT_NAME).
  # Non-empty means the API DISPATCHES phone rooms to that worker by name; the
  # validator (scripts/validate-voice-worker-apps.mjs) requires this to be
  # identical to the worker's value (`names_agree`) or absent entirely. This is
  # a dispatch name, not a secret. Setting it does NOT place calls by itself:
  # PHONE_SCREENING_ENABLED / PHONE_RUNTIME_ENABLED / PHONE_DIAL_MODE are
  # separate Fly SECRETS, all default-off.
  PHONE_AGENT_NAME = "phone-screener"
  # Browser worker on-demand orchestration (design §2.3b B-i), ACTIVATED
  # 2026-09-06. Non-empty means the API's exchange gate (invites.ts Step 2c)
  # confirms a READY browser worker and DISPATCHES the browser room to this
  # worker by name before minting a candidate join token. MUST equal the browser
  # worker's BROWSER_AGENT_NAME (fly.toml, "browser-screener"); a mismatch leaves
  # the room agent-less (checked only at runtime). Only takes effect together
  # with WORKER_ORCHESTRATION=true (already set). A dispatch name, not a secret.
  BROWSER_AGENT_NAME = "browser-screener"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  # Keep one instance warm. The voice worker calls /api/livekit/worker-context
  # on every candidate join and fails the session closed if that call errors.
  # A scale-to-zero cold start made that lookup transiently fail (DB/connection
  # not ready), so the bot never activated. One always-on machine removes the
  # cold-start window; scale-up above 1 is still automatic.
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 2048
