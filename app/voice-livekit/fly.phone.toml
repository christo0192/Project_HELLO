# Dedicated phone-screening voice worker — SEPARATE Fly app from the browser
# worker (project-hello-voice), same source image, different run posture.
#
# Why a second app at all:
#  - This worker is NAMED (PHONE_AGENT_NAME below is non-empty). A named LiveKit
#    Agents worker does NOT auto-dispatch; it receives only the phone rooms the
#    API explicitly dispatches to its name. The browser worker must stay UNNAMED
#    to keep auto-dispatching every browser room — so the two run postures
#    cannot coexist in one app, and naming the browser worker would silently
#    stop browser screening. Hence a distinct app.
#  - Rolling this worker back is simply NOT running it (see run policy below);
#    that requires no change to the browser worker at all.
#
# Run policy: ALWAYS_ON since the §6 canary flip
# (docs/runbooks/phone-worker-deployment.md §6).
#  - The owner scales this app to count 1 for the canary (`fly scale count 1 -a
#    project-hello-phone-voice`) and the deploy workflow's phone-voice job now
#    holds every release to the same watermarked CURRENT-registration proof as
#    the browser worker — an absent current registration fails the deploy
#    closed, and a stale log line can never satisfy it.
#  - Do NOT casually `fly scale count 0` this app while the API's
#    PHONE_AGENT_NAME names it: a dispatchable API with no worker is
#    dispatch-into-silence (§6a's worker_never_joined). Durable shutdown is the
#    §5 rollback — revert the §6 posture PR AND scale to zero; scale-to-zero
#    alone is resurrected by the next voice-source deploy.
#  - While (exceptionally) at count 0 the app accrues no VM-hours, storage only.
#    The browser worker's cost/always-on posture is unaffected either way.
#
# No public service: like the browser worker this is a LiveKit Agents worker,
# not an HTTP server. There is deliberately no [http_service]/[[services]]
# block, so the app exposes no public ingress and no port.
#
# Secrets: NONE are stored here. The LiveKit/Supabase/provider credentials and
# the SIP trunk value are injected as Fly app secrets at runtime by the owner
# (`fly secrets set -a project-hello-phone-voice ...`). Only non-secret app
# identity and the agent NAME live in VCS.

app = "project-hello-phone-voice"
# Region: `sin`, matching project-hello-voice and project-hello-api. NOT `bom`:
# Fly no longer accepts bom for NEW resource creation and recommended sin, and
# because this app had never been created, its very first release failed on that
# value before a machine existed. primary_region is consulted at CREATION time,
# so a deprecated value is invisible to a deploy of an already-created machine
# and fatal to the one deploy that has to create one. The allowlist in
# scripts/fly-region-policy.mjs is enforced by scripts/validate-voice-worker-apps.mjs.
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  COMPANY_NAME = "Interview Kickstart"
  SUPABASE_SCHEMA = "screening_v2"
  API_BASE = "https://project-hello-api.fly.dev"
  GEMINI_MODEL = "gemini-3.1-flash-lite"
  GEMINI_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/openai/"
  SARVAM_STT_MODEL = "saaras:v3"
  SARVAM_LANGUAGE = "en-IN"
  SARVAM_TTS_MODEL = "bulbul:v3"
  SARVAM_TTS_VOICE = "simran"
  LIVEKIT_WORKER_DRAIN_SEC = "10"
  CANDIDATE_SILENCE_PROMPT_SEC = "30"
  CANDIDATE_SILENCE_END_SEC = "20"
  PHONE_TERMINAL_REPLY_TIMEOUT_SEC = "10"
  WORKER_CONTEXT_TIMEOUT_SEC = "20"
  SCORING_BREAKER_THRESHOLD = "3"
  SCORING_BREAKER_COOLDOWN_SEC = "30"
  SCORING_BREAKER_TIMEOUT_SEC = "180"
  SCORING_HTTP_CONNECT_TIMEOUT = "10"
  SCORING_HTTP_READ_TIMEOUT = "180"
  SCORING_HTTP_WRITE_TIMEOUT = "30"
  SCORING_HTTP_POOL_TIMEOUT = "10"
  # ── Phone worker identity ─────────────────────────────────────────────
  # NON-EMPTY on purpose: this is what makes the worker named. An empty value
  # here would turn this app into a second auto-dispatching browser worker,
  # which is exactly the failure this separate app exists to prevent — the
  # deploy validator rejects an empty/absent PHONE_AGENT_NAME in this config.
  # This is a dispatch name, not a secret and not the SIP trunk value.
  PHONE_AGENT_NAME = "phone-screener"
  PHONE_EVENT_TIMEOUT_SEC = "10"
  PHONE_PARTICIPANT_WAIT_SEC = "45"
  PHONE_CLASSIFY_TIMEOUT_SEC = "20"
  PHONE_ANSWER_TIMEOUT_SEC = "90"

# X1/VM PIN (2026-08-29 CPU-starvation incident): on `shared` CPU the worker's
# VAD/EOU compute backed up (VAD backlog 67 s), the Sarvam STT websocket died
# on a 1006 keepalive timeout, and a live mid-interview room was killed. The
# machines were scaled to performance-1x live that day; this pins that state so
# the next deploy does not REVERT them back to `shared`.
[[vm]]
  cpu_kind = "performance"
  cpus = 1
  memory_mb = 2048
