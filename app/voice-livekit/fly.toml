app = "project-hello-voice"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  COMPANY_NAME = "Interview Kickstart"
  SUPABASE_SCHEMA = "screening_v2"
  API_BASE = "https://project-hello-api.fly.dev"
  DEEPSEEK_MODEL = "deepseek-chat"
  DEEPSEEK_BASE_URL = "https://api.deepseek.com/v1"
  SARVAM_STT_MODEL = "saaras:v3"
  SARVAM_LANGUAGE = "en-IN"
  SARVAM_TTS_MODEL = "bulbul:v3"
  SARVAM_TTS_VOICE = "shubh"
  LIVEKIT_VAD_ACTIVATION_THRESHOLD = "0.7"
  LIVEKIT_VAD_MIN_SPEECH_DURATION = "0.3"
  LIVEKIT_VAD_MIN_SILENCE_DURATION = "0.65"
  LIVEKIT_VAD_PREFIX_PADDING_DURATION = "0.25"
  LIVEKIT_MIN_ENDPOINTING_DELAY = "0.35"
  LIVEKIT_MAX_ENDPOINTING_DELAY = "2.0"
  LIVEKIT_MIN_INTERRUPTION_DURATION = "0.75"
  LIVEKIT_MIN_INTERRUPTION_WORDS = "2"
  LIVEKIT_FALSE_INTERRUPTION_TIMEOUT = "1.2"
  LIVEKIT_WORKER_DRAIN_SEC = "10"
  WORKER_CONTEXT_TIMEOUT_SEC = "20"
  SCORING_BREAKER_THRESHOLD = "3"
  SCORING_BREAKER_COOLDOWN_SEC = "30"
  SCORING_BREAKER_TIMEOUT_SEC = "180"
  SCORING_HTTP_CONNECT_TIMEOUT = "10"
  SCORING_HTTP_READ_TIMEOUT = "180"
  SCORING_HTTP_WRITE_TIMEOUT = "30"
  SCORING_HTTP_POOL_TIMEOUT = "10"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 2048
