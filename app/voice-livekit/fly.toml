app = "project-hello-voice"
# Region: `sin` — where this app's machine already runs. The value said `bom`
# until PR104, which was stale rather than harmless: primary_region is read when
# a resource is CREATED, so a scale-up or machine re-creation would have tried a
# region Fly no longer accepts for new resources (it is what broke the first
# project-hello-phone-voice release). Editing it re-places NO existing machine.
# Approved regions: scripts/fly-region-policy.mjs, enforced in CI by
# scripts/validate-voice-worker-apps.mjs.
primary_region = "sin"
# R1 A0 CUTOVER. This file's R1 posture (kill_timeout, R1_LANE_MODE and the two
# R1 drain keys) merges ONLY inside the forward-flip window, AFTER the API is on
# BROWSER_LIVEKIT_TARGET=r1 (docs/runbooks/r1-a0-cutover-checklist.md, step 4).
#
# kill_timeout: seconds Fly waits after the stop signal before it force-kills the
# VM. Fly's DEFAULT is 5 s, which would defeat the R1 drain below and cut a live
# interview mid-teardown. 300 is Fly's maximum; an IDLE worker has no job to drain
# and exits at once, so it costs nothing on the healthy path. It is declared
# TOGETHER with R1_DRAIN_TIMEOUT_SEC and R1_SHUTDOWN_PROCESS_TIMEOUT_SEC (in [env])
# because scripts/validate-voice-worker-apps.mjs requires all three the moment
# R1_LANE_MODE = "r1_only", and checks
#   R1_DRAIN_TIMEOUT_SEC + 2 x R1_SHUTDOWN_PROCESS_TIMEOUT_SEC + 30 <= kill_timeout
#   60 + 2 x 90 + 30 = 270 <= 300
kill_timeout = 300

[build]
  dockerfile = "Dockerfile"

[env]
  COMPANY_NAME = "Interview Kickstart"
  SUPABASE_SCHEMA = "screening_v2"
  API_BASE = "https://project-hello-api.fly.dev"
  GEMINI_MODEL = "gemini-3.1-flash-lite"
  GEMINI_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/openai/"
  SARVAM_STT_MODEL = "saaras:v3"
  SARVAM_LANGUAGE = "en-IN"
  SARVAM_TTS_MODEL = "bulbul:v3"
  SARVAM_TTS_VOICE = "simran"
  LIVEKIT_WORKER_DRAIN_SEC = "10"
  # R1 A0 CUTOVER POSTURE. "r1_only" makes this browser worker serve ONLY rooms the
  # API marks {"lane":"r1"}: an unmarked (legacy) room is refused and deleted. The
  # legacy browser lane is retired (API LEGACY_BROWSER_SCREENING_ENABLED = "false"),
  # so nothing legitimate is lost. It is only correct together with the API on
  # BROWSER_LIVEKIT_TARGET=r1 (the mode and the endpoint must change in the same
  # drained window: runbook "Room-routing contract", "Flip ordering"), so this line
  # merges ONLY after the API flip. Do NOT set it back to "off" while R1 sessions can
  # still be created, on the R1 SFU or on the Cloud fallback: the worker would refuse
  # every marked room. Rollback to Cloud keeps this value (runbook "Fallback flip
  # procedure", rollback: WORKERS FIRST, then the API).
  # DRAIN BUDGET: the two keys below are read only when the mode is "r1_only" and are
  # declared together with the top-level kill_timeout (top of file); see the budget
  # note there. Worker bounds: drain 30..60, shutdown 30..90.
  R1_LANE_MODE = "r1_only"
  R1_DRAIN_TIMEOUT_SEC = "60"
  R1_SHUTDOWN_PROCESS_TIMEOUT_SEC = "90"
  R1_LLM_MODEL = "deepseek-flash"
  R1_LLM_BASE_URL = "https://api.deepseek.com/v1"
  R1_SESSION_MAX_RESIDENCY_SEC = "1800"
  R1_REJOIN_GRACE_SEC = "90"
  CANDIDATE_SILENCE_PROMPT_SEC = "30"
  CANDIDATE_SILENCE_END_SEC = "20"
  PHONE_TERMINAL_REPLY_TIMEOUT_SEC = "10"
  WORKER_CONTEXT_TIMEOUT_SEC = "20"
  SCORING_BREAKER_THRESHOLD = "3"
  SCORING_BREAKER_COOLDOWN_SEC = "30"
  SCORING_BREAKER_TIMEOUT_SEC = "180"
  SCORING_HTTP_CONNECT_TIMEOUT = "10"
  SCORING_HTTP_READ_TIMEOUT = "180"
  SCORING_HTTP_WRITE_TIMEOUT = "30"
  SCORING_HTTP_POOL_TIMEOUT = "10"

  # ── PR B: on-demand orchestration for the BROWSER worker (design §2.3b B-i) ──
  # ACTIVATED 2026-09-06 (browser cost cut). BROWSER_AGENT_NAME names the worker
  # for explicit dispatch, and `build_worker_options` APPLIES the name (stopping
  # auto-dispatch) because WORKER_ORCHESTRATION == "worker". The browser worker
  # is now NAMED + scale-to-zero: the API's exchange gate (invites.ts Step 2c)
  # starts a pool machine, confirms it is READY for the session, and EXPLICITLY
  # dispatches this named worker into the room before minting a join token —
  # naming stops auto-dispatch, so the explicit dispatch is mandatory and lives
  # in the same gate. The name MUST equal the API's BROWSER_AGENT_NAME
  # (names_agree). Activation prerequisites (all satisfied before this flip):
  # the API's WORKER_ORCHESTRATION=true AND BROWSER_AGENT_NAME="browser-screener"
  # (app/api/fly.toml), and a provisioned stopped pool (register_voice_worker,
  # pipeline='browser'). Rollback = revert this flip AND scale the browser app
  # UP first (runbook docs/runbooks/phone-worker-orchestration-activation.md §5).
  BROWSER_AGENT_NAME = "browser-screener"
  WORKER_ORCHESTRATION = "worker"
  # BROWSER_WORKER_ONE_JOB and R1_READINESS_HOST are deliberately ABSENT: exact
  # `on` is set only at the R1 self-hosted cutover, after the host-aware API
  # readiness deploy. They are per-cutover Fly SECRETS on this app (step 4 of
  # docs/runbooks/r1-a0-cutover-checklist.md), never baked in here, so that a
  # rollback to Cloud only has to unset them (scripts/validate-voice-worker-apps.mjs
  # requires them absent from this file). Absent, this named Cloud worker boots and
  # reports readiness exactly as before (prewarm post, legacy body,
  # cli.run_app(WorkerOptions)).

# X1/VM PIN (2026-08-29 CPU-starvation incident): on `shared` CPU the worker's
# VAD/EOU compute backed up (VAD backlog 67 s), the Sarvam STT websocket died
# on a 1006 keepalive timeout, and a live mid-interview room was killed. The
# machines were scaled to performance-1x live that day; this pins that state so
# the next deploy does not REVERT them back to `shared`.
[[vm]]
  cpu_kind = "performance"
  cpus = 1
  memory_mb = 2048
