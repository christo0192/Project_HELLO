name: OCI Benchmark Quality

on:
  pull_request:
    paths:
      - 'infra/benchmarks/oci/**'
      - 'scripts/oci-benchmark-run'
      - 'docs/benchmarks/oci-*.md'
      - '.github/workflows/oci-benchmark-ci.yml'
  push:
    branches: [main]
    paths:
      - 'infra/benchmarks/oci/**'
      - 'scripts/oci-benchmark-run'
      - 'docs/benchmarks/oci-*.md'
      - '.github/workflows/oci-benchmark-ci.yml'

jobs:
  benchmark-tests:
    name: Benchmark CLI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Run benchmark self-tests
        run: python3 scripts/oci-benchmark-run self-test

      - name: Validate schema with synthetic fixture
        run: |
          python3 scripts/oci-benchmark-run fixture --scenario mumbai-low-latency -o json > /tmp/fixture.json
          python3 scripts/oci-benchmark-run schema-validate /tmp/fixture.json

      - name: Run calculator boundary tests
        run: |
          python3 scripts/oci-benchmark-run calculator -o json > /tmp/calc.json
          python3 scripts/oci-benchmark-run calculator --sessions-per-month 10000 --avg-session-minutes 60 --ocpus 3 -o json > /tmp/calc-over.json
          python3 scripts/oci-benchmark-run calculator --sessions-per-month 0 -o json > /tmp/calc-zero.json

      - name: Check NOT-YET-MEASURED claims
        run: |
          # Verify no file claims Mumbai or Hyderabad won
          ! grep -r "MUMBAI_PREFERRED\|HYDERABAD_PREFERRED" docs/benchmarks/oci-region-report-template.md || true
          # Verify the report template starts with NOT-YET-MEASURED
          grep "NOT-YET-MEASURED" docs/benchmarks/oci-region-report-template.md
          # Verify NOT-YET-MEASURED in audit doc
          grep "no measurements yet" docs/benchmarks/oci-region-benchmark-audit.md

  secret-scan:
    name: Secret scan (benchmark files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run gitleaks on benchmark paths
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
