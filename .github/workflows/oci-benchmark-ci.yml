name: OCI Benchmark Quality

on:
  pull_request:
    paths:
      - 'infra/benchmarks/oci/**'
      - 'scripts/oci-benchmark-run'
      - 'docs/benchmarks/oci-*.md'
      - '.github/workflows/oci-benchmark-ci.yml'
  push:
    branches: [main]
    paths:
      - 'infra/benchmarks/oci/**'
      - 'scripts/oci-benchmark-run'
      - 'docs/benchmarks/oci-*.md'
      - '.github/workflows/oci-benchmark-ci.yml'

jobs:
  benchmark-tests:
    name: Benchmark CLI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Run benchmark self-tests
        run: python3 scripts/oci-benchmark-run self-test

      - name: Validate schema with synthetic fixture
        run: |
          python3 scripts/oci-benchmark-run fixture --scenario mumbai-low-latency -o json > /tmp/fixture.json
          # Build a complete NOT-YET-MEASURED benchmark document for schema validation
          python3 -c "
import json
from datetime import datetime, timezone
now = datetime.now(timezone.utc).isoformat()
fixture = json.load(open('/tmp/fixture.json'))
doc = {
    'schemaVersion': '1.0.0',
    'benchmarkId': 'oci-region-bench-ci-20260728',
    'timestamp': now,
    'operator': 'ci',
    'regions': [
        {'regionId': 'ap-mumbai-1', 'displayName': 'Mumbai', 'provisioned': False},
        {'regionId': 'ap-hyderabad-1', 'displayName': 'Hyderabad', 'provisioned': False}
    ],
    'paths': [{
        'pathId': 'oci-mum-sup',
        'sourceRegion': 'ap-mumbai-1',
        'targetName': 'Supabase Mumbai',
        'targetType': 'supabase',
        'targetHost': 'ci-test.example.com',
        'targetPort': 443,
        'latencyResults': fixture
    }],
    'computeAvailability': {
        'regionsChecked': [
            {'regionId': 'ap-mumbai-1', 'a1Available': False, 'checkedAt': now}
        ]
    },
    'probeDetails': {'probeCount': 100, 'probeIntervalMs': 200, 'timeoutMs': 5000, 'protocols': ['TCP', 'TLS', 'HTTPS']},
    'summary': {
        'status': 'NOT-YET-MEASURED',
        'notYetMeasuredReason': 'CI synthetic test',
        'regionComparison': 'NOT-YET-MEASURED'
    }
}
json.dump(doc, open('/tmp/benchmark-doc.json', 'w'), indent=2)
print('Document:', json.dumps({k: type(v).__name__ for k, v in doc.items()}))
"
          python3 scripts/oci-benchmark-run schema-validate /tmp/benchmark-doc.json

      - name: Run calculator boundary tests
        run: |
          python3 scripts/oci-benchmark-run calculator -o json > /tmp/calc.json
          python3 scripts/oci-benchmark-run calculator --sessions-per-month 10000 --avg-session-minutes 60 --ocpus 3 -o json > /tmp/calc-over.json
          python3 scripts/oci-benchmark-run calculator --sessions-per-month 0 -o json > /tmp/calc-zero.json

      - name: Check NOT-YET-MEASURED claims
        run: |
          # Verify no file claims Mumbai or Hyderabad won
          ! grep -r "MUMBAI_PREFERRED\|HYDERABAD_PREFERRED" docs/benchmarks/oci-region-report-template.md || true
          # Verify the report template starts with NOT-YET-MEASURED
          grep "NOT-YET-MEASURED" docs/benchmarks/oci-region-report-template.md
          # Verify NOT-YET-MEASURED in audit doc
          grep "no measurements yet" docs/benchmarks/oci-region-benchmark-audit.md

  secret-scan:
    name: Secret scan (benchmark files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run secret scan on benchmark files
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
