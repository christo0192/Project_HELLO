name: Supabase Migration & Policy Validation

on:
  pull_request:
    paths:
      - 'app/supabase/**'
      - 'scripts/*synthetic*'
      - 'scripts/*seed*'
      - 'scripts/supabase-*.sh'
      - 'docs/runbooks/synthetic-*.md'
      - 'docs/runbooks/supabase-*.md'
      - 'docs/runbooks/mig-*.md'
      - 'docs/runbooks/phase6-*.md'
      - 'scripts/migrate-export.test.mjs'
      - 'scripts/migrate-reconcile.test.mjs'
      - 'scripts/storage-manifest.test.mjs'
      - 'scripts/migrate-rollback.test.mjs'
      - '.github/workflows/supabase-*.yml'
  push:
    branches: [main]
    paths:
      - 'app/supabase/**'
      - 'scripts/*synthetic*'
      - 'scripts/*seed*'
      - 'scripts/supabase-*.sh'
      - 'docs/runbooks/synthetic-*.md'
      - 'docs/runbooks/supabase-*.md'
      - 'docs/runbooks/mig-*.md'
      - 'docs/runbooks/phase6-*.md'
      - 'scripts/migrate-export.test.mjs'
      - 'scripts/migrate-reconcile.test.mjs'
      - 'scripts/storage-manifest.test.mjs'
      - 'scripts/migrate-rollback.test.mjs'
      - '.github/workflows/supabase-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supabase-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run migrations, policy tests, seed apply, rerun, SQL integration
        env:
          SUPABASE_CLI_VERSION: 2.110.0
        run: bash scripts/supabase-test.sh

  supabase-static-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate shell, JS, and text hygiene
        run: |
          bash -n scripts/supabase-local.sh scripts/supabase-test.sh
          # JS syntax check for all .mjs files
          for f in scripts/*.mjs; do node -c "$f" 2>&1 || exit 1; done
          if git grep -n -I -E '[[:blank:]]+$' -- \
            app/supabase/seed.sql \
            app/supabase/tests/synthetic_seed_tests.sql \
            app/supabase/config.toml \
            scripts/supabase-local.sh scripts/supabase-test.sh \
            scripts/check-synthetic-seed.mjs \
            scripts/check-synthetic-seed.test.mjs \
            docs/runbooks/synthetic-demo-data.md \
            docs/runbooks/supabase-migration-strategy.md \
            docs/runbooks/supabase-prod-apply.md; then
            echo 'ERROR: trailing whitespace found'
            exit 1
          fi
      - name: Reject unsafe migration patterns
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          errors = []
          migration_dir = pathlib.Path('app/supabase/migrations')
          files = sorted(migration_dir.glob('*.sql'))
          numbers = []
          for path in files:
              match = re.fullmatch(r'(\d{4})_[a-z0-9_]+\.sql', path.name)
              if not match:
                  errors.append(f'{path}: invalid migration filename')
                  continue
              numbers.append(match.group(1))
              text = path.read_text(encoding='utf-8')
              statements = [s.lower() for s in text.split(';')]
              for statement in statements:
                  compact = ' '.join(statement.split())
                  if re.search(r'grant all privileges .* to .*\b(anon|authenticated)\b', compact):
                      errors.append(f'{path}: broad browser-role GRANT')
                  if 'create policy' in compact and re.search(r'\bto\s+(anon|public)\b', compact):
                      errors.append(f'{path}: anon/PUBLIC policy')
                  if 'create policy' in compact and ' to authenticated' in compact and re.search(r'for (insert|update|delete|all)', compact):
                      errors.append(f'{path}: direct authenticated write policy')
                  if 'using (true)' in compact or 'with check (true)' in compact:
                      errors.append(f'{path}: unconditional RLS expression')
          if len(numbers) != len(set(numbers)):
              errors.append('duplicate migration number')

          config = pathlib.Path('app/supabase/config.toml').read_text(encoding='utf-8')
          if 'schemas = ["public", "graphql_public", "screening_v2"]' not in config:
              errors.append('config.toml: screening_v2 is not exposed locally')
          if not re.search(r'\[auth\].*?enable_signup = false', config, re.S):
              errors.append('config.toml: public Auth signup is not disabled')

          if errors:
              print('\n'.join(f'ERROR: {e}' for e in errors))
              sys.exit(1)
          print(f'Validated {len(files)} migrations and local Auth configuration.')
          PY
      - name: Phase 1 static security contract
        run: bash scripts/check-phase1-security-sql.sh
      - name: Phase 1 static security contract — mutation self-tests
        run: bash scripts/check-phase1-security-sql.test.sh
      - name: GOV-06 offline synthetic seed validation
        run: node scripts/check-synthetic-seed.mjs
      - name: GOV-06 mutation-based self-tests (zero network)
        run: node scripts/check-synthetic-seed.test.mjs

      # ── Phase 6 lane L4 — TST-15 offline migration rollback/compatibility
      #    verifier. Static half of the gate: destructive-change detector +
      #    contract-continuity across 0001–0013 + seeded negative fixture.
      #    The dynamic half (clean reset / roll-forward / restore rehearsal)
      #    runs inside scripts/supabase-test.sh in the supabase-check job.
      #    Forward-only strategy: no reverse SQL exists and none is invented.
      - name: TST-15 migration rollback & compatibility verifier (offline)
        run: node scripts/migrate-rollback.test.mjs

      # ── WS-B Phase 2 migration tooling (integrated single-PR; fail-closed) ──

      - name: WS-B Validate migrate-export syntax
        run: node -c scripts/migrate-export.test.mjs
      - name: WS-B Validate migrate-reconcile syntax
        run: node -c scripts/migrate-reconcile.test.mjs
      - name: WS-B Validate storage-manifest syntax
        run: node -c scripts/storage-manifest.test.mjs
      - name: WS-B Validate trailing whitespace in mig runbooks
        run: |
          if git grep -n -I -E '[[:blank:]]+$' -- docs/runbooks/mig-*.md; then
            echo 'ERROR: trailing whitespace found in MIG runbooks'
            exit 1
          fi
      - name: WS-B Run migrate-export tests (zero network)
        run: node scripts/migrate-export.test.mjs
      - name: WS-B Run migrate-reconcile tests (zero network)
        run: node scripts/migrate-reconcile.test.mjs
      - name: WS-B Run storage-manifest tests (zero network)
        run: node scripts/storage-manifest.test.mjs
