name: Deploy (Fly)

# Deploys the changed Fly service(s) after the required "Quality" checks pass on
# main. This closes the deployment-skew gap that let a merged fix (PR #48) sit
# undeployed on the voice worker while the API advanced — a merge to main now
# deploys exactly the service(s) whose sources changed.
#
# Three deploy targets, three separate Fly apps, three separate deploy tokens:
#   api          → project-hello-api         (FLY_API_TOKEN_API)
#   browser-voice→ project-hello-voice       (FLY_API_TOKEN_VOICE)
#   phone-voice  → project-hello-phone-voice (FLY_API_TOKEN_PHONE_VOICE)
# The two voice apps run the SAME source image (app/voice-livekit) with
# different run postures. Both are now NAMED, dispatch-only, and on-demand
# (scale-to-zero) via orchestration: phone since the §6 canary flip
# (docs/runbooks/phone-worker-deployment.md), browser since the 2026-09-06
# activation (docs/runbooks/phone-worker-orchestration-activation.md §8). A
# change to that shared source
# deploys BOTH voice apps — each with its OWN app-scoped token, never conflated.
#
# Security properties (this file is production security code):
#  - Least privilege: only `contents: read`. No write scopes.
#  - Runs ONLY after the Quality workflow concludes success on a push to main
#    (never on PRs, never on a failed/cancelled Quality run).
#  - Per-service concurrency groups serialize deploys and never cancel an
#    in-flight release (cancel-in-progress: false).
#  - Deploys only the service(s) with changed sources (path diff of the merge).
#  - Third-party and first-party actions are pinned to immutable full commit
#    SHAs (no floating tags, no @master), consistent with repo hardening policy.
#  - Database migrations are applied before ANY application deploy. A failed or
#    unavailable migration credential blocks every app deploy, preventing schema
#    / runtime skew (for example a worker writing a column production lacks).
#  - Per-app Fly tokens: each app job can use ONLY its own app-scoped token, so
#    a compromise of one job cannot deploy another app. Tokens are consumed only
#    as step env for flyctl, never echoed. Fly APP secrets (provider keys,
#    Supabase, LiveKit, SIP trunk) are untouched by this workflow.
#  - The phone job's STOPPED-era pre/post scale-to-zero (and its M-1-classified
#    precondition, PR104) were REMOVED by the §6 canary flip
#    (docs/runbooks/phone-worker-deployment.md §6): re-zeroing on every
#    shared-source merge is exactly what would silently kill a live canary
#    window (§6a). The phone lane's fail-closed control is now the same
#    current-registration proof the browser job carries. Rollback is runbook
#    §5: revert this posture PR and scale the phone app to zero.
#  - Post-deploy verification is CURRENT and POLICY-AWARE, never historical:
#      * api           → GET /api/health must return 200.
#      * browser-voice → run policy ALWAYS_ON: the worker must log "registered
#        worker" with a timestamp at/after a watermark captured immediately
#        before the release. A stale old registration line cannot satisfy it,
#        and an absent current registration is a TRUE worker-down failure (the
#        browser worker is production and must stay min-1/always-on).
#      * phone-voice   → run policy ALWAYS_ON (since the §6 canary flip): the
#        SAME watermarked current-registration proof as browser-voice, against
#        project-hello-phone-voice. A stale line cannot satisfy it, and an
#        absent current registration fails closed — a dispatchable phone lane
#        with no registered worker is dispatch-into-silence, not a policy
#        exemption.
#
# Prerequisite (one-time, owner action — NOT stored in VCS; no secret values):
#   App-scoped repository secrets must exist, each a `fly tokens create deploy
#   -a <app>` token:
#     FLY_API_TOKEN_API          → deploy access to project-hello-api ONLY
#     FLY_API_TOKEN_VOICE        → deploy access to project-hello-voice ONLY
#     FLY_API_TOKEN_PHONE_VOICE  → deploy access to project-hello-phone-voice ONLY
#     SUPABASE_DB_URL            → production Postgres connection URL used only by
#                                  the serialized migration job
#   Until they exist the corresponding job fails closed before deployment.

on:
  workflow_run:
    workflows: ["Quality"]
    types: [completed]
  workflow_dispatch:
    inputs:
      service:
        description: Service to redeploy manually (recovery valve)
        required: true
        type: choice
        options: [api, browser-voice, phone-voice, both, all]

permissions:
  contents: read

concurrency:
  group: fly-deploy-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  detect:
    # Gate: manual dispatch, OR a SUCCESSFUL Quality run triggered by a push to main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.decide.outputs.api }}
      voice: ${{ steps.decide.outputs.voice }}
      phone: ${{ steps.decide.outputs.phone }}
      database: ${{ steps.decide.outputs.database }}
      sha: ${{ steps.decide.outputs.sha }}
      # On-demand orchestration signal, read from the checked-out Fly config of
      # EACH voice app (not live Fly state): an app is orchestration-ON iff its
      # config declares `WORKER_ORCHESTRATION = "worker"` in [env] — the SAME
      # exact-string the worker runtime reads (worker_ready_api.py) to decide
      # whether it scales to zero, so the deploy gate and the worker can never
      # disagree. Config-as-signal is deliberate over a live `flyctl secrets`
      # probe: it is in the reviewed diff at the deploy SHA, needs no app token
      # before the branch decision, and is deterministic. Absent/"off"/anything
      # else ⇒ OFF ⇒ the always-on deploy path runs byte-identically to today.
      voice_orchestration: ${{ steps.decide.outputs.voice_orchestration }}
      phone_orchestration: ${{ steps.decide.outputs.phone_orchestration }}
    steps:
      - name: Resolve target SHA
        id: sha
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.x
        with:
          ref: ${{ steps.sha.outputs.sha }}
          fetch-depth: 2
      - name: Decide which services changed
        id: decide
        env:
          SVC: ${{ github.event.inputs.service }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          sha='${{ steps.sha.outputs.sha }}'
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # Default every target off, then turn on exactly what was requested.
            api=false; voice=false; phone=false
            case "$SVC" in
              api)           api=true ;;
              browser-voice) voice=true ;;
              phone-voice)   phone=true ;;
              both)          api=true; voice=true ;;
              all)           api=true; voice=true; phone=true ;;
              *) echo "::error::unknown service '$SVC'"; exit 1 ;;
            esac
            echo "api=$api"     >> "$GITHUB_OUTPUT"
            echo "voice=$voice" >> "$GITHUB_OUTPUT"
            echo "phone=$phone" >> "$GITHUB_OUTPUT"
            # Manual application deploys still apply every pending migration first.
            echo "database=true" >> "$GITHUB_OUTPUT"
            # A manual dispatch reconciles against the SAME config-flag signal as
            # a push, so a scaled-to-zero app can be recovered via the dispatch
            # valve without a false "no current registration" failure.
            if grep -Eq '^[[:space:]]*WORKER_ORCHESTRATION[[:space:]]*=[[:space:]]*"worker"[[:space:]]*$' app/voice-livekit/fly.toml 2>/dev/null; then
              echo "voice_orchestration=worker" >> "$GITHUB_OUTPUT"; else echo "voice_orchestration=off" >> "$GITHUB_OUTPUT"; fi
            if grep -Eq '^[[:space:]]*WORKER_ORCHESTRATION[[:space:]]*=[[:space:]]*"worker"[[:space:]]*$' app/voice-livekit/fly.phone.toml 2>/dev/null; then
              echo "phone_orchestration=worker" >> "$GITHUB_OUTPUT"; else echo "phone_orchestration=off" >> "$GITHUB_OUTPUT"; fi
            exit 0
          fi
          # Path diff of the merge commit (fallback to single-commit file list).
          changed="$(git diff --name-only "${sha}^" "${sha}" 2>/dev/null || git show --name-only --format= "${sha}")"
          echo "$changed" | grep -qE '^app/api/'          && echo "api=true"   >> "$GITHUB_OUTPUT" || echo "api=false"   >> "$GITHUB_OUTPUT"
          # The two voice apps share app/voice-livekit sources: a change there
          # deploys BOTH (browser and phone), each on its own app-scoped token.
          if echo "$changed" | grep -qE '^app/voice-livekit/'; then
            echo "voice=true" >> "$GITHUB_OUTPUT"
            echo "phone=true" >> "$GITHUB_OUTPUT"
          else
            echo "voice=false" >> "$GITHUB_OUTPUT"
            echo "phone=false" >> "$GITHUB_OUTPUT"
          fi
          echo "$changed" | grep -qE '^app/supabase/migrations/' && echo "database=true" >> "$GITHUB_OUTPUT" || {
            # Any application release first converges pending migrations. This
            # also recovers safely if an earlier migration job was interrupted.
            if echo "$changed" | grep -qE '^app/(api|voice-livekit)/'; then
              echo "database=true" >> "$GITHUB_OUTPUT"
            else
              echo "database=false" >> "$GITHUB_OUTPUT"
            fi
          }
          # On-demand orchestration signal per voice app, read from the checked-out
          # Fly config's [env]. ON iff `WORKER_ORCHESTRATION = "worker"` (the exact
          # string the worker runtime gates on). Absent/"off"/other ⇒ OFF, and the
          # emitted value is exactly "off" so the byte-identical always-on path runs.
          orch() { # $1 = config path relative to app/voice-livekit
            local cfg="app/voice-livekit/$1"
            if grep -Eq '^[[:space:]]*WORKER_ORCHESTRATION[[:space:]]*=[[:space:]]*"worker"[[:space:]]*$' "$cfg" 2>/dev/null; then
              echo "worker"
            else
              echo "off"
            fi
          }
          echo "voice_orchestration=$(orch fly.toml)"       >> "$GITHUB_OUTPUT"
          echo "phone_orchestration=$(orch fly.phone.toml)" >> "$GITHUB_OUTPUT"

  migrate-production:
    needs: detect
    if: needs.detect.outputs.database == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: supabase-production-migrations
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.x
        with:
          ref: ${{ needs.detect.outputs.sha }}
      - name: Apply pending production migrations
        working-directory: app/supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo "::error::SUPABASE_DB_URL is not configured"; exit 1; }
          npx --yes supabase@2.110.0 db push --db-url "$SUPABASE_DB_URL" --include-all

  deploy-api:
    needs: [detect, migrate-production]
    if: needs.detect.outputs.api == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.x
        with:
          ref: ${{ needs.detect.outputs.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # v1.5
      - name: Deploy API
        working-directory: app/api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_API }}
        run: flyctl deploy --remote-only --config fly.toml
      - name: Verify /api/health (current)
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' https://project-hello-api.fly.dev/api/health || true)"
            if [ "$code" = "200" ]; then echo "API healthy (200)"; exit 0; fi
            sleep 5
          done
          echo "::error::API health check did not return 200"; exit 1

  deploy-browser-voice:
    needs: [detect, migrate-production]
    if: needs.detect.outputs.voice == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy-browser-voice
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.x
        with:
          ref: ${{ needs.detect.outputs.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # v1.5
      # ── ALWAYS-ON path (orchestration OFF). BYTE-IDENTICAL to the historical
      #    steps: the only addition is the `if:` guard selecting this branch when
      #    the browser app is NOT orchestration-ON. With the shipped config
      #    (WORKER_ORCHESTRATION = "off") this is the path that runs, exactly as
      #    before. ──
      - name: Deploy browser voice worker
        id: deploy
        if: needs.detect.outputs.voice_orchestration != 'worker'
        working-directory: app/voice-livekit
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_VOICE }}
        run: |
          set -euo pipefail
          # Watermark captured BEFORE the release so the registration check below
          # cannot be satisfied by a stale historical "registered worker" line.
          echo "watermark=$(date -u +%Y-%m-%dT%H:%M:%S)" >> "$GITHUB_OUTPUT"
          flyctl deploy --remote-only --config fly.toml
      - name: Verify CURRENT worker registration (run policy ALWAYS_ON)
        if: needs.detect.outputs.voice_orchestration != 'worker'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_VOICE }}
          WATERMARK: ${{ steps.deploy.outputs.watermark }}
        run: |
          set -euo pipefail
          if [ -z "${WATERMARK:-}" ]; then
            echo "::error::empty pre-release watermark - the deploy step's output did not arrive; refusing to verify (an empty watermark would accept ANY historical 'registered worker' line)"; exit 1
          fi
          # The browser worker is production and MUST stay min-1/always-on. An
          # absent current registration is a genuine worker-down incident, not a
          # policy exemption: this check fails closed on it.
          flyctl status -a project-hello-voice
          # Accept ONLY a "registered worker" line whose ISO-8601 log timestamp is
          # at/after the pre-deploy watermark (ISO-8601 sorts lexically), tying the
          # evidence to the release this job just created — not an old log line.
          for i in $(seq 1 24); do
            ts="$(flyctl logs -a project-hello-voice --no-tail 2>/dev/null \
                  | grep 'registered worker' \
                  | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}' \
                  | sort | tail -1 || true)"
            if [ -n "$ts" ] && [ "$(printf '%s\n%s\n' "$WATERMARK" "$ts" | sort | tail -1)" = "$ts" ]; then
              echo "browser voice worker re-registered at $ts (>= watermark $WATERMARK)"; exit 0
            fi
            sleep 5
          done
          # Surface ONE unsuppressed logs attempt so a logs-transport or token
          # failure is distinguishable from a genuinely unregistered worker.
          flyctl logs -a project-hello-voice --no-tail || true
          echo "::error::no current 'registered worker' log at/after watermark $WATERMARK on project-hello-voice"; exit 1
      # ── ON-DEMAND path (orchestration ON). Runs ONLY when the browser app
      #    declares WORKER_ORCHESTRATION = "worker" (scaled to zero). It starts a
      #    pool machine, runs the SAME watermarked current-registration proof
      #    against it, deploys, re-verifies, and returns the machine to STOPPED —
      #    cleaning up (only) a machine it started, on success OR failure. This
      #    lets a scaled-to-zero app deploy without a false "no current
      #    registration" failure, without discarding the registration safety. ──
      - name: Deploy browser voice worker on-demand (orchestration ON)
        if: needs.detect.outputs.voice_orchestration == 'worker'
        # Backstop for the reap-retry poll surface: bound the step so a genuinely
        # stuck deploy fails visibly instead of silently burning the 6h job cap.
        # The happy path is ~5 min; even a couple of retry rounds stay well under.
        timeout-minutes: 30
        working-directory: app/voice-livekit
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_VOICE }}
          APP: project-hello-voice
          FLY_CONFIG: fly.toml
        run: |
          set -euo pipefail
          # Pre-start watermark: captured BEFORE this script starts the machine,
          # so the pre-deploy registration proof cannot be satisfied by a stale line.
          export WATERMARK="$(date -u +%Y-%m-%dT%H:%M:%S)"
          bash "$GITHUB_WORKSPACE/scripts/deploy-voice-orchestration.sh"

  deploy-phone-voice:
    needs: [detect, migrate-production]
    if: needs.detect.outputs.phone == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy-phone-voice
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.x
        with:
          ref: ${{ needs.detect.outputs.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # v1.5
      # ── ALWAYS-ON path (orchestration OFF). BYTE-IDENTICAL to the historical
      #    §6-flip steps; the only addition is the `if:` guard selecting this
      #    branch when the phone app is NOT orchestration-ON. With the shipped
      #    config (fly.phone.toml has no WORKER_ORCHESTRATION) this is the path
      #    that runs, exactly as before. The §6 flip's ban on any re-zeroing in
      #    THIS branch stands (it must never scale a live always-on canary to 0). ──
      - name: Deploy phone voice worker (run policy ALWAYS_ON; dispatched by API name)
        id: deploy
        if: needs.detect.outputs.phone_orchestration != 'worker'
        working-directory: app/voice-livekit
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PHONE_VOICE }}
        run: |
          set -euo pipefail
          # §6 canary flip: live and dispatchable (API PHONE_AGENT_NAME names
          # this worker; same PR). The STOPPED-era scale-to-zero is gone on
          # purpose — see the header note and runbook §6a/§5. Watermark
          # captured BEFORE the release so the registration check below cannot
          # be satisfied by a stale historical "registered worker" line.
          echo "watermark=$(date -u +%Y-%m-%dT%H:%M:%S)" >> "$GITHUB_OUTPUT"
          flyctl deploy --remote-only --config fly.phone.toml
      - name: Verify CURRENT worker registration (run policy ALWAYS_ON)
        if: needs.detect.outputs.phone_orchestration != 'worker'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PHONE_VOICE }}
          WATERMARK: ${{ steps.deploy.outputs.watermark }}
        run: |
          set -euo pipefail
          if [ -z "${WATERMARK:-}" ]; then
            echo "::error::empty pre-release watermark - the deploy step's output did not arrive; refusing to verify (an empty watermark would accept ANY historical 'registered worker' line)"; exit 1
          fi
          # The phone worker is dispatchable by name from the API, so an absent
          # current registration is a genuine dispatch-into-silence incident,
          # not a policy exemption: this check fails closed on it.
          flyctl status -a project-hello-phone-voice
          # Accept ONLY a "registered worker" line whose ISO-8601 log timestamp
          # is at/after the pre-deploy watermark (ISO-8601 sorts lexically),
          # tying the evidence to the release this job just created — not an
          # old log line.
          for i in $(seq 1 24); do
            ts="$(flyctl logs -a project-hello-phone-voice --no-tail 2>/dev/null \
                  | grep 'registered worker' \
                  | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}' \
                  | sort | tail -1 || true)"
            if [ -n "$ts" ] && [ "$(printf '%s\n%s\n' "$WATERMARK" "$ts" | sort | tail -1)" = "$ts" ]; then
              echo "phone voice worker re-registered at $ts (>= watermark $WATERMARK)"; exit 0
            fi
            sleep 5
          done
          # Surface ONE unsuppressed logs attempt so a logs-transport or token
          # failure is distinguishable from a genuinely unregistered worker.
          flyctl logs -a project-hello-phone-voice --no-tail || true
          echo "::error::no current 'registered worker' log at/after watermark $WATERMARK on project-hello-phone-voice"; exit 1
      # ── ON-DEMAND path (orchestration ON). Runs ONLY when fly.phone.toml
      #    declares WORKER_ORCHESTRATION = "worker" (scaled to zero). Delegates to
      #    the shared reconciliation script: start pool machine -> verify CURRENT
      #    registration -> deploy -> re-verify -> STOP (only a machine it started,
      #    on success OR failure). The re-zeroing ban in the OFF branch above does
      #    NOT apply here: with orchestration ON the app's steady state IS stopped,
      #    so returning the pool machine to STOPPED is the intended posture, not a
      #    canary kill. The scale/stop lives in the SCRIPT, not this YAML. ──
      - name: Deploy phone voice worker on-demand (orchestration ON)
        if: needs.detect.outputs.phone_orchestration == 'worker'
        # Backstop for the reap-retry poll surface: bound the step so a genuinely
        # stuck deploy fails visibly instead of silently burning the 6h job cap.
        # The happy path is ~5 min; even a couple of retry rounds stay well under.
        timeout-minutes: 30
        working-directory: app/voice-livekit
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PHONE_VOICE }}
          APP: project-hello-phone-voice
          FLY_CONFIG: fly.phone.toml
        run: |
          set -euo pipefail
          # Pre-start watermark: captured BEFORE the script starts the machine.
          export WATERMARK="$(date -u +%Y-%m-%dT%H:%M:%S)"
          bash "$GITHUB_WORKSPACE/scripts/deploy-voice-orchestration.sh"
