name: OCI Infra Plan (Manual)

# Plan-only workflow. Requires OCI credentials (stored as GitHub secrets).
# Apply is EXPLICITLY impossible in this workflow.
# Only runs on manual workflow_dispatch — never automatic.
#
# DISABLED status: this workflow is defined but will fail until OCI auth secrets
# and a valid alert_email are configured. Unblock by setting GitHub environment
# secrets: OCI_TENANCY_OCID, OCI_USER_OCID, OCI_FINGERPRINT, OCI_PRIVATE_KEY,
# OCI_REGION, and providing a real alert_email at dispatch time.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      region:
        description: 'OCI region (e.g., ap-mumbai-1)'
        required: true
        type: string
        default: 'placeholder-region'
      alert_email:
        description: 'Alert notification email (required — replaces __CHANGE_ME__)'
        required: true
        type: string
        default: '__CHANGE_ME__'

jobs:
  terraform-plan:
    name: Terraform Plan (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment:
      name: oci-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5"

      - name: Terraform Init
        working-directory: infra/oracle/examples/${{ inputs.environment }}
        env:
          TF_VAR_region: ${{ inputs.region }}
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_alert_email: ${{ inputs.alert_email }}
        run: terraform init

      - name: Terraform Plan
        working-directory: infra/oracle/examples/${{ inputs.environment }}
        env:
          TF_VAR_region: ${{ inputs.region }}
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_alert_email: ${{ inputs.alert_email }}
        run: |
          terraform plan \
            -var="region=${{ inputs.region }}" \
            -var="alert_email=${{ inputs.alert_email }}" \
            -detailed-exitcode \
            | tee plan-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ "$EXIT_CODE" -eq 2 ]; then
            echo "Plan shows changes — manual review required."
          elif [ "$EXIT_CODE" -eq 1 ]; then
            echo "ERROR: Terraform plan failed."
            exit 1
          else
            echo "No changes detected."
          fi

      - name: Upload Plan Output (text only — NO binary plan)
        uses: actions/upload-artifact@v4
        with:
          name: plan-output-${{ inputs.environment }}
          path: infra/oracle/examples/${{ inputs.environment }}/plan-output.txt

  # Note: There is NO terraform-apply job in this workflow.
  # Binary plan files (tfplan) are NEVER uploaded as artifacts — they can
  # contain sensitive state metadata.
  # Apply is performed only through a separate, access-controlled runbook
  # with manual approval and change-control authorization.
  # See docs/runbooks/oci-platform-operator.md
