name: OCI Infra Plan (Manual)

# Plan-only workflow. Requires OCI credentials (stored as GitHub environment secrets).
# Apply is EXPLICITLY impossible in this workflow — there is NO terraform-apply job.
# Only runs on manual workflow_dispatch — never automatic.
#
# Required GitHub environment secrets (per environment: oci-staging, oci-production):
#   OCI_TENANCY_OCID, OCI_USER_OCID, OCI_FINGERPRINT, OCI_PRIVATE_KEY
# Alert email is also required via environment secret, NOT a plaintext dispatch input.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      region:
        description: 'OCI region (e.g., ap-mumbai-1)'
        required: true
        type: string
        default: 'placeholder-region'

jobs:
  terraform-plan:
    name: Terraform Plan (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment:
      name: oci-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5"

      - name: Terraform Init
        working-directory: infra/oracle/examples/${{ inputs.environment }}
        env:
          TF_VAR_region: ${{ inputs.region }}
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: terraform init

      - name: Terraform Plan
        working-directory: infra/oracle/examples/${{ inputs.environment }}
        env:
          TF_VAR_region: ${{ inputs.region }}
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          terraform plan \
            -var="region=${{ inputs.region }}" \
            -detailed-exitcode
          EXIT_CODE=$?
          if [ "$EXIT_CODE" -eq 2 ]; then
            echo "Plan shows changes — manual review required."
          elif [ "$EXIT_CODE" -eq 1 ]; then
            echo "ERROR: Terraform plan failed."
            exit 1
          else
            echo "No changes detected."
          fi

  # NOTE: No plan-output.txt artifact is uploaded. The plan output is visible
  # in the job log. No binary tfplan file is ever created or uploaded.
  #
  # There is NO terraform-apply job in this workflow. Apply is performed only
  # through a separate, access-controlled runbook with manual approval and
  # change-control authorization. See docs/runbooks/oci-platform-operator.md
