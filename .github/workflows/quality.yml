name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/api/package-lock.json
            app/web/package-lock.json
      - name: Validate environment contract
        run: node scripts/check-env-contract.mjs && node scripts/check-env-contract.test.mjs
      - name: Validate architecture decision records
        run: node scripts/check-adrs.mjs
      - name: Install, typecheck, and test API
        working-directory: app/api
        run: npm ci && npm run typecheck && npm test
      - name: Install, lint, and build web
        working-directory: app/web
        run: npm ci && npm run lint && npm run build
      - name: Compile LiveKit worker
        run: python3 -m py_compile app/voice-livekit/agent.py app/voice-livekit/persistence.py app/voice-livekit/prompting.py
