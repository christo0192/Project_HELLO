name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/api/package-lock.json
            app/web/package-lock.json
      - name: Validate current-state manifest
        run: node scripts/check-current-state.mjs && node scripts/check-current-state.test.mjs
      - name: Validate Phase0-2 build closure
        run: node scripts/check-phase0-2-build-status.test.mjs && node scripts/check-phase0-2-build-status.mjs
      - name: Validate environment contract
        run: node scripts/check-env-contract.mjs && node scripts/check-env-contract.test.mjs
      - name: Validate Fly deploy workflow contract
        run: node scripts/deploy-fly-workflow.test.mjs
      - name: Validate voice worker app configs (browser vs phone isolation)
        run: node scripts/validate-voice-worker-apps.mjs && node scripts/validate-voice-worker-apps.test.mjs
      - name: Validate isolated R1 LiveKit SFU spike config
        run: node scripts/validate-livekit-r1-sfu.mjs && node scripts/validate-livekit-r1-sfu.test.mjs && node infra/livekit-r1/entrypoint.test.mjs
      - name: Validate architecture decision records
        run: node scripts/check-adrs.mjs
      - name: Validate approved HR design system
        run: node scripts/validate-hr-design-system.mjs
      # ── PR106 — Canary-1 arming lives on the never-merged activation branch
      #    `canary1/arm`, which flips CANARY1_ARMED to true. The in-suite pin
      #    (phone-canary1-structural.test.ts §9) CANNOT catch a merge of that
      #    artifact: the pin travels WITH the branch, so the artifact inverts it
      #    and stays green. This gate does not travel — it lives on main and asks
      #    one question about main.
      #
      #    Runs on the DEFAULT BRANCH ONLY. On a pull request this step is skipped
      #    and the step below still runs, so a PR proves the gate is WIRED without
      #    ever evaluating it. That asymmetry is deliberate: the activation
      #    artifact's own PR must stay green, and a merge of it must turn main red.
      #
      #    A STEP rather than a job, because a skipped job surfaces as a NEUTRAL
      #    check, and a required status check that is sometimes neutral is how
      #    branch protection starts blocking merges for reasons nobody wants to
      #    debug during a canary window. A skipped step changes no check's identity.
      #
      #    `workflow_dispatch` on main does NOT run this, because the guard tests
      #    `github.event_name == 'push'`. That is a deliberate, stated limit: the
      #    manual path is the local `node scripts/check-main-disarmed.mjs`, which is
      #    what an operator should run anyway (runbook §4b). ──
      #    The verdict LINE is asserted, not just the exit code: a module that
      #    declines to run its assertion also exits 0, and that green would be
      #    indistinguishable from a real pass. `$(...)` is used rather than a
      #    pipe because `cmd | grep` reports GREP's exit code, not the gate's.
      - name: Validate main is disarmed (default branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          verdict="$(node scripts/check-main-disarmed.mjs)"
          echo "$verdict"
          case "$verdict" in
            *"main disarmed OK"*) ;;
            *) echo "the disarm gate produced NO verdict line - it evaluated nothing"; exit 1 ;;
          esac
      - name: Validate the disarm gate is wired (always)
        run: node scripts/check-main-disarmed.test.mjs
      # ── P8B — Canary-0's OFFLINE half. No database, no Docker, no network.
      #    It gates the sanitized manifest's schema and tamper detection, the
      #    zero-PSTN traps (including a disarmed-trap control), the static
      #    import scan, and the halt drill's refusal state machine. The
      #    substrate half runs in supabase-ci.yml, which has a real Postgres. ──
      - name: Phone Canary-0 offline gate (P8B)
        run: node scripts/phone-canary/canary0.test.mjs
      # ── PR104 (audit L-1) — ADR-0013's evidence counts are the auditable
      #    claim, so they are checked against what the suites actually report
      #    rather than maintained by hand. Two-sided: the ADR drifting and the
      #    gate growing both fail here. ──
      - name: Phone Canary-0 evidence-count agreement (ADR-0013)
        run: node scripts/check-phone-canary-evidence.test.mjs
      - name: Install, typecheck, and test API
        working-directory: app/api
        run: npm ci && npm run typecheck && npm test
      # ── Phase 6 lane L4 — TST-01 coverage ratchet (L1 snippet; floors
      #    committed in app/api/vitest.config.ts; fail-closed below floor) ──
      - name: API coverage ratchet (TST-01)
        working-directory: app/api
        run: npm run test:coverage
      # ── Phase 6 lane L4 — TST-02/03/10 gate suites. These five files are
      #    already exercised by `npm test` above (1120 tests with full output)
      #    and re-instrumented in `test:coverage`. A third pass via an explicit
      #    `vitest run` would only duplicate runtime (~12 s) without adding
      #    distinct evidence. Gate visibility is satisfied by the named suite
      #    files appearing in the test and coverage output. Rationale documented
      #    in docs/runbooks/phase6-testing-ci.md §6. ──
      # Per-app exception scoping: the API and web dependency trees differ, so
      # each audit reads its OWN exceptions file. A transitive dep that is a
      # blocking advisory in one tree but absent from the other would otherwise
      # be flagged "stale" by the audit that doesn't see it. The API uses the
      # canonical default (.github/audit-exceptions.json); web uses an app-scoped
      # file passed by ABSOLUTE path (the script cd's into --dir, so a relative
      # --exceptions would resolve under app/web and 404).
      - name: Audit API dependencies
        run: bash scripts/audit-deps.sh --dir app/api
      - name: Install, lint, test, and build web
        working-directory: app/web
        run: npm ci && npm run lint && npm run test:typecheck && npm test && npm run build
      # ── Phase 6 lane L4 — TST-01 web coverage ratchet (L1 snippet) ──
      - name: Web coverage ratchet (TST-01)
        working-directory: app/web
        run: npm run test:coverage
      - name: Smoke-test CSP header
        run: node scripts/smoke-test-csp.mjs
      - name: Audit web dependencies
        run: bash scripts/audit-deps.sh --dir app/web --exceptions "$GITHUB_WORKSPACE/.github/audit-exceptions.web.json"
      - name: Run seeded dependency-policy test
        run: node scripts/audit-seeded-vuln.test.mjs
      # ── Phase 6 lane L4 — TST-05 offline deterministic SAST (repo-owned
      #    analyzer + ruleset; zero external service; fail-closed) and its
      #    self-tests (seeded unsafe fixtures prove red, safe fixtures prove
      #    precision; a runtime secret-shaped probe proves the SAST/gitleaks
      #    boundary — SAST never scans secrets/env) ──
      - name: Offline SAST + self-tests (TST-05)
        run: bash scripts/sast.sh && node scripts/sast.test.mjs
      # ── Phase 6 lane L4 — TST-15 migration rollback/compatibility verifier
      #    (offline static half: destructive-change detector + contract
      #    continuity + seeded negative fixture; the dynamic half — clean
      #    reset/roll-forward/restore rehearsal — runs in supabase-ci.yml) ──
      - name: Migration rollback & compatibility verifier (TST-15, offline)
        run: node scripts/migrate-rollback.test.mjs
      - name: Generate SBOMs
        run: bash scripts/sbom.sh
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sboms
          path: sbom-artifacts/*.cdx.json
          retention-days: 90
      - name: Compile LiveKit worker
        run: python3 -m py_compile app/voice-livekit/agent.py app/voice-livekit/gate_judge.py app/voice-livekit/noise_suppression.py app/voice-livekit/phone.py app/voice-livekit/phone_canary.py app/voice-livekit/persistence.py app/voice-livekit/prompting.py app/voice-livekit/observability.py app/voice-livekit/provenance.py app/voice-livekit/provider_resilience.py app/voice-livekit/r1_context.py app/voice-livekit/r1_lines.py app/voice-livekit/r1_llm.py app/voice-livekit/r1_persistence.py app/voice-livekit/r1_phases.py app/voice-livekit/r1_routing.py app/voice-livekit/r1_session.py app/voice-livekit/r1_commitment.py app/voice-livekit/r1_content.py app/voice-livekit/r1_guard.py app/voice-livekit/r1_personas.py app/voice-livekit/r1_prompts.py app/voice-livekit/r1_roleplay.py app/voice-livekit/r1_scheduler.py app/voice-livekit/r1_script.py app/voice-livekit/r1_text.py app/voice-livekit/r1_tracker.py app/voice-livekit/r1_world.py app/voice-livekit/r1_replies.py app/voice-livekit/r1_latency.py app/voice-livekit/r1_linecache.py app/voice-livekit/r1_tts.py
      - name: Test LiveKit worker
        run: cd app/voice-livekit && python3 -m unittest discover -s tests -p 'test_*.py' -v
      # Phone RNNoise (noise_suppression.py): the bare-python step above SKIPS
      # its DSP tests (no numpy/livekit/librnnoise), so the FIFO, frame-length
      # and real-library equivalence tests would otherwise never run in CI. Run
      # them against the production pins in an isolated venv — requirements.txt
      # plus pyrnnoise --no-deps, exactly as the Dockerfile installs them — and
      # fail if any of them skipped.
      - name: Test phone noise suppression (real DSP)
        run: |
          python3 -m venv /tmp/ns-venv
          /tmp/ns-venv/bin/pip install --no-cache-dir -q -r app/voice-livekit/requirements.txt
          /tmp/ns-venv/bin/pip install --no-cache-dir -q --no-deps pyrnnoise==0.4.5
          cd app/voice-livekit
          /tmp/ns-venv/bin/python -m unittest tests.test_noise_suppression -v > /tmp/ns-test.log 2>&1 || { cat /tmp/ns-test.log; exit 1; }
          cat /tmp/ns-test.log
          if grep -q "skipped" /tmp/ns-test.log; then echo "::error::RNNoise DSP tests skipped"; exit 1; fi
      # M013 S02 recording tail flush (recording.py `_FlushingRecorderIO`): it
      # reaches into livekit-agents 1.6.4 RecorderIO internals, so the bare-python
      # step above can only exercise it against fakes. Replay the real SDK
      # recorder (encode + decode with PyAV) in the venv the previous step built
      # from requirements.txt, and fail if any case skipped.
      - name: Test recording tail flush (real SDK)
        run: |
          cd app/voice-livekit
          /tmp/ns-venv/bin/python -m unittest tests.test_recorder_flush -v > /tmp/rf-test.log 2>&1 || { cat /tmp/rf-test.log; exit 1; }
          cat /tmp/rf-test.log
          if grep -q "skipped" /tmp/rf-test.log; then echo "::error::recording tail-flush SDK tests skipped"; exit 1; fi
      # M013 S01 gate: the turn barrier rests on livekit-agents 1.6.4
      # behaviours the bare-python step stubs away (clear_user_turn, a
      # non-interruptible say dropping a completed turn, user_state created_at,
      # the VAD timing fields, the agent-state toggle between back-to-back
      # says). Checked against the REAL pinned SDK in the venv the step above
      # built from requirements.txt; a skip is a failure.
      - name: Gate real-SDK contract (livekit-agents 1.6.4)
        run: |
          cd app/voice-livekit
          GATE_SDK_CONTRACT_REQUIRED=1 /tmp/ns-venv/bin/python -m unittest tests.test_gate_sdk_contract -v > /tmp/sdk-contract.log 2>&1 || { cat /tmp/sdk-contract.log; exit 1; }
          cat /tmp/sdk-contract.log
          if grep -Eq "\.\.\. skipped|skipped=" /tmp/sdk-contract.log; then echo "::error::gate SDK contract tests skipped"; exit 1; fi
      # R1 SDK contract (tests/test_r1_sdk_contract.py): the bare-python step above SKIPS
      # it (no livekit SDK there) and runs test_r1_core against stand-ins, so every
      # livekit-agents 1.6.4 fact the R1 worker relies on (no JobContext.close_room,
      # delete_room + shutdown, say() and LLM replies sharing one speech queue, the two
      # opposite item-reporting orders) would otherwise be pinned nowhere in CI and an
      # SDK bump could not fail it. Run them against the production pins in an isolated
      # venv (requirements.txt, with the exact SDK and rtc pins asserted) and fail if any
      # of them skipped. The skip grep matches unittest's own markers, not test names.
      - name: Test R1 SDK contract (livekit-agents 1.6.4)
        run: |
          python3 -m venv /tmp/r1-sdk-venv
          /tmp/r1-sdk-venv/bin/pip install --no-cache-dir -q -r app/voice-livekit/requirements.txt "livekit-agents==1.6.4" "livekit==1.1.12"
          /tmp/r1-sdk-venv/bin/python -c "import importlib.metadata as m; assert m.version('livekit-agents') == '1.6.4' and m.version('livekit') == '1.1.12', 'SDK pins drifted'"
          cd app/voice-livekit
          /tmp/r1-sdk-venv/bin/python -m unittest tests.test_r1_sdk_contract tests.test_r1_core tests.test_r1_fences tests.test_r1_commitment tests.test_r1_content_pin tests.test_r1_guard tests.test_r1_personas tests.test_r1_prompts tests.test_r1_roleplay tests.test_r1_scheduler tests.test_r1_script tests.test_r1_text tests.test_r1_tracker tests.test_r1_world tests.test_r1_integration tests.test_r1_admin_contract tests.test_r1_latency tests.test_r1_tts tests.test_r1_linecache -v > /tmp/r1-sdk-test.log 2>&1 || { cat /tmp/r1-sdk-test.log; exit 1; }
          cat /tmp/r1-sdk-test.log
          if grep -Eq '\.\.\. skipped|skipped=[0-9]+' /tmp/r1-sdk-test.log; then echo "::error::R1 SDK contract tests skipped"; exit 1; fi
      # R1 routing (tests/test_r1_routing.py): the only entrypoint routing and refuse-path
      # tests (delete_room + shutdown, padded mode, phone options identical). The suite skips
      # itself when the shared phone fixtures cannot import, it cannot run under the SDK
      # environment above, and the discover step reports a skip as a pass, so a broken import
      # would drop it silently. Run it alone on bare python and fail if any of it skipped.
      # tests/test_r1_shipping.py pins that every R1 test module is named by a guarded step.
      - name: Test R1 routing (bare python, no skips)
        run: |
          cd app/voice-livekit
          python3 -m unittest tests.test_r1_routing -v > /tmp/r1-routing-test.log 2>&1 || { cat /tmp/r1-routing-test.log; exit 1; }
          cat /tmp/r1-routing-test.log
          if grep -Eq '\.\.\. skipped|skipped=[0-9]+' /tmp/r1-routing-test.log; then echo "::error::R1 routing tests skipped"; exit 1; fi
      # R1 content (PR-4b, #353): the persona, deck-fact, script, scheduler, tracker, commitment
      # and guard modules are pure python. Run their suites alone on bare python and fail on any
      # skip, so an import break cannot pass as a skip (tests/test_r1_shipping.py pins this).
      - name: Test R1 content (bare python, no skips)
        run: |
          cd app/voice-livekit
          python3 -m unittest tests.test_r1_commitment tests.test_r1_content_pin tests.test_r1_guard tests.test_r1_personas tests.test_r1_prompts tests.test_r1_roleplay tests.test_r1_scheduler tests.test_r1_script tests.test_r1_text tests.test_r1_tracker tests.test_r1_world tests.test_r1_latency tests.test_r1_tts tests.test_r1_linecache -v > /tmp/r1-content-test.log 2>&1 || { cat /tmp/r1-content-test.log; exit 1; }
          cat /tmp/r1-content-test.log
          if grep -Eq '\.\.\. skipped|skipped=[0-9]+' /tmp/r1-content-test.log; then echo "::error::R1 content tests skipped"; exit 1; fi
