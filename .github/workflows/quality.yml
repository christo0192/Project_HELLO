name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/api/package-lock.json
            app/web/package-lock.json
      - name: Validate current-state manifest
        run: node scripts/check-current-state.mjs && node scripts/check-current-state.test.mjs
      - name: Validate Phase0-2 build closure
        run: node scripts/check-phase0-2-build-status.test.mjs && node scripts/check-phase0-2-build-status.mjs
      - name: Validate environment contract
        run: node scripts/check-env-contract.mjs && node scripts/check-env-contract.test.mjs
      - name: Validate Fly deploy workflow contract
        run: node scripts/deploy-fly-workflow.test.mjs
      - name: Validate voice worker app configs (browser vs phone isolation)
        run: node scripts/validate-voice-worker-apps.mjs && node scripts/validate-voice-worker-apps.test.mjs
      - name: Validate architecture decision records
        run: node scripts/check-adrs.mjs
      # ── PR106 — Canary-1 arming lives on the never-merged activation branch
      #    `canary1/arm`, which flips CANARY1_ARMED to true. The in-suite pin
      #    (phone-canary1-structural.test.ts §9) CANNOT catch a merge of that
      #    artifact: the pin travels WITH the branch, so the artifact inverts it
      #    and stays green. This gate does not travel — it lives on main and asks
      #    one question about main.
      #
      #    Runs on the DEFAULT BRANCH ONLY. On a pull request this step is skipped
      #    and the step below still runs, so a PR proves the gate is WIRED without
      #    ever evaluating it. That asymmetry is deliberate: the activation
      #    artifact's own PR must stay green, and a merge of it must turn main red.
      #
      #    A STEP rather than a job, because a skipped job surfaces as a NEUTRAL
      #    check, and a required status check that is sometimes neutral is how
      #    branch protection starts blocking merges for reasons nobody wants to
      #    debug during a canary window. A skipped step changes no check's identity.
      #
      #    `workflow_dispatch` on main does NOT run this, because the guard tests
      #    `github.event_name == 'push'`. That is a deliberate, stated limit: the
      #    manual path is the local `node scripts/check-main-disarmed.mjs`, which is
      #    what an operator should run anyway (runbook §4b). ──
      #    The verdict LINE is asserted, not just the exit code: a module that
      #    declines to run its assertion also exits 0, and that green would be
      #    indistinguishable from a real pass. `$(...)` is used rather than a
      #    pipe because `cmd | grep` reports GREP's exit code, not the gate's.
      - name: Validate main is disarmed (default branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          verdict="$(node scripts/check-main-disarmed.mjs)"
          echo "$verdict"
          case "$verdict" in
            *"main disarmed OK"*) ;;
            *) echo "the disarm gate produced NO verdict line - it evaluated nothing"; exit 1 ;;
          esac
      - name: Validate the disarm gate is wired (always)
        run: node scripts/check-main-disarmed.test.mjs
      # ── P8B — Canary-0's OFFLINE half. No database, no Docker, no network.
      #    It gates the sanitized manifest's schema and tamper detection, the
      #    zero-PSTN traps (including a disarmed-trap control), the static
      #    import scan, and the halt drill's refusal state machine. The
      #    substrate half runs in supabase-ci.yml, which has a real Postgres. ──
      - name: Phone Canary-0 offline gate (P8B)
        run: node scripts/phone-canary/canary0.test.mjs
      # ── PR104 (audit L-1) — ADR-0013's evidence counts are the auditable
      #    claim, so they are checked against what the suites actually report
      #    rather than maintained by hand. Two-sided: the ADR drifting and the
      #    gate growing both fail here. ──
      - name: Phone Canary-0 evidence-count agreement (ADR-0013)
        run: node scripts/check-phone-canary-evidence.test.mjs
      - name: Install, typecheck, and test API
        working-directory: app/api
        run: npm ci && npm run typecheck && npm test
      # ── Phase 6 lane L4 — TST-01 coverage ratchet (L1 snippet; floors
      #    committed in app/api/vitest.config.ts; fail-closed below floor) ──
      - name: API coverage ratchet (TST-01)
        working-directory: app/api
        run: npm run test:coverage
      # ── Phase 6 lane L4 — TST-02/03/10 gate suites. These five files are
      #    already exercised by `npm test` above (1120 tests with full output)
      #    and re-instrumented in `test:coverage`. A third pass via an explicit
      #    `vitest run` would only duplicate runtime (~12 s) without adding
      #    distinct evidence. Gate visibility is satisfied by the named suite
      #    files appearing in the test and coverage output. Rationale documented
      #    in docs/runbooks/phase6-testing-ci.md §6. ──
      - name: Audit API dependencies
        run: bash scripts/audit-deps.sh --dir app/api
      - name: Install, lint, test, and build web
        working-directory: app/web
        run: npm ci && npm run lint && npm run test:typecheck && npm test && npm run build
      # ── Phase 6 lane L4 — TST-01 web coverage ratchet (L1 snippet) ──
      - name: Web coverage ratchet (TST-01)
        working-directory: app/web
        run: npm run test:coverage
      - name: Smoke-test CSP header
        run: node scripts/smoke-test-csp.mjs
      - name: Audit web dependencies
        run: bash scripts/audit-deps.sh --dir app/web
      - name: Run seeded dependency-policy test
        run: node scripts/audit-seeded-vuln.test.mjs
      # ── Phase 6 lane L4 — TST-05 offline deterministic SAST (repo-owned
      #    analyzer + ruleset; zero external service; fail-closed) and its
      #    self-tests (seeded unsafe fixtures prove red, safe fixtures prove
      #    precision; a runtime secret-shaped probe proves the SAST/gitleaks
      #    boundary — SAST never scans secrets/env) ──
      - name: Offline SAST + self-tests (TST-05)
        run: bash scripts/sast.sh && node scripts/sast.test.mjs
      # ── Phase 6 lane L4 — TST-15 migration rollback/compatibility verifier
      #    (offline static half: destructive-change detector + contract
      #    continuity + seeded negative fixture; the dynamic half — clean
      #    reset/roll-forward/restore rehearsal — runs in supabase-ci.yml) ──
      - name: Migration rollback & compatibility verifier (TST-15, offline)
        run: node scripts/migrate-rollback.test.mjs
      - name: Generate SBOMs
        run: bash scripts/sbom.sh
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sboms
          path: sbom-artifacts/*.cdx.json
          retention-days: 90
      - name: Compile LiveKit worker
        run: python3 -m py_compile app/voice-livekit/agent.py app/voice-livekit/phone.py app/voice-livekit/phone_canary.py app/voice-livekit/persistence.py app/voice-livekit/prompting.py app/voice-livekit/observability.py app/voice-livekit/provenance.py app/voice-livekit/provider_resilience.py
      - name: Test LiveKit worker
        run: cd app/voice-livekit && python3 -m unittest discover -s tests -p 'test_*.py' -v
