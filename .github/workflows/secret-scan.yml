name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history (full depth for history scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan commits for secrets (committable tree)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_VERSION: 8.30.1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan full Git history for removed secrets
        shell: bash
        run: bash scripts/scan-git-history.sh
